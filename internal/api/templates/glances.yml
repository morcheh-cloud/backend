# Converted from Coolify's service templates (Apache-2.0).
name: Glances
category: Monitoring
description: An Eye on your system
website: https://nicolargo.github.io/glances/
logo: templates/glances.webp
env: PORT=61208
compose: |
  services:
    glances:
      image: nicolargo/glances:latest
      restart: unless-stopped
      environment:
        - GLANCES_OPT=-w
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock:ro
        - /run/user/1000/podman/podman.sock:/run/user/1000/podman/podman.sock:ro
      pid: host
      privileged: true
      healthcheck:
        test: [CMD, curl, -f, http://localhost:61208]
        interval: 2s
        timeout: 10s
        retries: 30
      ports:
        - ${PORT:-61208}:61208
