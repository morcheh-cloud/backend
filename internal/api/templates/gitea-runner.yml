# Converted from Coolify's service templates (Apache-2.0).
name: Gitea Actions Runner
category: Development
description: Gitea Actions runner for docker
website: https://github.com/go-gitea/gitea
tags:
  - gitea
  - actions
  - runner
  - docker
logo: templates/gitea.svg
env: |-
  # Optional settings
  GITEA_INSTANCE_URL=
  GITEA_RUNNER_REGISTRATION_TOKEN=
  GITEA_RUNNER_NAME=gitea-runner
  GITEA_RUNNER_LABELS=ubuntu-latest:docker://node:22
  GITEA_TOKEN=
compose: |
  services:
    runner:
      image: docker.io/gitea/runner:1.0.8
      restart: unless-stopped
      environment:
        - GITEA_INSTANCE_URL=${GITEA_INSTANCE_URL}
        - GITEA_RUNNER_REGISTRATION_TOKEN=${GITEA_RUNNER_REGISTRATION_TOKEN}
        - GITEA_RUNNER_NAME=${GITEA_RUNNER_NAME:-gitea-runner}
        - GITEA_RUNNER_LABELS=${GITEA_RUNNER_LABELS:-ubuntu-latest:docker://node:22}
        - GITEA_TOKEN=${GITEA_TOKEN}
      working_dir: /data
      volumes:
        - runner-data:/data
        - /var/run/docker.sock:/var/run/docker.sock
      healthcheck:
        test: [CMD-SHELL, "ps aux | grep '[R]unner' > /dev/null || exit 1"]
        interval: 5s
        timeout: 10s
        retries: 15
  volumes:
    runner-data:
