# Converted from Coolify's service templates (Apache-2.0).
name: OpenWA
category: Communication
description: Free, open source, self-hosted WhatsApp API gateway with bundled dashboard.
website: https://github.com/rmyndharis/OpenWA
tags:
  - whatsapp
  - api
  - gateway
  - messaging
  - automation
  - webhooks
  - open
  - source
logo: templates/openwa.webp
env: |-
  PORT=2785
  OPENWA_URL=http://{{host}}:${PORT}
  OPENWA_PASSWORD={{secret}}

  # Optional settings
  OPENWA_PIDS_LIMIT=2048
  OPENWA_MEM_LIMIT=2g
  LOG_LEVEL=info
  ENGINE_TYPE=whatsapp-web.js
  AUTO_START_SESSIONS=false
compose: |
  services:
    openwa:
      image: ghcr.io/rmyndharis/openwa:0.23.1
      restart: unless-stopped
      security_opt:
        - no-new-privileges:true
      cap_drop:
        - ALL
      cap_add:
        - CHOWN
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
      read_only: true
      tmpfs:
        - /tmp
      pids_limit: ${OPENWA_PIDS_LIMIT:-2048}
      mem_limit: ${OPENWA_MEM_LIMIT:-2g}
      environment:
        - NODE_ENV=production
        - HOME=/tmp
        - XDG_CONFIG_HOME=/tmp/.config
        - XDG_CACHE_HOME=/tmp/.cache
        - PORT=2785
        - LOG_LEVEL=${LOG_LEVEL:-info}
        - BASE_URL=${OPENWA_URL}
        - DASHBOARD_URL=${OPENWA_URL}
        - API_MASTER_KEY=${OPENWA_PASSWORD}
        - DATABASE_TYPE=sqlite
        - DATABASE_NAME=./data/openwa.sqlite
        - DATABASE_SYNCHRONIZE=true
        - DATABASE_LOGGING=false
        - ENGINE_TYPE=${ENGINE_TYPE:-whatsapp-web.js}
        - SESSION_DATA_PATH=./data/sessions
        - PUPPETEER_HEADLESS=true
        - PUPPETEER_ARGS=--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage
        - PUPPETEER_EXECUTABLE_PATH=/usr/local/bin/puppeteer-chrome
        - STORAGE_TYPE=local
        - STORAGE_LOCAL_PATH=./data/media
        - REDIS_ENABLED=false
        - QUEUE_ENABLED=false
        - CACHE_ENABLED=false
        - AUTO_START_SESSIONS=${AUTO_START_SESSIONS:-false}
      volumes:
        - openwa-data:/app/data
      healthcheck:
        test: [CMD, node, -e, "require('http').get('http://localhost:2785/api/health/ready', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 30s
      ports:
        - ${PORT:-2785}:2785
  volumes:
    openwa-data:
