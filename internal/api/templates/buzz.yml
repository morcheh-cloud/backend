# Converted from Coolify's service templates (Apache-2.0).
name: Buzz
category: Communication
description: Self-hostable workspace where humans and AI agents collaborate on a Nostr relay you own.
website: https://github.com/block/buzz
tags:
  - buzz
  - chat
  - nostr
  - agents
  - ai
  - collaboration
  - relay
  - block
logo: templates/buzz.svg
env: |-
  PORT=3000
  BUZZ_HOST={{host}}:${PORT}
  BUZZ_URL=http://{{host}}:${PORT}
  POSTGRES_USER={{user}}
  POSTGRES_PASSWORD={{secret}}
  REDIS_PASSWORD={{secret}}
  MINIO_USER={{user}}
  MINIO_PASSWORD={{secret}}
  RELAYKEY_HEX={{hex:64}}
  GITHMAC_HEX={{hex:64}}

  # Optional settings
  BUZZ_TAG=main
  POSTGRES_DB=buzz
  BUZZ_S3_BUCKET=buzz-media
  BUZZ_AUTO_MIGRATE=true
  BUZZ_GIT_CONFORMANCE_PROBE=true
  BUZZ_REQUIRE_AUTH_TOKEN=true
  BUZZ_REQUIRE_RELAY_MEMBERSHIP=false
  BUZZ_ALLOW_NIP_OA_AUTH=true
  RELAY_OWNER_PUBKEY=
  RUST_LOG="buzz_relay=info,buzz_db=info,buzz_auth=info,buzz_pubsub=info,tower_http=info"
compose: |
  services:
    buzz:
      image: ghcr.io/block/buzz:${BUZZ_TAG:-main}
      restart: unless-stopped
      environment:
        - BUZZ_BIND_ADDR=0.0.0.0:3000
        - BUZZ_HEALTH_PORT=8080
        - BUZZ_METRICS_PORT=9102
        - RELAY_URL=wss://${BUZZ_HOST}
        - BUZZ_MEDIA_BASE_URL=${BUZZ_URL}/media
        - BUZZ_MEDIA_SERVER_DOMAIN=${BUZZ_HOST}
        - BUZZ_CORS_ORIGINS=${BUZZ_URL},tauri://localhost,http://tauri.localhost
        - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-buzz}
        - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
        - BUZZ_S3_ENDPOINT=http://minio:9000
        - BUZZ_S3_ACCESS_KEY=${MINIO_USER}
        - BUZZ_S3_SECRET_KEY=${MINIO_PASSWORD}
        - BUZZ_S3_BUCKET=${BUZZ_S3_BUCKET:-buzz-media}
        - BUZZ_GIT_REPO_PATH=/data/git
        - BUZZ_RELAY_PRIVATE_KEY=${RELAYKEY_HEX}
        - BUZZ_GIT_HOOK_HMAC_SECRET=${GITHMAC_HEX}
        - BUZZ_AUTO_MIGRATE=${BUZZ_AUTO_MIGRATE:-true}
        - BUZZ_GIT_CONFORMANCE_PROBE=${BUZZ_GIT_CONFORMANCE_PROBE:-true}
        - BUZZ_REQUIRE_AUTH_TOKEN=${BUZZ_REQUIRE_AUTH_TOKEN:-true}
        - BUZZ_REQUIRE_RELAY_MEMBERSHIP=${BUZZ_REQUIRE_RELAY_MEMBERSHIP:-false}
        - BUZZ_ALLOW_NIP_OA_AUTH=${BUZZ_ALLOW_NIP_OA_AUTH:-true}
        - RELAY_OWNER_PUBKEY=${RELAY_OWNER_PUBKEY}
        - RUST_LOG=${RUST_LOG:-buzz_relay=info,buzz_db=info,buzz_auth=info,buzz_pubsub=info,tower_http=info}
      volumes:
        - buzz-git-data:/data/git
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
        minio:
          condition: service_healthy
        minio-init:
          condition: service_completed_successfully
      healthcheck:
        test: [CMD-SHELL, "curl -fsS http://127.0.0.1:8080/_readiness >/dev/null || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 12
        start_period: 45s
      ports:
        - ${PORT:-3000}:3000
    postgres:
      image: postgres:17-alpine
      restart: unless-stopped
      environment:
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DB:-buzz}
        - PGDATA=/var/lib/postgresql/data/pgdata
      volumes:
        - buzz-postgres-data:/var/lib/postgresql/data
      healthcheck:
        test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 5s
        retries: 12
        start_period: 10s
    redis:
      image: redis:7-alpine
      restart: unless-stopped
      command: [redis-server, --appendonly, yes, --requirepass, "${REDIS_PASSWORD}"]
      environment:
        - REDIS_PASSWORD=${REDIS_PASSWORD}
      volumes:
        - buzz-redis-data:/data
      healthcheck:
        test: [CMD-SHELL, "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
        interval: 5s
        timeout: 3s
        retries: 12
        start_period: 5s
    minio:
      image: pgsty/silo:RELEASE.2026-10-15T00-00-00Z
      restart: unless-stopped
      command: server /data --console-address ":9001"
      environment:
        - MINIO_ROOT_USER=${MINIO_USER}
        - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD}
      volumes:
        - buzz-minio-data:/data
      healthcheck:
        test: [CMD, mc, ready, local]
        interval: 5s
        timeout: 5s
        retries: 12
        start_period: 10s
    minio-init:
      image: pgsty/silo:RELEASE.2026-10-15T00-00-00Z
      depends_on:
        minio:
          condition: service_healthy
      environment:
        - BUZZ_S3_ACCESS_KEY=${MINIO_USER}
        - BUZZ_S3_SECRET_KEY=${MINIO_PASSWORD}
        - BUZZ_S3_BUCKET=${BUZZ_S3_BUCKET:-buzz-media}
      entrypoint:
        [
          /bin/sh,
          -euc,
          "mc alias set local http://minio:9000 \"$${BUZZ_S3_ACCESS_KEY}\" \"$${BUZZ_S3_SECRET_KEY}\"

            mc mb --ignore-existing \"local/$${BUZZ_S3_BUCKET}\"

            mc anonymous set none \"local/$${BUZZ_S3_BUCKET}\"\n"
        ]
      restart: no
  volumes:
    buzz-git-data:
    buzz-postgres-data:
    buzz-redis-data:
    buzz-minio-data:
