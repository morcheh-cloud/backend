# Converted from Coolify's service templates (Apache-2.0).
name: Flowise with databases
category: AI
description: Flowise is an open source low-code tool for developers to build customized LLM orchestration flows & AI agents. Also deploys Redis, Postgres and other services.
website: https://docs.flowiseai.com/
tags:
  - lowcode
  - nocode
  - ai
  - llm
  - openai
  - anthropic
  - machine-learning
  - rag
  - agents
  - chatbot
  - api
  - team
logo: templates/flowise.webp
env: |-
  FLOWISE_PORT=3001
  QDRANT_PORT=6333
  FLOWISE_USER={{user}}
  FLOWISE_PASSWORD={{secret}}
  POSTGRES_USER={{user}}
  POSTGRES_PASSWORD={{secret}}
  QDRANTAPIKEY_PASSWORD={{secret}}

  # Optional settings
  DEBUG=false
  DISABLE_FLOWISE_TELEMETRY=true
  PORT=3001
  POSTGRES_DB=pg-record-manager
compose: |
  services:
    flowise:
      image: flowiseai/flowise:latest
      restart: unless-stopped
      depends_on:
        pg-record-manager:
          condition: service_healthy
        redis-cache:
          condition: service_healthy
        qdrant:
          condition: service_healthy
      environment:
        - DEBUG=${DEBUG:-false}
        - DISABLE_FLOWISE_TELEMETRY=${DISABLE_FLOWISE_TELEMETRY:-true}
        - PORT=${PORT:-3001}
        - DATABASE_PATH=/root/.flowise
        - APIKEY_PATH=/root/.flowise
        - SECRETKEY_PATH=/root/.flowise
        - LOG_PATH=/root/.flowise/logs
        - BLOB_STORAGE_PATH=/root/.flowise/storage
        - FLOWISE_USERNAME=${FLOWISE_USER}
        - FLOWISE_PASSWORD=${FLOWISE_PASSWORD}
      volumes:
        - flowise-data:/root/.flowise
      healthcheck:
        test: [CMD-SHELL, "wget -qO- http://127.0.0.1:3001 || exit 1"]
        interval: 5s
        timeout: 5s
        retries: 3
      ports:
        - ${FLOWISE_PORT:-3001}:3001
    pg-record-manager:
      image: postgres:16
      restart: unless-stopped
      environment:
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DB:-pg-record-manager}
      volumes:
        - pg-record-manager-data:/var/lib/postgresql/data
      healthcheck:
        test: [CMD-SHELL, "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 5s
        retries: 10
        start_period: 20s
    redis-cache:
      image: redis:7
      restart: unless-stopped
      volumes:
        - flowise-redis-cache-data:/data
      healthcheck:
        test: [CMD-SHELL, redis-cli -h localhost -p 6379 ping]
        interval: 5s
        timeout: 5s
        retries: 3
    qdrant:
      image: qdrant/qdrant:latest
      restart: unless-stopped
      environment:
        - QDRANT__SERVICE__API_KEY=${QDRANTAPIKEY_PASSWORD}
      volumes:
        - flowise-qdrant-data:/qdrant/storage
      healthcheck:
        test: [CMD-SHELL, "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
        interval: 5s
        timeout: 5s
        retries: 3
      ports:
        - ${QDRANT_PORT:-6333}:6333
  volumes:
    flowise-data:
    pg-record-manager-data:
    flowise-redis-cache-data:
    flowise-qdrant-data:
