# Converted from Coolify's service templates (Apache-2.0).
name: Joplin
category: Productivity
description: Self-hosted sync server for Joplin
website: https://github.com/laurent22/joplin/blob/dev/packages/server/README.md
tags:
  - joplin
logo: templates/joplin.webp
env: |-
  PORT=22300
  POSTGRES_PASSWORD={{secret:64}}
  POSTGRES_USER={{user}}
  JOPLIN_URL=http://{{host}}:${PORT}
compose: |
  services:
    postgres:
      image: postgres:16
      restart: unless-stopped
      volumes:
        - joplin-postgresql-data:/var/lib/postgresql/data
      environment:
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_DB=joplin
      healthcheck:
        test: [CMD, pg_isready, -d, joplin]
        interval: 10s
        timeout: 5s
        retries: 5
    joplin:
      image: joplin/server:latest
      restart: unless-stopped
      platform: linux/amd64
      depends_on:
        postgres:
          condition: service_healthy
      environment:
        - APP_BASE_URL=${JOPLIN_URL}
        - DB_CLIENT=pg
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DATABASE=joplin
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PORT=5432
        - POSTGRES_HOST=postgres
      healthcheck:
        test: [CMD-SHELL, "bash -c ':> /dev/tcp/127.0.0.1/22300' || exit 1"]
        interval: 5s
        timeout: 20s
        retries: 3
      ports:
        - ${PORT:-22300}:22300
  volumes:
    joplin-postgresql-data:
