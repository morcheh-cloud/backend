# Converted from Coolify's service templates (Apache-2.0).
name: Activepieces
category: Automation
description: Open source no-code business automation.
website: https://www.activepieces.com/docs/getting-started/introduction
tags:
  - workflow
  - automation
  - no code
  - open source
logo: templates/activepieces.webp
env: |-
  PORT=8080
  APIKEY_PASSWORD={{secret:64}}
  ENCRYPTIONKEY_PASSWORD={{secret}}
  ACTIVEPIECES_URL=http://{{host}}:${PORT}
  JWT_PASSWORD={{secret:64}}
  POSTGRES_PASSWORD={{secret}}
  POSTGRES_USER={{user}}

  # Optional settings
  AP_ENGINE_EXECUTABLE_PATH=dist/packages/engine/main.js
  AP_ENVIRONMENT=prod
  AP_EXECUTION_MODE=UNSANDBOXED
  POSTGRES_DB=activepieces
  POSTGRES_HOST=postgres
  POSTGRES_PORT=5432
  REDIS_HOST=redis
  REDIS_PORT=6379
  AP_SANDBOX_RUN_TIME_SECONDS=600
  AP_TELEMETRY_ENABLED=false
  AP_TEMPLATES_SOURCE_URL=https://cloud.activepieces.com/api/v1/flow-templates
  AP_TRIGGER_DEFAULT_POLL_INTERVAL=5
  AP_SIGN_UP_ENABLED=true
  AP_WEBHOOK_TIMEOUT_SECONDS=30
compose: |
  services:
    activepieces:
      image: ghcr.io/activepieces/activepieces:0.75.0
      restart: unless-stopped
      environment:
        - AP_API_KEY=$APIKEY_PASSWORD
        - AP_ENCRYPTION_KEY=$ENCRYPTIONKEY_PASSWORD
        - AP_ENGINE_EXECUTABLE_PATH=${AP_ENGINE_EXECUTABLE_PATH:-dist/packages/engine/main.js}
        - AP_ENVIRONMENT=${AP_ENVIRONMENT:-prod}
        - AP_EXECUTION_MODE=${AP_EXECUTION_MODE:-UNSANDBOXED}
        - AP_FRONTEND_URL=${ACTIVEPIECES_URL}
        - AP_JWT_SECRET=$JWT_PASSWORD
        - AP_POSTGRES_DATABASE=${POSTGRES_DB:-activepieces}
        - AP_POSTGRES_HOST=${POSTGRES_HOST:-postgres}
        - AP_POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - AP_POSTGRES_PORT=${POSTGRES_PORT:-5432}
        - AP_POSTGRES_USERNAME=$POSTGRES_USER
        - AP_REDIS_HOST=${REDIS_HOST:-redis}
        - AP_REDIS_PORT=${REDIS_PORT:-6379}
        - AP_SANDBOX_RUN_TIME_SECONDS=${AP_SANDBOX_RUN_TIME_SECONDS:-600}
        - AP_TELEMETRY_ENABLED=${AP_TELEMETRY_ENABLED:-false}
        - AP_TEMPLATES_SOURCE_URL=${AP_TEMPLATES_SOURCE_URL:-https://cloud.activepieces.com/api/v1/flow-templates}
        - AP_TRIGGER_DEFAULT_POLL_INTERVAL=${AP_TRIGGER_DEFAULT_POLL_INTERVAL:-5}
        - AP_SIGN_UP_ENABLED=${AP_SIGN_UP_ENABLED:-true}
        - AP_WEBHOOK_TIMEOUT_SECONDS=${AP_WEBHOOK_TIMEOUT_SECONDS:-30}
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_started
      healthcheck:
        test: [CMD, curl, -f, http://127.0.0.1:80]
        interval: 5s
        timeout: 20s
        retries: 10
      ports:
        - ${PORT:-8080}:80
    postgres:
      image: postgres:18-alpine
      restart: unless-stopped
      environment:
        - POSTGRES_DB=${POSTGRES_DB:-activepieces}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      volumes:
        - pg-data:/var/lib/postgresql
      healthcheck:
        test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 20s
        retries: 10
    redis:
      image: redis:7-alpine
      restart: unless-stopped
      volumes:
        - redis_data:/data
      healthcheck:
        test: [CMD, redis-cli, ping]
        interval: 5s
        timeout: 20s
        retries: 10
  volumes:
    pg-data:
    redis_data:
