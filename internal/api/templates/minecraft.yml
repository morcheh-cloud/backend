# Converted from Coolify's service templates (Apache-2.0).
name: Minecraft
category: Games
description: Minecraft Server that will automatically download selected version at startup.
website: https://github.com/itzg/docker-minecraft-server
tags:
  - minecraft
logo: templates/minecraft.svg
featured: true
env: |-
  RCON_PASSWORD={{secret}}

  # Optional settings
  PORT=25565
  MINECRAFT_VERSION=latest
  MINECRAFT_TYPE=VANILLA
  MINECRAFT_SERVER_NAME="Minecraft Server"
  MINECRAFT_MOTD="Minecraft Server powered by §aCoolify§r"
  MINECRAFT_DIFFICULTY=normal
  MINECRAFT_MAX_PLAYERS=10
  MINECRAFT_MAX_WORLD_SIZE=10000
  MINECRAFT_VIEW_DISTANCE=10
  MINECRAFT_MAX_BUILD_HEIGHT=256
  MINECRAFT_MAX_TICK_TIME=60000
  MINECRAFT_ALLOW_NETHER=true
  MINECRAFT_ANNOUNCE_PLAYER_ACHIEVEMENTS=true
  MINECRAFT_GENERATE_STRUCTURES=true
  MINECRAFT_PVP=true
  MINECRAFT_GAME_MODE=survival
  MINECRAFT_FORCE_GAMEMODE=false
  MINECRAFT_HARDCORE=false
  MINECRAFT_ENABLE_COMMAND_BLOCK=false
  MINECRAFT_SPAWN_ANIMALS=true
  MINECRAFT_SPAWN_MONSTERS=true
  MINECRAFT_SPAWN_NPCS=true
  MINECRAFT_SNOOPER_ENABLED=false
  MINECRAFT_ONLINE_MODE=true
  MINECRAFT_PLAYER_IDLE_TIMEOUT=0
  MINECRAFT_INIT_MEMORY=256M
  MINECRAFT_MAX_MEMORY=1G
  MINECRAFT_GUI=false
  MINECRAFT_ENABLE_AUTOPAUSE=false
compose: |
  services:
    mc:
      image: itzg/minecraft-server
      restart: unless-stopped
      ports:
        - ${PORT}:25565
      environment:
        - EULA=true
        - VERSION=${MINECRAFT_VERSION:-latest}
        - TYPE=${MINECRAFT_TYPE:-VANILLA}
        - SERVER_NAME=${MINECRAFT_SERVER_NAME:-Minecraft Server}
        - MOTD=${MINECRAFT_MOTD:-Minecraft Server powered by §aCoolify§r}
        - DIFFICULTY=${MINECRAFT_DIFFICULTY:-normal}
        - MAX_PLAYERS=${MINECRAFT_MAX_PLAYERS:-10}
        - MAX_WORLD_SIZE=${MINECRAFT_MAX_WORLD_SIZE:-10000}
        - VIEW_DISTANCE=${MINECRAFT_VIEW_DISTANCE:-10}
        - MAX_BUILD_HEIGHT=${MINECRAFT_MAX_BUILD_HEIGHT:-256}
        - MAX_TICK_TIME=${MINECRAFT_MAX_TICK_TIME:-60000}
        - ALLOW_NETHER=${MINECRAFT_ALLOW_NETHER:-true}
        - ANNOUNCE_PLAYER_ACHIEVEMENTS=${MINECRAFT_ANNOUNCE_PLAYER_ACHIEVEMENTS:-true}
        - GENERATE_STRUCTURES=${MINECRAFT_GENERATE_STRUCTURES:-true}
        - PVP=${MINECRAFT_PVP:-true}
        - MODE=${MINECRAFT_GAME_MODE:-survival}
        - FORCE_GAMEMODE=${MINECRAFT_FORCE_GAMEMODE:-false}
        - HARDCORE=${MINECRAFT_HARDCORE:-false}
        - ENABLE_COMMAND_BLOCK=${MINECRAFT_ENABLE_COMMAND_BLOCK:-false}
        - SPAWN_ANIMALS=${MINECRAFT_SPAWN_ANIMALS:-true}
        - SPAWN_MONSTERS=${MINECRAFT_SPAWN_MONSTERS:-true}
        - SPAWN_NPCS=${MINECRAFT_SPAWN_NPCS:-true}
        - SNOOPER_ENABLED=${MINECRAFT_SNOOPER_ENABLED:-false}
        - ONLINE_MODE=${MINECRAFT_ONLINE_MODE:-true}
        - PLAYER_IDLE_TIMEOUT=${MINECRAFT_PLAYER_IDLE_TIMEOUT:-0}
        - INIT_MEMORY=${MINECRAFT_INIT_MEMORY:-256M}
        - MAX_MEMORY=${MINECRAFT_MAX_MEMORY:-1G}
        - GUI=${MINECRAFT_GUI:-false}
        - ENABLE_AUTOPAUSE=${MINECRAFT_ENABLE_AUTOPAUSE:-false}
        - RCON_PASSWORD=${RCON_PASSWORD}
        - PORT=${PORT:-25565}
      volumes:
        - ./minecraft-data:/data
      healthcheck:
        test: [CMD, /usr/local/bin/mc-monitor, status, --host, localhost]
        interval: 2s
        timeout: 10s
        retries: 15
