# Converted from Coolify's service templates (Apache-2.0).
name: Sequin
category: Analytics
description: The fastest Postgres change data capture
website: https://sequinstream.com/docs/
tags:
  - postgres
  - sync
  - data
logo: templates/sequin.svg
env: |-
  PORT=7376
  SEQUIN_HOST={{host}}:${PORT}
  POSTGRES_USER={{user}}
  POSTGRES_PASSWORD={{secret}}
  SECRETKEY_KEY={{base64:64}}
  VAULTKEY_KEY={{base64:32}}

  # Optional settings
  POSTGRES_DB=sequin-db
  FEATURE_ACCOUNT_SELF_SIGNUP=false
  SEQUIN_TELEMETRY_DISABLED=false
  CRASH_REPORTING_DISABLED=false
compose: |
  services:
    sequin:
      image: sequin/sequin:latest
      restart: unless-stopped
      environment:
        - SERVER_HOST=${SEQUIN_HOST}
        - PG_HOSTNAME=postgres
        - PG_DATABASE=${POSTGRES_DB:-sequin-db}
        - PG_PORT=5432
        - PG_USERNAME=${POSTGRES_USER}
        - PG_PASSWORD=${POSTGRES_PASSWORD}
        - PG_POOL_SIZE=20
        - SECRET_KEY_BASE=${SECRETKEY_KEY}
        - VAULT_KEY=${VAULTKEY_KEY}
        - REDIS_URL=redis://redis:6379
        - CONFIG_FILE_PATH=/config/playground.yml
        - FEATURE_ACCOUNT_SELF_SIGNUP=${FEATURE_ACCOUNT_SELF_SIGNUP:-false}
        - SEQUIN_TELEMETRY_DISABLED=${SEQUIN_TELEMETRY_DISABLED:-false}
        - CRASH_REPORTING_DISABLED=${CRASH_REPORTING_DISABLED:-false}
      depends_on:
        redis:
          condition: service_healthy
        postgres:
          condition: service_healthy
      healthcheck:
        test: [CMD, curl, http://localhost:7376/health]
      ports:
        - ${PORT:-7376}:7376
    postgres:
      image: postgres:16
      restart: unless-stopped
      environment:
        - POSTGRES_DB=${POSTGRES_DB:-sequin-db}
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      command: [postgres, -c, wal_level=logical]
      healthcheck:
        test: [CMD-SHELL, "pg_isready -U ${POSTGRES_USER} -d sequin"]
        interval: 10s
        timeout: 2s
        retries: 5
        start_period: 2s
        start_interval: 1s
      volumes:
        - postgres_data:/var/lib/postgresql/data
    redis:
      image: redis:7
      restart: unless-stopped
      command: [redis-server, --port, "6379"]
      healthcheck:
        test: [CMD, redis-cli, ping]
        interval: 5s
        timeout: 20s
        retries: 10
      volumes:
        - redis_data:/data
  volumes:
    postgres_data:
    redis_data:
