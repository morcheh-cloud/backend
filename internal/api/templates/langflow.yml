# Converted from Coolify's service templates (Apache-2.0).
name: Langflow
category: AI
description: Langflow is an open-source, Python-based, customizable framework for building AI applications.
website: https://docs.langflow.org
tags:
  - langflow
  - ai
  - openai
  - gpt
  - llm
  - workflow
  - automation
  - open source
  - low code
logo: templates/langflow.svg
env: |-
  PORT=7860
  LANGFLOW_USER={{user}}
  LANGFLOW_PASSWORD={{secret}}
  POSTGRES_USER={{user}}
  POSTGRES_PASSWORD={{secret}}

  # Optional settings
  LANGFLOW_AUTO_LOGIN=false
  POSTGRES_DB=langflow-db
compose: |
  services:
    langflow:
      image: langflowai/langflow:1.7.2
      restart: unless-stopped
      environment:
        - LANGFLOW_AUTO_LOGIN=${LANGFLOW_AUTO_LOGIN:-false}
        - LANGFLOW_SUPERUSER=$LANGFLOW_USER
        - LANGFLOW_SUPERUSER_PASSWORD=$LANGFLOW_PASSWORD
        - LANGFLOW_DATABASE_URL=postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/${POSTGRES_DB:-langflow-db}
        - LANGFLOW_CONFIG_DIR=app/langflow
        - LANGFLOW_HOST=0.0.0.0
        - PORT=7860
      healthcheck:
        test: [CMD-SHELL, curl -f http://127.0.0.1:7860/health]
        interval: 5s
        timeout: 20s
        retries: 10
      depends_on:
        postgres:
          condition: service_healthy
      volumes:
        - langflow-data:/app/langflow
      ports:
        - ${PORT:-7860}:7860
    postgres:
      image: postgres:18-alpine
      restart: unless-stopped
      environment:
        - POSTGRES_USER=$POSTGRES_USER
        - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
        - POSTGRES_DB=${POSTGRES_DB:-langflow-db}
      volumes:
        - langflow-postgres:/var/lib/postgres/data
      healthcheck:
        test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 20s
        retries: 10
  volumes:
    langflow-data:
    langflow-postgres:
