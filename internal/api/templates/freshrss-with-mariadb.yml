# Converted from Coolify's service templates (Apache-2.0).
name: FreshRSS with MariaDB
category: News & RSS
description: A free, self-hostable feed aggregator.
website: https://freshrss.org/index.html
tags:
  - rss
  - feed
logo: templates/freshrss.webp
env: |-
  PORT=8080
  MARIADB_USER={{user}}
  MARIADB_PASSWORD={{secret}}
  ROOT_PASSWORD={{secret}}

  # Optional settings
  CRON_MIN=1,31
  MARIADB_DATABASE=freshrss
compose: |
  services:
    freshrss:
      image: freshrss/freshrss:latest
      restart: unless-stopped
      environment:
        - CRON_MIN=${CRON_MIN:-1,31}
        - MARIADB_DB=${MARIADB_DATABASE:-freshrss}
        - MARIADB_USER=${MARIADB_USER}
        - MARIADB_PASSWORD=${MARIADB_PASSWORD}
      volumes:
        - freshrss-data:/var/www/FreshRSS/data
        - freshrss-extensions:/var/www/FreshRSS/extensions
      depends_on:
        freshrss-db:
          condition: service_healthy
      healthcheck:
        test: [CMD-SHELL, "bash -c ':> /dev/tcp/127.0.0.1/80' || exit 1"]
        interval: 5s
        timeout: 20s
        retries: 3
      ports:
        - ${PORT:-8080}:80
    freshrss-db:
      image: mariadb:11
      restart: unless-stopped
      volumes:
        - mariadb-data:/var/lib/mysql
      environment:
        - MYSQL_ROOT_PASSWORD=$ROOT_PASSWORD
        - MYSQL_DATABASE=${MARIADB_DATABASE:-freshrss}
        - MYSQL_USER=${MARIADB_USER}
        - MYSQL_PASSWORD=${MARIADB_PASSWORD}
      healthcheck:
        test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
        interval: 5s
        timeout: 20s
        retries: 10
  volumes:
    freshrss-data:
    freshrss-extensions:
    mariadb-data:
