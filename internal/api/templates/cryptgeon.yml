# Converted from Coolify's service templates (Apache-2.0).
name: Cryptgeon
category: Security
description: Secure note / file sharing service inspired by PrivNote.
website: https://github.com/cupcakearmy/cryptgeon
tags:
  - cryptgeon
  - secure
  - note
  - sharing
  - privnote
  - file
  - sharing
logo: templates/cryptgeon.webp
env: |-
  PORT=8000

  # Optional settings
  SIZE_LIMIT="4 MiB"
  MAX_VIEWS=100
  MAX_EXPIRATION=360
  ALLOW_ADVANCED=true
  ALLOW_FILES=true
compose: |
  services:
    app:
      image: cupcakearmy/cryptgeon:latest
      restart: unless-stopped
      environment:
        - SIZE_LIMIT=${SIZE_LIMIT:-4 MiB}
        - MAX_VIEWS=${MAX_VIEWS:-100}
        - MAX_EXPIRATION=${MAX_EXPIRATION:-360}
        - ALLOW_ADVANCED=${ALLOW_ADVANCED:-true}
        - ALLOW_FILES=${ALLOW_FILES:-true}
      depends_on:
        redis:
          condition: service_healthy
      healthcheck:
        test: [CMD, curl, --fail, http://127.0.0.1:8000/api/live/]
        interval: 1m
        timeout: 3s
        retries: 2
        start_period: 5s
      ports:
        - ${PORT:-8000}:8000
    redis:
      image: redis:7-alpine
      restart: unless-stopped
      command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru
      healthcheck:
        test: [CMD, redis-cli, PING]
        interval: 5s
        timeout: 10s
        retries: 2
