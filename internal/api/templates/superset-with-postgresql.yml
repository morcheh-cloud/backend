# Converted from Coolify's service templates (Apache-2.0).
name: Apache Superset
category: Analytics
description: Modern data exploration and visualization platform (unofficial community docker image)
website: https://github.com/amancevice/docker-superset
tags:
  - analytics
  - bi
  - dashboard
  - database
  - sql
  - unofficial
logo: templates/superset.svg
env: |-
  PORT=8088
  SUPERSETSECRETKEY_SECRET={{secret:64}}
  POSTGRES_USER={{user}}
  POSTGRES_PASSWORD={{secret}}
  REDIS_PASSWORD={{secret}}

  # Optional settings
  MAPBOX_API_KEY=
  POSTGRES_DB=superset-db
compose: |
  services:
    superset:
      image: amancevice/superset:6.0.0
      restart: unless-stopped
      environment:
        - SECRET_KEY=${SUPERSETSECRETKEY_SECRET}
        - MAPBOX_API_KEY=${MAPBOX_API_KEY}
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DB:-superset-db}
        - REDIS_PASSWORD=${REDIS_PASSWORD}
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
      healthcheck:
        test: [CMD, curl, -f, http://127.0.0.1:8088/health]
        interval: 5s
        timeout: 20s
        retries: 10
      ports:
        - ${PORT:-8088}:8088
      configs:
        - source: superset-superset_config.py
          target: /etc/superset/superset_config.py
    postgres:
      image: postgres:18
      restart: unless-stopped
      environment:
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DB:-superset-db}
      volumes:
        - superset_postgres_data:/var/lib/postgresql
      healthcheck:
        test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 20s
        retries: 10
    redis:
      image: redis:8
      restart: unless-stopped
      volumes:
        - superset_redis_data:/data
      command: redis-server --requirepass ${REDIS_PASSWORD}
      healthcheck:
        test: redis-cli ping
        interval: 5s
        timeout: 20s
        retries: 10
  volumes:
    superset_postgres_data:
    superset_redis_data:
  configs:
    superset-superset_config.py:
      content: |
        """
        For more configuration options, see:
        - https://superset.apache.org/docs/configuration/configuring-superset
        """

        import os

        SECRET_KEY = os.getenv("SECRET_KEY")
        MAPBOX_API_KEY = os.getenv("MAPBOX_API_KEY", "")

        CACHE_CONFIG = {
          "CACHE_TYPE": "RedisCache",
          "CACHE_DEFAULT_TIMEOUT": 300,
          "CACHE_KEY_PREFIX": "superset_",
          "CACHE_REDIS_HOST": "redis",
          "CACHE_REDIS_PORT": 6379,
          "CACHE_REDIS_DB": 1,
          "CACHE_REDIS_URL": f"redis://:{os.getenv('REDIS_PASSWORD')}@redis:6379/1",
        }

        FILTER_STATE_CACHE_CONFIG = {**CACHE_CONFIG, "CACHE_KEY_PREFIX": "superset_filter_"}
        EXPLORE_FORM_DATA_CACHE_CONFIG = {**CACHE_CONFIG, "CACHE_KEY_PREFIX": "superset_explore_form_"}

        SQLALCHEMY_TRACK_MODIFICATIONS = True
        SQLALCHEMY_DATABASE_URI = f"postgresql+psycopg2://{os.getenv('POSTGRES_USER')}:{os.getenv('POSTGRES_PASSWORD')}@postgres:5432/{os.getenv('POSTGRES_DB')}"

        # Uncomment if you want to load example data (using "superset load_examples") at the
        # same location as your metadata postgresql instance. Otherwise, the default sqlite
        # will be used, which will not persist in volume when restarting superset by default.
        #SQLALCHEMY_EXAMPLES_URI = SQLALCHEMY_DATABASE_URI
