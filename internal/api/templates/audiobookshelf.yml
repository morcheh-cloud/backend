# Converted from Coolify's service templates (Apache-2.0).
name: Audiobookshelf
category: Media
description: Self-hosted audiobook, ebook, and podcast server
website: https://www.audiobookshelf.org/
tags:
  - audiobooks
  - ebooks
  - podcasts
  - server
  - self-hosted
logo: templates/audiobookshelf.svg
env: |-
  PORT=8080

  # Optional settings
  TIMEZONE=America/Toronto
compose: |
  services:
    audiobookshelf:
      image: ghcr.io/advplyr/audiobookshelf:2.34.0
      restart: unless-stopped
      environment:
        - TZ=${TIMEZONE:-America/Toronto}
      volumes:
        - audiobookshelf-audiobooks:/audiobooks
        - audiobookshelf-podcasts:/podcasts
        - audiobookshelf-config:/config
        - audiobookshelf-metadata:/metadata
      healthcheck:
        test: [CMD-SHELL, "wget --quiet --tries=1 --timeout=5 http://localhost:80/ping -O /dev/null || exit 1"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 15s
      ports:
        - ${PORT:-8080}:80
  volumes:
    audiobookshelf-audiobooks:
    audiobookshelf-podcasts:
    audiobookshelf-config:
    audiobookshelf-metadata:
