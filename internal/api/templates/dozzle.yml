name: Dozzle
category: Monitoring
description: Live logs of every container in the browser (read-only Docker socket).
featured: true
env: |
  PORT=8888
compose: |
  services:
    dozzle:
      image: amir20/dozzle:latest
      restart: unless-stopped
      ports:
        - "127.0.0.1:${PORT:-8888}:8080"
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock:ro
