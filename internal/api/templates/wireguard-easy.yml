# Converted from Coolify's service templates (Apache-2.0).
name: WireGuard Easy
category: Networking
description: The easiest way to run WireGuard VPN + Web-based Admin UI.
website: https://github.com/wg-easy/wg-easy
tags:
  - wireguard
  - vpn
  - web
  - admin
logo: templates/wireguard.svg
featured: true
env: |-
  PORT=51821
  WIREGUARDEASY_HOST={{host}}:${PORT}
  ADMIN_PASSWORD={{secret}}

  # Optional settings
  LANG=en
compose: |
  services:
    wg-easy:
      image: ghcr.io/wg-easy/wg-easy:latest
      restart: unless-stopped
      environment:
        - WG_HOST=${WIREGUARDEASY_HOST}
        - LANG=${LANG:-en}
        - WG_PORT=51820
        - _PASSWORD=${ADMIN_PASSWORD}
      volumes:
        - wg-easy:/etc/wireguard
      ports:
        - 51820:51820/udp
        - ${PORT:-51821}:51821
      cap_add:
        - NET_ADMIN
        - SYS_MODULE
      sysctls:
        - net.ipv4.conf.all.src_valid_mark=1
        - net.ipv4.ip_forward=1
      entrypoint:
        [
          /bin/bash,
          -c,
          "eval \"wgpw '${ADMIN_PASSWORD}' > /pass-hash\"

            eval \"$(cat /pass-hash) dumb-init node server.js\"\n"
        ]
  volumes:
    wg-easy:
