# Converted from Coolify's service templates (Apache-2.0).
name: GlitchTip
category: Monitoring
description: GlitchTip is a error tracking system.
website: https://glitchtip.com
tags:
  - error
  - tracking
  - sentry
logo: templates/glitchtip.webp
env: |-
  PORT=8000
  POSTGRESQL_USER={{user}}
  POSTGRESQL_PASSWORD={{secret}}
  ENCRYPTION_SECRET={{secret:64}}
  GLITCHTIP_URL=http://{{host}}:${PORT}

  # Optional settings
  POSTGRESQL_DATABASE=glitchtip
  EMAIL_URL=consolemail://
  DEFAULT_FROM_EMAIL=test@example.com
  CELERY_WORKER_AUTOSCALE=1,3
  CELERY_WORKER_MAX_TASKS_PER_CHILD=10000
compose: |
  services:
    postgres:
      image: postgres:16-alpine
      restart: unless-stopped
      environment:
        - POSTGRES_USER=${POSTGRESQL_USER}
        - POSTGRES_PASSWORD=${POSTGRESQL_PASSWORD}
        - POSTGRES_DB=${POSTGRESQL_DATABASE:-glitchtip}
      volumes:
        - glitchtip-postgres-data:/var/lib/postgresql/data
      healthcheck:
        test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 20s
        retries: 10
    redis:
      image: redis
      restart: unless-stopped
      healthcheck:
        test: [CMD, redis-cli, ping]
        interval: 5s
        timeout: 20s
        retries: 10
    web:
      image: glitchtip/glitchtip:6.0
      restart: unless-stopped
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
      environment:
        - DATABASE_URL=postgres://$POSTGRESQL_USER:$POSTGRESQL_PASSWORD@postgres:5432/${POSTGRESQL_DATABASE:-glitchtip}
        - SECRET_KEY=$ENCRYPTION_SECRET
        - EMAIL_URL=${EMAIL_URL:-consolemail://}
        - GLITCHTIP_DOMAIN=${GLITCHTIP_URL}
        - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-test@example.com}
        - CELERY_WORKER_AUTOSCALE=${CELERY_WORKER_AUTOSCALE:-1,3}
        - CELERY_WORKER_MAX_TASKS_PER_CHILD=${CELERY_WORKER_MAX_TASKS_PER_CHILD:-10000}
      volumes:
        - uploads:/code/uploads
      healthcheck:
        test: [CMD, echo, ok]
        interval: 5s
        timeout: 20s
        retries: 10
      ports:
        - ${PORT:-8000}:8000
    worker:
      image: glitchtip/glitchtip:6.0
      restart: unless-stopped
      command: ./bin/run-celery-with-beat.sh
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
      environment:
        - DATABASE_URL=postgres://$POSTGRESQL_USER:$POSTGRESQL_PASSWORD@postgres:5432/${POSTGRESQL_DATABASE:-glitchtip}
        - SECRET_KEY=$ENCRYPTION_SECRET
        - EMAIL_URL=${EMAIL_URL:-consolemail://}
        - GLITCHTIP_DOMAIN=${GLITCHTIP_URL}
        - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-test@example.com}
        - CELERY_WORKER_AUTOSCALE=${CELERY_WORKER_AUTOSCALE:-1,3}
        - CELERY_WORKER_MAX_TASKS_PER_CHILD=${CELERY_WORKER_MAX_TASKS_PER_CHILD:-10000}
      volumes:
        - uploads:/code/uploads
      healthcheck:
        test: [CMD, echo, ok]
        interval: 5s
        timeout: 20s
        retries: 10
    migrate:
      image: glitchtip/glitchtip:6.0
      restart: no
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
      command: ./manage.py migrate
      environment:
        - DATABASE_URL=postgres://$POSTGRESQL_USER:$POSTGRESQL_PASSWORD@postgres:5432/${POSTGRESQL_DATABASE:-glitchtip}
        - SECRET_KEY=$ENCRYPTION_SECRET
        - EMAIL_URL=${EMAIL_URL:-consolemail://}
        - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-test@example.com}
        - CELERY_WORKER_AUTOSCALE=${CELERY_WORKER_AUTOSCALE:-1,3}
        - CELERY_WORKER_MAX_TASKS_PER_CHILD=${CELERY_WORKER_MAX_TASKS_PER_CHILD:-10000}
  volumes:
    glitchtip-postgres-data:
    uploads:
