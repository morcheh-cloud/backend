# Converted from Coolify's service templates (Apache-2.0).
name: Cloudflare Tunnel
category: Networking
description: Client for Cloudflare Tunnel, a daemon that exposes private services through the Cloudflare edge.
website: https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/
logo: templates/cloudflared.svg
featured: true
env: |-
  # Optional settings
  CLOUDFLARE_TUNNEL_TOKEN=
compose: |
  services:
    cloudflared:
      image: cloudflare/cloudflared:latest
      restart: unless-stopped
      network_mode: host
      command: tunnel --no-autoupdate run
      environment:
        - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
      healthcheck:
        test: [CMD, cloudflared, --version]
        interval: 5s
        timeout: 20s
        retries: 10
