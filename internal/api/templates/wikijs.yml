# Converted from Coolify's service templates (Apache-2.0).
name: Wiki.js
category: Websites
description: The most powerful and extensible open source Wiki software.
website: https://docs.requarks.io
tags:
  - wiki
  - collaboration
  - documentation
logo: templates/wikijs.webp
featured: true
env: |-
  PORT=3000
  POSTGRES_USER={{user}}
  POSTGRES_PASSWORD={{secret}}

  # Optional settings
  POSTGRESQL_DATABASE=wiki-db
compose: |
  services:
    wikijs:
      image: ghcr.io/requarks/wiki:2
      restart: unless-stopped
      depends_on:
        - postgres
      environment:
        - DB_TYPE=postgres
        - DB_HOST=postgres
        - DB_PORT=5432
        - DB_USER=${POSTGRES_USER}
        - DB_PASS=${POSTGRES_PASSWORD}
        - DB_NAME=${POSTGRESQL_DATABASE:-wiki-db}
      healthcheck:
        test: curl --fail http://localhost:3000 || exit 1
      ports:
        - ${PORT:-3000}:3000
    postgres:
      image: postgres:16-alpine
      restart: unless-stopped
      environment:
        - POSTGRES_DB=${POSTGRESQL_DATABASE:-wiki-db}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_USER=${POSTGRES_USER}
      healthcheck:
        test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 20s
        retries: 10
      logging:
        driver: none
      volumes:
        - wikijs-postgresql-data:/var/lib/postgresql/data
  volumes:
    wikijs-postgresql-data:
