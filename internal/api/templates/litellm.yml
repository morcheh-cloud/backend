# Converted from Coolify's service templates (Apache-2.0).
name: LiteLLM
category: AI
description: Call all LLM APIs using the OpenAI format. Use Bedrock, Azure, OpenAI, Cohere, Anthropic, Ollama, Sagemaker, HuggingFace, Replicate, Groq (100+ LLMs)
website: https://docs.litellm.ai
tags:
  - ai
  - qdrant
  - weaviate
  - langchain
  - openai
  - gpt
  - llm
  - lmops
  - anthropic
  - cohere
  - ollama
  - sagemaker
logo: templates/litellm.svg
env: |-
  PORT=4000
  MASTERKEY_PASSWORD={{secret}}
  SALTKEY_PASSWORD={{secret}}
  UI_USER={{user}}
  UI_PASSWORD={{secret}}
  POSTGRES_USER={{user}}
  POSTGRES_PASSWORD={{secret}}

  # Optional settings
  LITELLM_LOG=ERROR
  LITELLM_MODE=PRODUCTION
  POSTGRES_DB=litellm
  REDIS_HOST=redis
  REDIS_PORT=6379
  OPENAI_API_KEY=
  OPENAI_API_BASE=
  ANTHROPIC_API_KEY=
  ANTHROPIC_API_BASE=
  VOYAGE_API_KEY=
  VOYAGE_API_BASE=
  STORE_MODEL_IN_DB=True
compose: |
  services:
    litellm:
      image: ghcr.io/berriai/litellm-database:main-stable
      restart: unless-stopped
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
      environment:
        - LITELLM_LOG=${LITELLM_LOG:-ERROR}
        - LITELLM_MODE=${LITELLM_MODE:-PRODUCTION}
        - LITELLM_MASTER_KEY=sk-${MASTERKEY_PASSWORD}
        - LITELLM_SALT_KEY=${SALTKEY_PASSWORD}
        - UI_USERNAME=${UI_USER}
        - UI_PASSWORD=${UI_PASSWORD}
        - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-litellm}
        - REDIS_HOST=${REDIS_HOST:-redis}
        - REDIS_PORT=${REDIS_PORT:-6379}
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DB:-litellm}
        - OPENAI_API_KEY=${OPENAI_API_KEY}
        - OPENAI_API_BASE=${OPENAI_API_BASE}
        - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
        - ANTHROPIC_API_BASE=${ANTHROPIC_API_BASE}
        - VOYAGE_API_KEY=${VOYAGE_API_KEY}
        - VOYAGE_API_BASE=${VOYAGE_API_BASE}
        - STORE_MODEL_IN_DB=${STORE_MODEL_IN_DB:-True}
      healthcheck:
        test: [CMD, python, -c, "import urllib.request;urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness',timeout=5)"]
        interval: 30s
        timeout: 5s
        retries: 3
        start_period: 30s
      command: [--config, /app/config.yaml, --port, "4000", --num_workers, "2", --run_gunicorn, --max_requests_before_restart, "1000"]
      ports:
        - ${PORT:-4000}:4000
      configs:
        - source: litellm-config.yaml
          target: /app/config.yaml
    postgres:
      image: postgres:16-alpine
      restart: unless-stopped
      environment:
        - POSTGRES_DB=${POSTGRES_DB:-litellm}
        - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
        - POSTGRES_USER=$POSTGRES_USER
      volumes:
        - pg-data:/var/lib/postgresql/data
      healthcheck:
        test: [CMD-SHELL, "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 5s
        retries: 3
    redis:
      image: redis:7-alpine
      restart: unless-stopped
      command: redis-server --appendonly yes
      volumes:
        - redis-data:/data
      healthcheck:
        test: [CMD, redis-cli, ping]
        interval: 5s
        timeout: 5s
        retries: 3
  volumes:
    pg-data:
    redis-data:
  configs:
    litellm-config.yaml:
      content: |
        general_settings:
          proxy_batch_write_at: 60
          store_prompts_in_spend_logs: false

        router_settings:
          redis_host: os.environ/REDIS_HOST
          redis_port: os.environ/REDIS_PORT
          redis_password: os.environ/REDIS_PASSWORD
          enable_pre_call_check: true

        litellm_settings:
          set_verbose: false
          json_logs: true
          log_raw_request_response: false
          # turn_off_message_logging: false
          # redact_user_api_key_info: false
          service_callback: ["prometheus_system"]
          drop_params: true
          # max_budget: 100
          # budget_duration: 30d
          num_retries: 1
          request_timeout: 120
          telemetry: false
          cache: true
          cache_params:
            type: redis
            host: os.environ/REDIS_HOST
            port: os.environ/REDIS_PORT
            password: os.environ/REDIS_PASSWORD
            namespace: "litellm_cache"
            ttl: 600
          success_callback:
            # - "langfuse"
            - "prometheus"
          failure_callback:
            # - "langfuse"
            - "prometheus"
        model_list:
          # OpenAI
          - model_name: gpt-4
            litellm_params:
              model: openai/gpt-4
              api_key: os.environ/OPENAI_API_KEY
              api_base: os.environ/OPENAI_API_BASE
          - model_name: gpt-4o
            litellm_params:
              model: openai/gpt-4o
              api_key: os.environ/OPENAI_API_KEY
              api_base: os.environ/OPENAI_API_BASE
          - model_name: gpt-4o-mini
            litellm_params:
              model: openai/gpt-4o-mini
              api_key: os.environ/OPENAI_API_KEY
              api_base: os.environ/OPENAI_API_BASE
          # Anthropic
          - model_name: claude-3-haiku
            litellm_params:
              model: claude-3-haiku-20240307
              api_key: "os.environ/ANTHROPIC_API_KEY"
              api_base: "os.environ/ANTHROPIC_API_BASE"
          - model_name: claude-3.5-sonnet
            litellm_params:
              model: claude-3-5-sonnet-20240620
              api_key: "os.environ/ANTHROPIC_API_KEY"
              api_base: "os.environ/ANTHROPIC_API_BASE"
          # VoyageAI
          - model_name: voyage-law-2
            model_info:
              output_vector_size: 1024
            litellm_params:
              model: voyage/voyage-law-2
              api_key: "os.environ/VOYAGE_API_KEY"
              api_base: "os.environ/VOYAGE_API_BASE"
              # rpm: 300
              # tpm: 1000000
          - model_name: voyage-multilingual-2
            model_info:
              mode: embedding
              max_tokens: 32000
              max_input_tokens: 32000
              output_vector_size: 1024
            litellm_params:
              model: voyage/voyage-multilingual-2
              api_key: "os.environ/VOYAGE_API_KEY"
              api_base: "os.environ/VOYAGE_API_BASE"
              input_cost_per_token: 0.00000012
              output_cost_per_token: 0
              # rpm: 300
              # tpm: 1000000
