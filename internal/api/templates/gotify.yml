# Converted from Coolify's service templates (Apache-2.0).
name: Gotify
category: Communication
description: Gotify is an open-source self-hosted notification server.
website: https://gotify.net/docs/install
tags:
  - productivity
  - notification
  - collaboration
logo: templates/gotify.webp
featured: true
env: |-
  PORT=8080
  GOTIFY_PASSWORD={{secret}}

  # Optional settings
  GOTIFY_USERNAME=admin
  GOTIFY_DATABASE_DIALECT=sqlite3
  GOTIFY_DATABASE_CONNECTION=data/gotify.db
  GOTIFY_PASSSTRENGTH=10
  GOTIFY_UPLOADEDIMAGESDIR=data/images
  GOTIFY_PLUGINSDIR=data/plugins
  GOTIFY_SERVER_PORT=80
  GOTIFY_REGISTRATION=false
compose: |
  services:
    gotify:
      image: gotify/server:2.7.3
      restart: unless-stopped
      environment:
        - GOTIFY_DEFAULTUSER_NAME=${GOTIFY_USERNAME:-admin}
        - GOTIFY_DEFAULTUSER_PASS=${GOTIFY_PASSWORD}
        - GOTIFY_DATABASE_DIALECT=${GOTIFY_DATABASE_DIALECT:-sqlite3}
        - GOTIFY_DATABASE_CONNECTION=${GOTIFY_DATABASE_CONNECTION:-data/gotify.db}
        - GOTIFY_PASSSTRENGTH=${GOTIFY_PASSSTRENGTH:-10}
        - GOTIFY_UPLOADEDIMAGESDIR=${GOTIFY_UPLOADEDIMAGESDIR:-data/images}
        - GOTIFY_PLUGINSDIR=${GOTIFY_PLUGINSDIR:-data/plugins}
        - GOTIFY_SERVER_PORT=${GOTIFY_SERVER_PORT:-80}
        - GOTIFY_REGISTRATION=${GOTIFY_REGISTRATION:-false}
      volumes:
        - gotify-data:/app/data
      healthcheck:
        test: [CMD, curl, -f, http://127.0.0.1:80/health]
        interval: 5s
        timeout: 20s
        retries: 10
      ports:
        - ${PORT:-8080}:80
  volumes:
    gotify-data:
