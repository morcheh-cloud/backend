# Converted from Coolify's service templates (Apache-2.0).
name: Argilla
category: AI
description: Argilla is a collaboration tool for AI engineers and domain experts who need to build high-quality datasets for their projects.
website: https://docs.argilla.io/latest/
tags:
  - workflow
  - orchestration
  - data-pipeline
  - python
  - argilla
  - ai
  - elasticsearch
  - datasets
  - data
  - machine-learning
  - data-science
  - nlp
logo: templates/argilla.webp
env: |-
  PORT=6900
  POSTGRES_USER={{user}}
  POSTGRES_PASSWORD={{secret}}
  AUTHSECRET_PASSWORD={{secret}}
  ARGILLA_PASSWORD={{secret}}
  APIKEY_PASSWORD={{secret}}

  # Optional settings
  POSTGRES_DB=
  ARGILLA_ENABLE_TELEMETRY=0
  HF_HUB_DISABLE_TELEMETRY=1
  REINDEX_DATASETS=1
  DEFAULT_USER_ENABLED=true
  ARGILLA_USERNAME=argilla
  WORKSPACE=default
  BACKGROUND_NUM_WORKERS=1
  NODE_NAME=elasticsearch
  CLUSTER_NAME=es-argilla-local
  DISCOVERY_TYPE=single-node
  ES_JAVA_OPTS="\"-Xms512m -Xmx512m\""
  CLUSTER_ROUTING_ALLOCATION_DISK_THRESHOLD_ENABLED=false
  XPACK_SECURITY_ENABLED=false
compose: |
  services:
    argilla:
      image: argilla/argilla-server:v2.2.0
      restart: unless-stopped
      environment:
        - ARGILLA_HOME_PATH=/var/lib/argilla
        - ARGILLA_ELASTICSEARCH=http://elasticsearch:9200
        - ARGILLA_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
        - ARGILLA_REDIS_URL=redis://redis:6379/0
        - ARGILLA_AUTH_SECRET_KEY=${AUTHSECRET_PASSWORD}
        - ARGILLA_ENABLE_TELEMETRY=${ARGILLA_ENABLE_TELEMETRY:-0}
        - HF_HUB_DISABLE_TELEMETRY=${HF_HUB_DISABLE_TELEMETRY:-1}
        - REINDEX_DATASETS=${REINDEX_DATASETS:-1}
        - DEFAULT_USER_ENABLED=${DEFAULT_USER_ENABLED:-true}
        - USERNAME=${ARGILLA_USERNAME:-argilla}
        - PASSWORD=${ARGILLA_PASSWORD}
        - API_KEY=${APIKEY_PASSWORD}
        - DEFAULT_USER_PASSWORD=${ARGILLA_PASSWORD}
        - DEFAULT_USER_API_KEY=${APIKEY_PASSWORD}
        - WORKSPACE=${WORKSPACE:-default}
      depends_on:
        elasticsearch:
          condition: service_healthy
        redis:
          condition: service_healthy
        postgres:
          condition: service_healthy
      volumes:
        - argilla-data:/var/lib/argilla
      healthcheck:
        test: [CMD-SHELL, "python -c \"import requests as r;r.get(\\\"http://localhost:6900/api/_status\\\").raise_for_status()\""]
        interval: 10s
        timeout: 10s
        retries: 5
      ports:
        - ${PORT:-6900}:6900
    worker:
      image: argilla/argilla-server:v2.2.0
      restart: unless-stopped
      environment:
        - ARGILLA_HOME_PATH=/var/lib/argilla
        - ARGILLA_ELASTICSEARCH=http://elasticsearch:9200
        - ARGILLA_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
        - ARGILLA_REDIS_URL=redis://redis:6379/0
        - ARGILLA_AUTH_SECRET_KEY=${AUTHSECRET_PASSWORD}
        - ARGILLA_ENABLE_TELEMETRY=${ARGILLA_ENABLE_TELEMETRY:-0}
        - HF_HUB_DISABLE_TELEMETRY=${HF_HUB_DISABLE_TELEMETRY:-1}
        - REINDEX_DATASETS=${REINDEX_DATASETS:-1}
        - DEFAULT_USER_ENABLED=${DEFAULT_USER_ENABLED:-true}
        - USERNAME=${ARGILLA_USERNAME:-argilla}
        - PASSWORD=${ARGILLA_PASSWORD}
        - API_KEY=${APIKEY_PASSWORD}
        - DEFAULT_USER_PASSWORD=${ARGILLA_PASSWORD}
        - DEFAULT_USER_API_KEY=${APIKEY_PASSWORD}
        - BACKGROUND_NUM_WORKERS=${BACKGROUND_NUM_WORKERS:-1}
        - WORKSPACE=${WORKSPACE:-default}
      depends_on:
        elasticsearch:
          condition: service_healthy
        redis:
          condition: service_healthy
        postgres:
          condition: service_healthy
      volumes:
        - argilla-data:/var/lib/argilla
      command: sh -c 'python -m argilla_server worker --num-workers $${BACKGROUND_NUM_WORKERS}'
      healthcheck:
        test: [CMD-SHELL, pwd]
        interval: 10s
        timeout: 10s
        retries: 5
    postgres:
      image: postgres:14
      restart: unless-stopped
      environment:
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DB:-argilla}
      volumes:
        - pg-data:/var/lib/postgresql/data
      healthcheck:
        test: [CMD-SHELL, "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 5s
        retries: 3
    redis:
      image: redis:7
      restart: unless-stopped
      volumes:
        - redis-data:/data
      healthcheck:
        test: [CMD-SHELL, redis-cli -h localhost -p 6379 ping]
        interval: 5s
        timeout: 5s
        retries: 3
    elasticsearch:
      image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
      restart: unless-stopped
      environment:
        - node.name=${NODE_NAME:-elasticsearch}
        - cluster.name=${CLUSTER_NAME:-es-argilla-local}
        - discovery.type=${DISCOVERY_TYPE:-single-node}
        - ES_JAVA_OPTS=${ES_JAVA_OPTS:-"-Xms512m -Xmx512m"}
        - cluster.routing.allocation.disk.threshold_enabled=${CLUSTER_ROUTING_ALLOCATION_DISK_THRESHOLD_ENABLED:-false}
        - xpack.security.enabled=${XPACK_SECURITY_ENABLED:-false}
      ulimits:
        memlock:
          soft: -1
          hard: -1
      volumes:
        - elasticsearch-data:/usr/share/elasticsearch/data/
      healthcheck:
        test: [CMD-SHELL, curl --silent --fail http://elasticsearch:9200]
        interval: 10s
        timeout: 10s
        retries: 5
  volumes:
    argilla-data:
    pg-data:
    redis-data:
    elasticsearch-data:
