# Converted from Coolify's service templates (Apache-2.0).
name: Karakeep
category: Productivity
description: A self-hostable bookmark-everything app (links, notes and images) with AI-based automatic tagging and full text search
website: https://docs.karakeep.app/
tags:
  - media
  - read-it-later
  - pocket-alternative
  - omnivore-alternative
  - instapaper-alternative
logo: templates/karakeep.svg
env: |-
  PORT=3000
  KARAKEEP_URL=http://{{host}}:${PORT}
  KARAKEEPNEXTAUTH_PASSWORD={{secret}}
  MEILI_PASSWORD={{secret}}

  # Optional settings
  SERVICE_OPENAI_API_KEY=
  SERVICE_DISABLE_SIGNUPS=false
  MEILI_NO_ANALYTICS=true
compose: |
  services:
    web:
      image: ghcr.io/karakeep-app/karakeep:0.33.2
      restart: unless-stopped
      volumes:
        - karakeep-data:/data
      environment:
        - NEXTAUTH_URL=${KARAKEEP_URL}
        - NEXTAUTH_SECRET=${KARAKEEPNEXTAUTH_PASSWORD}
        - MEILI_MASTER_KEY=${MEILI_PASSWORD}
        - MEILI_ADDR=http://meilisearch:7700
        - BROWSER_WEB_URL=http://chrome:9222
        - OPENAI_API_KEY=${SERVICE_OPENAI_API_KEY}
        - DISABLE_SIGNUPS=${SERVICE_DISABLE_SIGNUPS:-false}
        - DATA_DIR=/data
      ports:
        - ${PORT:-3000}:3000
    chrome:
      image: ghcr.io/karakeep-app/karakeep-chrome:release
      restart: unless-stopped
      command: [--no-sandbox, --disable-gpu, --disable-dev-shm-usage, --hide-scrollbars, --disable-blink-features=AutomationControlled, "--window-size=1440,900"]
    meilisearch:
      image: getmeili/meilisearch:v1.41.0
      restart: unless-stopped
      environment:
        - MEILI_NO_ANALYTICS=${MEILI_NO_ANALYTICS:-true}
        - NEXTAUTH_SECRET=${KARAKEEPNEXTAUTH_PASSWORD}
        - MEILI_MASTER_KEY=${MEILI_PASSWORD}
        - NEXTAUTH_URL=${KARAKEEP_URL}
      volumes:
        - karakeep-meilisearch:/meili_data
      healthcheck:
        test: [CMD, curl, -f, http://127.0.0.1:7700/health]
        interval: 2s
        timeout: 10s
        retries: 15
  volumes:
    karakeep-data:
    karakeep-meilisearch:
