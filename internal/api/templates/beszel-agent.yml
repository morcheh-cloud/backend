# Converted from Coolify's service templates (Apache-2.0).
name: Beszel Agent
category: Monitoring
description: Monitoring agent for Beszel
website: https://www.beszel.dev/guide/agent-installation
tags:
  - beszel
  - monitoring
  - server
  - stats
  - alerts
logo: templates/beszel.svg
env: |-
  # Optional settings
  LISTEN=/beszel_socket/beszel.sock
  HUB_URL=
  TOKEN=
  KEY=
  DISABLE_SSH=false
  LOG_LEVEL=warn
  SKIP_GPU=false
  SYSTEM_NAME=
compose: |
  services:
    beszel-agent:
      image: henrygd/beszel-agent:0.19.0
      restart: unless-stopped
      network_mode: host
      environment:
        - LISTEN=${LISTEN:-/beszel_socket/beszel.sock}
        - HUB_URL=${HUB_URL:-$SERVICE_URL_BESZEL}
        - TOKEN=${TOKEN}
        - KEY=${KEY}
        - DISABLE_SSH=${DISABLE_SSH:-false}
        - LOG_LEVEL=${LOG_LEVEL:-warn}
        - SKIP_GPU=${SKIP_GPU:-false}
        - SYSTEM_NAME=${SYSTEM_NAME}
      volumes:
        - beszel_agent_data:/var/lib/beszel-agent
        - beszel_socket:/beszel_socket
        - /var/run/docker.sock:/var/run/docker.sock:ro
      healthcheck:
        test: [CMD, /agent, health]
        interval: 60s
        timeout: 20s
        retries: 10
        start_period: 5s
  volumes:
    beszel_agent_data:
    beszel_socket:
