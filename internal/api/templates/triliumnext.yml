# Converted from Coolify's service templates (Apache-2.0).
name: TriliumNext Notes
category: Productivity
description: Build your personal knowledge base with TriliumNext Notes.
website: https://github.com/TriliumNext/Trilium
tags:
  - self-hosted
  - notes
  - todo
  - organize
  - markdown
  - wiki
logo: templates/triliumnext.svg
env: |-
  PORT=8080

  # Optional settings
  TZ=Europe/Berlin
compose: |
  services:
    triliumnext:
      image: ghcr.io/triliumnext/trilium:stable
      restart: unless-stopped
      environment:
        - TZ=${TZ:-Europe/Berlin}
      volumes:
        - triliumnext_data:/home/node/trilium-data
      healthcheck:
        test: [CMD, node, /usr/src/app/docker_healthcheck.cjs]
        interval: 5s
        timeout: 20s
        retries: 10
      ports:
        - ${PORT:-8080}:8080
  volumes:
    triliumnext_data:
