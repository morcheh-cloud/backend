# Converted from Coolify's service templates (Apache-2.0).
name: Flowise
category: AI
description: Flowise is an open source low-code tool for developers to build customized LLM orchestration flows & AI agents.
website: https://docs.flowiseai.com/
tags:
  - lowcode
  - nocode
  - ai
  - llm
  - openai
  - anthropic
  - machine-learning
  - rag
  - agents
  - chatbot
  - api
  - team
logo: templates/flowise.webp
env: |-
  PORT=3001
  FLOWISE_USER={{user}}
  FLOWISE_PASSWORD={{secret}}

  # Optional settings
  DEBUG=false
  DISABLE_FLOWISE_TELEMETRY=true
compose: |
  services:
    flowise:
      image: flowiseai/flowise:latest
      restart: unless-stopped
      environment:
        - DEBUG=${DEBUG:-false}
        - DISABLE_FLOWISE_TELEMETRY=${DISABLE_FLOWISE_TELEMETRY:-true}
        - PORT=${PORT:-3001}
        - DATABASE_PATH=/root/.flowise
        - APIKEY_PATH=/root/.flowise
        - SECRETKEY_PATH=/root/.flowise
        - LOG_PATH=/root/.flowise/logs
        - BLOB_STORAGE_PATH=/root/.flowise/storage
        - FLOWISE_USERNAME=${FLOWISE_USER}
        - FLOWISE_PASSWORD=${FLOWISE_PASSWORD}
      volumes:
        - flowise-data:/root/.flowise
      healthcheck:
        test: [CMD-SHELL, "wget -qO- http://127.0.0.1:3001 || exit 1"]
        interval: 5s
        timeout: 5s
        retries: 3
      ports:
        - ${PORT:-3001}:3001
  volumes:
    flowise-data:
