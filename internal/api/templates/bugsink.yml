# Converted from Coolify's service templates (Apache-2.0).
name: Bugsink
category: Monitoring
description: Self-hosted Error Tracking.
website: https://www.bugsink.com/docs/
tags:
  - python
  - error-tracking
  - django
  - postgresql
logo: templates/bugsink.svg
env: |-
  PORT=8000
  POSTGRES_USER={{user}}
  POSTGRES_PASSWORD={{secret}}
  BUGSINK_PASSWORD={{secret:64}}
  BUGSINK_PASSWORD_2={{secret}}
  BUGSINK_URL=http://{{host}}:${PORT}

  # Fill these in before starting
  BUGSINK_ADMIN_EMAIL=

  # Optional settings
  POSTGRES_DB=bugsink
  SITE_TITLE=Bugsink
  TIME_ZONE=UTC
  PHONEHOME=False
  EMAIL_HOST=
  EMAIL_PORT=587
  EMAIL_HOST_USER=
  EMAIL_HOST_PASSWORD=
  EMAIL_USE_TLS=True
  EMAIL_USE_SSL=False
  DEFAULT_FROM_EMAIL=
compose: |
  services:
    postgres:
      image: postgres:17-alpine
      restart: unless-stopped
      environment:
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DB:-bugsink}
      volumes:
        - bugsink-postgres-data:/var/lib/postgresql/data
      healthcheck:
        test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 20s
        retries: 10
    web:
      image: bugsink/bugsink:2
      restart: unless-stopped
      environment:
        - SECRET_KEY=$BUGSINK_PASSWORD
        - CREATE_SUPERUSER=${BUGSINK_ADMIN_EMAIL:?}:$BUGSINK_PASSWORD_2
        - BASE_URL=$BUGSINK_URL
        - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bugsink}
        - BEHIND_HTTPS_PROXY=True
        - SITE_TITLE=${SITE_TITLE:-Bugsink}
        - TIME_ZONE=${TIME_ZONE:-UTC}
        - PHONEHOME=${PHONEHOME:-False}
        - EMAIL_HOST=${EMAIL_HOST}
        - EMAIL_PORT=${EMAIL_PORT:-587}
        - EMAIL_HOST_USER=${EMAIL_HOST_USER}
        - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
        - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
        - EMAIL_USE_SSL=${EMAIL_USE_SSL:-False}
        - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      healthcheck:
        test: [CMD-SHELL, "python -c 'import requests; requests.get(\"http://localhost:8000/health/ready\").raise_for_status()'"]
        interval: 5s
        timeout: 20s
        retries: 10
      depends_on:
        postgres:
          condition: service_healthy
      ports:
        - ${PORT:-8000}:8000
  volumes:
    bugsink-postgres-data:
