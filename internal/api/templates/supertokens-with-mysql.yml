# Converted from Coolify's service templates (Apache-2.0).
name: SuperTokens with MySQL
category: Security
description: An open-source authentication solution that simplifies the implementation of secure user authentication and session management for web and mobile applications.
website: https://supertokens.com/docs/guides
tags:
  - supertokens
  - login
  - authentication
  - authorization
  - oauth
  - user-management
  - session-management
  - access-control
  - otp
  - magic-link
  - passwordless
logo: templates/supertokens.svg
env: |-
  PORT=3567
  MYSQL_USER={{user}}
  MYSQL_PASSWORD={{secret}}

  # Optional settings
  API_KEYS=
  MYSQL_DATABASE=supertokens
compose: |
  services:
    supertokens:
      image: registry.supertokens.io/supertokens/supertokens-mysql:latest
      restart: unless-stopped
      depends_on:
        mysql:
          condition: service_healthy
      environment:
        - API_KEYS=${API_KEYS:-}
        - MYSQL_CONNECTION_URI=mysql://$MYSQL_USER:$MYSQL_PASSWORD@mysql:3306/${MYSQL_DATABASE:-supertokens}
      healthcheck:
        test: |
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/3567 && echo -e "GET /hello HTTP/1.1\r\nhost: 127.0.0.1:3567\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep "Hello"'
        interval: 10s
        timeout: 5s
        retries: 5
      ports:
        - ${PORT:-3567}:3567
    mysql:
      image: mysql:latest
      restart: unless-stopped
      environment:
        - MYSQL_ROOT_PASSWORD=$MYSQL_PASSWORD
        - MYSQL_USER=$MYSQL_USER
        - MYSQL_PASSWORD=$MYSQL_PASSWORD
        - MYSQL_DATABASE=${MYSQL_DATABASE:-supertokens}
      volumes:
        - supertokens-mysql-data:/var/lib/mysql
      healthcheck:
        test: [CMD, mysqladmin, ping, -h, localhost]
        timeout: 20s
        retries: 10
  volumes:
    supertokens-mysql-data:
