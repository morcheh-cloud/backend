# Converted from Coolify's service templates (Apache-2.0).
name: Traccar
category: Monitoring
description: Traccar is a free and open source modern GPS tracking system.
website: https://www.traccar.org/documentation/
tags:
  - traccar
  - gps
  - tracking
  - open
  - source
logo: templates/traccar.webp
env: |-
  TRACCAR_PORT=8082
  TRACCARAPI_PORT=5159
  POSTGRES_USER={{user}}
  POSTGRES_PASSWORD={{secret}}

  # Optional settings
  CONFIG_USE_ENVIRONMENT_VARIABLES=true
  POSTGRESQL_DATABASE=traccar
compose: |
  services:
    traccar:
      image: traccar/traccar:latest
      restart: unless-stopped
      environment:
        - CONFIG_USE_ENVIRONMENT_VARIABLES=${CONFIG_USE_ENVIRONMENT_VARIABLES:-true}
        - DATABASE_USER=${POSTGRES_USER}
        - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      depends_on:
        postgres:
          condition: service_healthy
      healthcheck:
        test: [CMD, wget, --no-verbose, --tries=1, --spider, http://127.0.0.1:8082]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 15s
      ports:
        - ${TRACCAR_PORT:-8082}:8082
        - ${TRACCARAPI_PORT:-5159}:5159
      configs:
        - source: traccar-traccar.xml
          target: /opt/traccar/conf/traccar.xml
    postgres:
      image: postgres:16-alpine
      restart: unless-stopped
      environment:
        - POSTGRES_USER=$POSTGRES_USER
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRESQL_DATABASE:-traccar}
      volumes:
        - traccar-postgresql-data:/var/lib/postgresql/data/
      healthcheck:
        test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 20s
        retries: 10
  volumes:
    traccar-postgresql-data:
  configs:
    traccar-traccar.xml:
      content: |
        <?xml version='1.0' encoding='UTF-8'?>
        <!DOCTYPE properties SYSTEM 'http://java.sun.com/dtd/properties.dtd'>
        <properties>
            <entry key='config.default'>./conf/default.xml</entry>
            <entry key='database.driver'>org.postgresql.Driver</entry>
            <entry key='database.url'>jdbc:postgresql://postgres:5432/traccar</entry>
        </properties>
