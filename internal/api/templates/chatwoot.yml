# Converted from Coolify's service templates (Apache-2.0).
name: Chatwoot
category: Support
description: Delightful customer relationships at scale.
website: https://www.chatwoot.com/docs/self-hosted/
tags:
  - chatwoot
  - chat
  - api
  - open
  - source
  - rails
  - redis
  - postgresql
  - sidekiq
logo: templates/chatwoot.svg
featured: true
env: |-
  PORT=3000
  CHATWOOT_PASSWORD={{secret}}
  CHATWOOT_URL=http://{{host}}:${PORT}
  REDIS_PASSWORD={{secret}}
  POSTGRES_USER={{user}}
  POSTGRES_PASSWORD={{secret}}

  # Optional settings
  CHATWOOT_DEFAULT_LOCALE=
  FORCE_SSL=false
  ENABLE_ACCOUNT_SIGNUP=false
  REDIS_OPENSSL_VERIFY_MODE=none
  POSTGRES_DB=chatwoot
  POSTGRES_HOST=postgres
  RAILS_MAX_THREADS=5
  NODE_ENV=production
  RAILS_ENV=production
  INSTALLATION_ENV=docker
  CHATWOOT_MAILER_SENDER_EMAIL=
  CHATWOOT_SMTP_ADDRESS=
  CHATWOOT_SMTP_AUTHENTICATION=
  CHATWOOT_SMTP_DOMAIN=
  CHATWOOT_SMTP_ENABLE_STARTTLS_AUTO=
  CHATWOOT_SMTP_PORT=
  CHATWOOT_SMTP_USERNAME=
  CHATWOOT_SMTP_PASSWORD=
  ACTIVE_STORAGE_SERVICE=local
  SAFE_FETCH_ALLOW_PRIVATE_NETWORK=false
compose: |
  services:
    chatwoot:
      image: chatwoot/chatwoot:latest
      restart: unless-stopped
      depends_on:
        - postgres
        - redis
      environment:
        - SECRET_KEY_BASE=$CHATWOOT_PASSWORD
        - FRONTEND_URL=${CHATWOOT_URL}
        - DEFAULT_LOCALE=${CHATWOOT_DEFAULT_LOCALE}
        - FORCE_SSL=${FORCE_SSL:-false}
        - ENABLE_ACCOUNT_SIGNUP=${ENABLE_ACCOUNT_SIGNUP:-false}
        - REDIS_URL=redis://default@redis:6379
        - REDIS_PASSWORD=$REDIS_PASSWORD
        - REDIS_OPENSSL_VERIFY_MODE=${REDIS_OPENSSL_VERIFY_MODE:-none}
        - POSTGRES_DATABASE=${POSTGRES_DB:-chatwoot}
        - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
        - POSTGRES_USERNAME=$POSTGRES_USER
        - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
        - RAILS_MAX_THREADS=${RAILS_MAX_THREADS:-5}
        - NODE_ENV=${NODE_ENV:-production}
        - RAILS_ENV=${RAILS_ENV:-production}
        - INSTALLATION_ENV=${INSTALLATION_ENV:-docker}
        - MAILER_SENDER_EMAIL=${CHATWOOT_MAILER_SENDER_EMAIL}
        - SMTP_ADDRESS=${CHATWOOT_SMTP_ADDRESS}
        - SMTP_AUTHENTICATION=${CHATWOOT_SMTP_AUTHENTICATION}
        - SMTP_DOMAIN=${CHATWOOT_SMTP_DOMAIN}
        - SMTP_ENABLE_STARTTLS_AUTO=${CHATWOOT_SMTP_ENABLE_STARTTLS_AUTO}
        - SMTP_PORT=${CHATWOOT_SMTP_PORT}
        - SMTP_USERNAME=${CHATWOOT_SMTP_USERNAME}
        - SMTP_PASSWORD=${CHATWOOT_SMTP_PASSWORD}
        - ACTIVE_STORAGE_SERVICE=${ACTIVE_STORAGE_SERVICE:-local}
        - SAFE_FETCH_ALLOW_PRIVATE_NETWORK=${SAFE_FETCH_ALLOW_PRIVATE_NETWORK:-false}
      entrypoint: docker/entrypoints/rails.sh
      command: sh -c "bundle exec rails db:chatwoot_prepare && bundle exec rails s -p 3000 -b 0.0.0.0"
      volumes:
        - rails-data:/app/storage
      healthcheck:
        test: [CMD, wget, --spider, -q, http://127.0.0.1:3000]
        interval: 5s
        timeout: 20s
        retries: 10
      ports:
        - ${PORT:-3000}:3000
    sidekiq:
      image: chatwoot/chatwoot:latest
      restart: unless-stopped
      depends_on:
        - postgres
        - redis
      environment:
        - SECRET_KEY_BASE=$CHATWOOT_PASSWORD
        - FRONTEND_URL=${CHATWOOT_URL}
        - DEFAULT_LOCALE=${CHATWOOT_DEFAULT_LOCALE}
        - FORCE_SSL=${FORCE_SSL:-false}
        - ENABLE_ACCOUNT_SIGNUP=${ENABLE_ACCOUNT_SIGNUP:-false}
        - REDIS_URL=redis://default@redis:6379
        - REDIS_PASSWORD=$REDIS_PASSWORD
        - REDIS_OPENSSL_VERIFY_MODE=${REDIS_OPENSSL_VERIFY_MODE:-none}
        - POSTGRES_DATABASE=${POSTGRES_DB:-chatwoot}
        - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
        - POSTGRES_USERNAME=$POSTGRES_USER
        - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
        - RAILS_MAX_THREADS=${RAILS_MAX_THREADS:-5}
        - NODE_ENV=${NODE_ENV:-production}
        - RAILS_ENV=${RAILS_ENV:-production}
        - INSTALLATION_ENV=${INSTALLATION_ENV:-docker}
        - MAILER_SENDER_EMAIL=${CHATWOOT_MAILER_SENDER_EMAIL}
        - SMTP_ADDRESS=${CHATWOOT_SMTP_ADDRESS}
        - SMTP_AUTHENTICATION=${CHATWOOT_SMTP_AUTHENTICATION}
        - SMTP_DOMAIN=${CHATWOOT_SMTP_DOMAIN}
        - SMTP_ENABLE_STARTTLS_AUTO=${CHATWOOT_SMTP_ENABLE_STARTTLS_AUTO}
        - SMTP_PORT=${CHATWOOT_SMTP_PORT}
        - SMTP_USERNAME=${CHATWOOT_SMTP_USERNAME}
        - SMTP_PASSWORD=${CHATWOOT_SMTP_PASSWORD}
        - ACTIVE_STORAGE_SERVICE=${ACTIVE_STORAGE_SERVICE:-local}
      command: [bundle, exec, sidekiq, -C, config/sidekiq.yml]
      volumes:
        - rails-data:/app/storage
      healthcheck:
        test: [CMD-SHELL, "bundle exec sidekiqmon processes | grep -q 'sidekiq'"]
        interval: 30s
        timeout: 10s
        retries: 3
    postgres:
      image: pgvector/pgvector:pg12
      restart: always
      volumes:
        - postgres-data:/var/lib/postgresql/data
      environment:
        - POSTGRES_DB=${POSTGRES_DB:-chatwoot}
        - POSTGRES_USER=$POSTGRES_USER
        - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      healthcheck:
        test: [CMD-SHELL, pg_isready -U $POSTGRES_USER -d chatwoot -h 127.0.0.1]
        interval: 30s
        timeout: 10s
        retries: 5
    redis:
      image: redis:alpine
      restart: always
      command: [sh, -c, "redis-server --requirepass \"$REDIS_PASSWORD\""]
      volumes:
        - redis-data:/data
      healthcheck:
        test: [CMD, redis-cli, -a, $REDIS_PASSWORD, PING]
        interval: 30s
        timeout: 10s
        retries: 5
  volumes:
    rails-data:
    postgres-data:
    redis-data:
