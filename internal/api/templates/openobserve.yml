# Converted from Coolify's service templates (Apache-2.0).
name: OpenObserve
category: Monitoring
description: Cloud-native observability platform for logs, metrics, traces, RUM, errors and session replays — a 140x cheaper alternative to Elasticsearch, Splunk and Datadog.
website: https://openobserve.ai/docs/
tags:
  - logs
  - metrics
  - traces
  - observability
  - monitoring
  - opentelemetry
  - otel
  - elasticsearch
  - splunk
  - datadog
logo: templates/openobserve.svg
env: |-
  PORT=5080
  OPENOBSERVE_PASSWORD={{secret}}

  # Optional settings
  ZO_ROOT_USER_EMAIL=root@example.com
  ZO_TELEMETRY=false
  ZO_COOKIE_SECURE_ONLY=true
compose: |
  services:
    openobserve:
      image: public.ecr.aws/zinclabs/openobserve:v0.90.0
      restart: unless-stopped
      environment:
        - ZO_DATA_DIR=/data
        - ZO_ROOT_USER_EMAIL=${ZO_ROOT_USER_EMAIL:-root@example.com}
        - ZO_ROOT_USER_PASSWORD=${OPENOBSERVE_PASSWORD}
        - ZO_TELEMETRY=${ZO_TELEMETRY:-false}
        - ZO_COOKIE_SECURE_ONLY=${ZO_COOKIE_SECURE_ONLY:-true}
      volumes:
        - openobserve-data:/data
      healthcheck:
        test: [CMD, /openobserve, node, status]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 60s
      ports:
        - ${PORT:-5080}:5080
  volumes:
    openobserve-data:
