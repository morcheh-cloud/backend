# Converted from Coolify's service templates (Apache-2.0).
name: Forgejo with MariaDB
category: Git & CI
description: Forgejo is a self-hosted lightweight software forge. Easy to install and low maintenance, it just does the job.
website: https://forgejo.org/docs
tags:
  - version control
  - collaboration
  - code
  - hosting
  - lightweight
  - mariadb
logo: templates/forgejo.svg
env: |-
  PORT=3000
  FORGEJO_URL=http://{{host}}:${PORT}
  FORGEJO_HOST={{host}}:${PORT}
  MYSQL_USER={{user}}
  MYSQL_PASSWORD={{secret}}
  MYSQLROOT_PASSWORD={{secret}}

  # Optional settings
  FORGEJO__migrations__ALLOWED_DOMAINS=
  FORGEJO__migrations__ALLOW_LOCALNETWORKS=false
  FORGEJO_SSH_PORT=22222
  MYSQL_DATABASE=forgejo
compose: |
  services:
    forgejo:
      image: codeberg.org/forgejo/forgejo:15
      restart: unless-stopped
      environment:
        - FORGEJO__server__ROOT_URL=${FORGEJO_URL}
        - FORGEJO__migrations__ALLOWED_DOMAINS=${FORGEJO__migrations__ALLOWED_DOMAINS}
        - FORGEJO__migrations__ALLOW_LOCALNETWORKS=${FORGEJO__migrations__ALLOW_LOCALNETWORKS-false}
        - FORGEJO__server__DOMAIN=${FORGEJO_HOST}
        - FORGEJO__server__SSH_DOMAIN=${FORGEJO_HOST}
        - FORGEJO__server__SSH_PORT=${FORGEJO_SSH_PORT:-22222}
        - USER_UID=1000
        - USER_GID=1000
        - FORGEJO__database__DB_TYPE=mysql
        - FORGEJO__database__HOST=mariadb
        - FORGEJO__database__NAME=${MYSQL_DATABASE:-forgejo}
        - FORGEJO__database__USER=$MYSQL_USER
        - FORGEJO__database__PASSWD=$MYSQL_PASSWORD
      volumes:
        - forgejo-data:/data
        - forgejo-timezone:/etc/timezone:ro
        - forgejo-localtime:/etc/localtime:ro
      ports:
        - ${FORGEJO_SSH_PORT:-22222}:22
        - ${PORT:-3000}:3000
      depends_on:
        mariadb:
          condition: service_healthy
      healthcheck:
        test: [CMD, curl, -f, http://127.0.0.1:3000]
        interval: 2s
        timeout: 10s
        retries: 15
    mariadb:
      image: mariadb:11
      restart: unless-stopped
      volumes:
        - forgejo-mariadb-data:/var/lib/mysql
      environment:
        - MYSQL_USER=${MYSQL_USER}
        - MYSQL_PASSWORD=${MYSQL_PASSWORD}
        - MYSQL_DATABASE=${MYSQL_DATABASE:-forgejo}
        - MYSQL_ROOT_PASSWORD=${MYSQLROOT_PASSWORD}
      healthcheck:
        test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
        interval: 5s
        timeout: 20s
        retries: 10
  volumes:
    forgejo-data:
    forgejo-timezone:
    forgejo-localtime:
    forgejo-mariadb-data:
