# Converted from Coolify's service templates (Apache-2.0).
name: Twenty
category: Productivity
description: Twenty is a CRM designed to fit your unique business needs.
website: https://docs.twenty.com
tags:
  - crm
  - self-hosted
  - dashboard
logo: templates/twenty.svg
featured: true
env: |-
  PORT=3000
  TWENTY_URL=http://{{host}}:${PORT}
  SECRET_SECRET={{secret:32}}
  POSTGRES_PASSWORD={{secret}}
  POSTGRES_USER={{user}}

  # Optional settings
  CACHE_STORAGE_TYPE=redis
  API_RATE_LIMITING_TTL=100
  API_RATE_LIMITING_LIMIT=100
  POSTGRES_DB=twenty-db
  IS_SIGN_UP_DISABLED=false
  PASSWORD_RESET_TOKEN_EXPIRES_IN=5m
  WORKSPACE_INACTIVE_DAYS_BEFORE_NOTIFICATION=7
  WORKSPACE_INACTIVE_DAYS_BEFORE_DELETION=21
  STORAGE_TYPE=local
  STORAGE_S3_REGION=
  STORAGE_S3_NAME=
  STORAGE_S3_ENDPOINT=
  STORAGE_S3_ACCESS_KEY_ID=
  STORAGE_S3_SECRET_ACCESS_KEY=
  MESSAGE_QUEUE_TYPE=pg-boss
  EMAIL_FROM_ADDRESS=
  EMAIL_FROM_NAME=
  EMAIL_SYSTEM_ADDRESS=
  EMAIL_DRIVER=logger
  EMAIL_SMTP_HOST=
  EMAIL_SMTP_PORT=
  EMAIL_SMTP_USER=
  EMAIL_SMTP_PASSWORD=
  DEBUG_MODE=false
  TELEMETRY_ENABLED=false
compose: |
  services:
    twenty:
      image: twentycrm/twenty:v1.15
      restart: unless-stopped
      environment:
        - SERVER_URL=${TWENTY_URL}
        - FRONT_BASE_URL=${TWENTY_URL}
        - APP_SECRET=${SECRET_SECRET}
        - ENABLE_DB_MIGRATIONS=true
        - CACHE_STORAGE_TYPE=${CACHE_STORAGE_TYPE:-redis}
        - REDIS_URL=redis://redis:6379
        - API_RATE_LIMITING_TTL=${API_RATE_LIMITING_TTL:-100}
        - API_RATE_LIMITING_LIMIT=${API_RATE_LIMITING_LIMIT:-100}
        - POSTGRES_ADMIN_PASSWORD=${POSTGRES_PASSWORD}
        - PG_DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-twenty-db}
        - IS_SIGN_UP_DISABLED=${IS_SIGN_UP_DISABLED:-false}
        - PASSWORD_RESET_TOKEN_EXPIRES_IN=${PASSWORD_RESET_TOKEN_EXPIRES_IN:-5m}
        - WORKSPACE_INACTIVE_DAYS_BEFORE_NOTIFICATION=${WORKSPACE_INACTIVE_DAYS_BEFORE_NOTIFICATION:-7}
        - WORKSPACE_INACTIVE_DAYS_BEFORE_DELETION=${WORKSPACE_INACTIVE_DAYS_BEFORE_DELETION:-21}
        - STORAGE_TYPE=${STORAGE_TYPE:-local}
        - STORAGE_S3_REGION=$STORAGE_S3_REGION
        - STORAGE_S3_NAME=$STORAGE_S3_NAME
        - STORAGE_S3_ENDPOINT=$STORAGE_S3_ENDPOINT
        - STORAGE_S3_ACCESS_KEY_ID=$STORAGE_S3_ACCESS_KEY_ID
        - STORAGE_S3_SECRET_ACCESS_KEY=$STORAGE_S3_SECRET_ACCESS_KEY
        - MESSAGE_QUEUE_TYPE=${MESSAGE_QUEUE_TYPE:-pg-boss}
        - EMAIL_FROM_ADDRESS=$EMAIL_FROM_ADDRESS
        - EMAIL_FROM_NAME=$EMAIL_FROM_NAME
        - EMAIL_SYSTEM_ADDRESS=$EMAIL_SYSTEM_ADDRESS
        - EMAIL_DRIVER=${EMAIL_DRIVER:-logger}
        - EMAIL_SMTP_HOST=$EMAIL_SMTP_HOST
        - EMAIL_SMTP_PORT=$EMAIL_SMTP_PORT
        - EMAIL_SMTP_USER=$EMAIL_SMTP_USER
        - EMAIL_SMTP_PASSWORD=$EMAIL_SMTP_PASSWORD
        - SIGN_IN_PREFILLED=false
        - DEBUG_MODE=${DEBUG_MODE:-false}
        - TELEMETRY_ENABLED=${TELEMETRY_ENABLED:-false}
      volumes:
        - twenty-local-storage:/app/packages/twenty-server/.local-storage
      healthcheck:
        test: [CMD, curl, -f, http://127.0.0.1:3000/healthz]
        interval: 5s
        timeout: 5s
        retries: 30
        start_period: 120s
      depends_on:
        postgres:
          condition: service_healthy
      ports:
        - ${PORT:-3000}:3000
    worker:
      image: twentycrm/twenty:v1.15
      restart: unless-stopped
      command: [yarn, worker:prod]
      volumes:
        - twenty-local-storage:/app/packages/twenty-server/.local-storage
      environment:
        - SERVER_URL=${TWENTY_URL}
        - FRONT_BASE_URL=${TWENTY_URL}
        - APP_SECRET=${SECRET_SECRET}
        - ENABLE_DB_MIGRATIONS=true
        - CACHE_STORAGE_TYPE=${CACHE_STORAGE_TYPE:-redis}
        - REDIS_URL=redis://redis:6379
        - API_RATE_LIMITING_TTL=${API_RATE_LIMITING_TTL:-100}
        - API_RATE_LIMITING_LIMIT=${API_RATE_LIMITING_LIMIT:-100}
        - POSTGRES_ADMIN_PASSWORD=${POSTGRES_PASSWORD}
        - PG_DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-twenty-db}
        - IS_SIGN_UP_DISABLED=${IS_SIGN_UP_DISABLED:-false}
        - PASSWORD_RESET_TOKEN_EXPIRES_IN=${PASSWORD_RESET_TOKEN_EXPIRES_IN:-5m}
        - WORKSPACE_INACTIVE_DAYS_BEFORE_NOTIFICATION=${WORKSPACE_INACTIVE_DAYS_BEFORE_NOTIFICATION:-7}
        - WORKSPACE_INACTIVE_DAYS_BEFORE_DELETION=${WORKSPACE_INACTIVE_DAYS_BEFORE_DELETION:-21}
        - STORAGE_TYPE=${STORAGE_TYPE:-local}
        - STORAGE_S3_REGION=$STORAGE_S3_REGION
        - STORAGE_S3_NAME=$STORAGE_S3_NAME
        - STORAGE_S3_ENDPOINT=$STORAGE_S3_ENDPOINT
        - STORAGE_S3_ACCESS_KEY_ID=$STORAGE_S3_ACCESS_KEY_ID
        - STORAGE_S3_SECRET_ACCESS_KEY=$STORAGE_S3_SECRET_ACCESS_KEY
        - MESSAGE_QUEUE_TYPE=${MESSAGE_QUEUE_TYPE:-pg-boss}
        - EMAIL_FROM_ADDRESS=$EMAIL_FROM_ADDRESS
        - EMAIL_FROM_NAME=$EMAIL_FROM_NAME
        - EMAIL_SYSTEM_ADDRESS=$EMAIL_SYSTEM_ADDRESS
        - EMAIL_DRIVER=${EMAIL_DRIVER:-logger}
        - EMAIL_SMTP_HOST=$EMAIL_SMTP_HOST
        - EMAIL_SMTP_PORT=$EMAIL_SMTP_PORT
        - EMAIL_SMTP_USER=$EMAIL_SMTP_USER
        - EMAIL_SMTP_PASSWORD=$EMAIL_SMTP_PASSWORD
        - SIGN_IN_PREFILLED=false
        - DEBUG_MODE=${DEBUG_MODE:-false}
        - TELEMETRY_ENABLED=${TELEMETRY_ENABLED:-false}
        - DISABLE_DB_MIGRATIONS=true
        - DISABLE_CRON_JOBS_REGISTRATION=true
      depends_on:
        twenty:
          condition: service_healthy
      healthcheck:
        test: [CMD-SHELL, "ps aux | grep 'dist/queue-worker/queue-worker' | grep -v grep || exit 1"]
        interval: 30s
        timeout: 5s
        retries: 3
        start_period: 30s
    postgres:
      image: postgres:16-alpine
      restart: unless-stopped
      environment:
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DB:-twenty-db}
      volumes:
        - postgres-data:/var/lib/postgresql/data
      healthcheck:
        test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 20s
        retries: 10
    redis:
      image: redis:7-alpine
      restart: unless-stopped
      volumes:
        - redis-data:/data
      healthcheck:
        test: [CMD, redis-cli, ping]
        interval: 5s
        timeout: 20s
        retries: 10
  volumes:
    twenty-local-storage:
    postgres-data:
    redis-data:
