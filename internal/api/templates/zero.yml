# Converted from Coolify's service templates (Apache-2.0).
name: Zero
category: Backend
description: Query-driven sync engine for TypeScript apps backed by Postgres.
website: https://zero.rocicorp.dev/docs/deployment
tags:
  - sync
  - realtime
  - postgres
  - typescript
  - local-first
logo: templates/zero.svg
env: |-
  PORT=4848
  POSTGRES_USER={{user}}
  POSTGRES_PASSWORD={{secret:64}}
  ADMIN_PASSWORD={{secret:64}}

  # Optional settings
  POSTGRES_DB=
  ZERO_QUERY_URL="Set the URL of your API /query endpoint"
  ZERO_MUTATE_URL="Set the URL of your API /mutate endpoint"
  ZERO_ENABLE_CRUD_MUTATIONS=false
  ZERO_NUM_SYNC_WORKERS=1
  ZERO_APP_ID=zero
  ZERO_LOG_LEVEL=info
  ZERO_ENABLE_TELEMETRY=true
  ZERO_LAZY_STARTUP=false
  ZERO_QUERY_API_KEY=
  ZERO_MUTATE_API_KEY=
compose: |
  services:
    zero:
      image: rocicorp/zero:1.6.2
      restart: unless-stopped
      environment:
        - ZERO_UPSTREAM_DB=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
        - ZERO_CVR_DB=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
        - ZERO_CHANGE_DB=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
        - ZERO_REPLICA_FILE=/data/replica.db
        - ZERO_ADMIN_PASSWORD=${ADMIN_PASSWORD}
        - ZERO_QUERY_URL=${ZERO_QUERY_URL:?Set the URL of your API /query endpoint}
        - ZERO_MUTATE_URL=${ZERO_MUTATE_URL:?Set the URL of your API /mutate endpoint}
        - ZERO_ENABLE_CRUD_MUTATIONS=${ZERO_ENABLE_CRUD_MUTATIONS:-false}
        - ZERO_NUM_SYNC_WORKERS=${ZERO_NUM_SYNC_WORKERS:-1}
        - ZERO_APP_ID=${ZERO_APP_ID:-zero}
        - ZERO_LOG_LEVEL=${ZERO_LOG_LEVEL:-info}
        - ZERO_ENABLE_TELEMETRY=${ZERO_ENABLE_TELEMETRY:-true}
        - ZERO_LAZY_STARTUP=${ZERO_LAZY_STARTUP:-false}
        - ZERO_QUERY_API_KEY=${ZERO_QUERY_API_KEY:-}
        - ZERO_MUTATE_API_KEY=${ZERO_MUTATE_API_KEY:-}
      volumes:
        - zero-data:/data
      healthcheck:
        test: [CMD, curl, -f, http://127.0.0.1:4848/keepalive]
        interval: 5s
        timeout: 20s
        retries: 10
        start_period: 60s
      depends_on:
        postgres:
          condition: service_healthy
      ports:
        - ${PORT:-4848}:4848
    postgres:
      image: postgres:18-alpine
      restart: unless-stopped
      command: [postgres, -c, wal_level=logical]
      environment:
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DB:-zero-db}
      volumes:
        - postgres-data:/var/lib/postgresql
      healthcheck:
        test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 10s
        timeout: 20s
        retries: 10
  volumes:
    zero-data:
    postgres-data:
