# Converted from Coolify's service templates (Apache-2.0).
name: Gitea with MariaDB
category: Git & CI
description: Gitea is a self-hosted, lightweight Git service, offering version control, collaboration, and code hosting.
website: https://docs.gitea.com
tags:
  - version control
  - collaboration
  - code
  - hosting
  - lightweight
  - mariadb
logo: templates/gitea.svg
env: |-
  PORT=3000
  MYSQL_USER={{user}}
  MYSQL_PASSWORD={{secret}}
  MYSQLROOT_PASSWORD={{secret}}

  # Optional settings
  MYSQL_DATABASE=gitea
compose: |
  services:
    gitea:
      image: gitea/gitea:latest
      restart: unless-stopped
      environment:
        - USER_UID=1000
        - USER_GID=1000
        - GITEA__database__DB_TYPE=mysql
        - GITEA__database__HOST=mariadb
        - GITEA__database__NAME=${MYSQL_DATABASE-gitea}
        - GITEA__database__USER=$MYSQL_USER
        - GITEA__database__PASSWD=$MYSQL_PASSWORD
      volumes:
        - gitea-data:/data
        - gitea-timezone:/etc/timezone:ro
        - gitea-localtime:/etc/localtime:ro
      ports:
        - 22222:22
        - ${PORT:-3000}:3000
      depends_on:
        mariadb:
          condition: service_healthy
      healthcheck:
        test: [CMD, curl, -f, http://127.0.0.1:3000]
        interval: 2s
        timeout: 10s
        retries: 15
    mariadb:
      image: mariadb:11
      restart: unless-stopped
      volumes:
        - gitea-mariadb-data:/var/lib/mysql
      environment:
        - MYSQL_USER=${MYSQL_USER}
        - MYSQL_PASSWORD=${MYSQL_PASSWORD}
        - MYSQL_DATABASE=${MYSQL_DATABASE}
        - MYSQL_ROOT_PASSWORD=${MYSQLROOT_PASSWORD}
      healthcheck:
        test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
        interval: 5s
        timeout: 20s
        retries: 10
  volumes:
    gitea-data:
    gitea-timezone:
    gitea-localtime:
    gitea-mariadb-data:
