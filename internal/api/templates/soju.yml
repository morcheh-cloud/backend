# Converted from Coolify's service templates (Apache-2.0).
name: Soju
category: Communication
description: A user-friendly IRC bouncer with a modern web interface
website: https://soju.im/
tags:
  - irc
  - bouncer
  - chat
  - messaging
  - relay
logo: templates/soju.svg
env: PORT=8080
compose: |
  services:
    soju:
      image: codeberg.org/emersion/soju:latest
      restart: unless-stopped
      volumes:
        - soju-db:/db
        - soju-uploads:/uploads
        - soju-run:/run/soju
      networks:
        default:
          aliases:
            - gamja-backend
      configs:
        - source: soju-soju-config
          target: /soju-config
    gamja:
      image: codeberg.org/emersion/gamja:latest
      restart: unless-stopped
      depends_on:
        - soju
      ports:
        - ${PORT:-8080}:80
  volumes:
    soju-db:
    soju-uploads:
    soju-run:
  configs:
    soju-soju-config:
      content: |
        db sqlite3 /db/main.db
        message-store db
        file-upload fs /uploads/
        listen irc+insecure://0.0.0.0:6667
        listen ws+insecure://0.0.0.0:80
        listen unix+admin:///run/soju/admin
