# Converted from Coolify's service templates (Apache-2.0).
name: Fizzy
category: Productivity
description: Kanban tracking tool for issues and ideas by 37signals
website: https://github.com/basecamp/fizzy
tags:
  - kanban
  - project management
  - issues
  - rails
  - ruby
  - basecamp
  - 37signals
logo: templates/fizzy.webp
env: |-
  PORT=8080
  FIZZY_PASSWORD={{secret}}
  MASTERKEY_PASSWORD={{secret:64}}

  # Optional settings
  VAPID_PRIVATE_KEY=
  VAPID_PUBLIC_KEY=
compose: |
  services:
    fizzy:
      image: ghcr.io/basecamp/fizzy:main
      restart: unless-stopped
      environment:
        - SECRET_KEY_BASE=$FIZZY_PASSWORD
        - RAILS_MASTER_KEY=$MASTERKEY_PASSWORD
        - RAILS_ENV=production
        - RAILS_LOG_TO_STDOUT=true
        - RAILS_SERVE_STATIC_FILES=true
        - DATABASE_ADAPTER=sqlite
        - SOLID_QUEUE_CONNECTS_TO=false
        - VAPID_PRIVATE_KEY=$VAPID_PRIVATE_KEY
        - VAPID_PUBLIC_KEY=$VAPID_PUBLIC_KEY
      volumes:
        - fizzy-data:/rails/db
        - fizzy-storage:/rails/storage
      healthcheck:
        test: [CMD, curl, -f, http://127.0.0.1:80/up]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 30s
      ports:
        - ${PORT:-8080}:80
  volumes:
    fizzy-data:
    fizzy-storage:
