# Converted from Coolify's service templates (Apache-2.0).
name: pgAdmin
category: Databases
description: pgAdmin is a web-based database management tool for administering your PostgreSQL databases through a user-friendly interface.
website: https://www.pgadmin.org/docs/pgadmin4/latest/container_deployment.html
tags:
  - database management
logo: templates/postgresql.svg
featured: true
env: |-
  PORT=8080

  # Fill these in before starting
  PGADMIN_DEFAULT_EMAIL=
  PGADMIN_DEFAULT_PASSWORD=
compose: |
  services:
    pgadmin:
      image: dpage/pgadmin4:latest
      restart: unless-stopped
      environment:
        - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:?}
        - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:?}
      volumes:
        - pgadmin-data:/var/lib/pgadmin
      healthcheck:
        test: [CMD, wget, -qO-, http://localhost:80/login]
        interval: 5s
        timeout: 10s
        retries: 5
      ports:
        - ${PORT:-8080}:80
  volumes:
    pgadmin-data:
