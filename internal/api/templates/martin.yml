# Converted from Coolify's service templates (Apache-2.0).
name: Martin
category: Backend
description: Martin is a tile server able to generate and serve vector tiles on the fly from large PostGIS databases, PMTiles (local or remote), and MBTiles files, allowing multiple tile sources to be dynamically combined into one.
website: https://maplibre.org/martin/introduction.html/
tags:
  - postgis
  - vector
  - tiles
logo: templates/martin.webp
env: |-
  PORT=3000
  MARTIN_URL=http://{{host}}:${PORT}
  POSTGRES_USER={{user}}
  POSTGRES_PASSWORD={{secret}}

  # Optional settings
  POSTGRES_DB=martin-db
compose: |
  services:
    martin:
      image: ghcr.io/maplibre/martin:v0.13.0
      restart: unless-stopped
      environment:
        - HOST=${MARTIN_URL}
        - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresql:5432/${POSTGRES_DB:-martin-db}
      depends_on:
        postgresql:
          condition: service_healthy
      healthcheck:
        test: [CMD, wget, -q, --spider, http://127.0.0.1:3000]
        interval: 5s
        timeout: 20s
        retries: 10
      ports:
        - ${PORT:-3000}:3000
    postgresql:
      image: postgis/postgis:16-3.4-alpine
      restart: unless-stopped
      platform: linux/amd64
      volumes:
        - martin-postgresql-data:/var/lib/postgresql/data
      environment:
        - POSTGRES_USER=$POSTGRES_USER
        - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
        - POSTGRES_DB=${POSTGRES_DB:-martin-db}
      healthcheck:
        test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 20s
        retries: 10
  volumes:
    martin-postgresql-data:
