# Converted from Coolify's service templates (Apache-2.0).
name: FreshRSS with MySQL
category: News & RSS
description: A free, self-hostable feed aggregator.
website: https://freshrss.org/index.html
tags:
  - rss
  - feed
logo: templates/freshrss.webp
env: |-
  PORT=8080
  MYSQL_USER={{user}}
  MYSQL_PASSWORD={{secret}}
  ROOT_PASSWORD={{secret}}

  # Optional settings
  CRON_MIN=1,31
  MYSQL_DATABASE=freshrss
compose: |
  services:
    freshrss:
      image: freshrss/freshrss:latest
      restart: unless-stopped
      environment:
        - CRON_MIN=${CRON_MIN:-1,31}
        - MYSQL_DB=${MYSQL_DATABASE:-freshrss}
        - MYSQL_USER=${MYSQL_USER}
        - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      volumes:
        - freshrss-data:/var/www/FreshRSS/data
        - freshrss-extensions:/var/www/FreshRSS/extensions
      depends_on:
        freshrss-db:
          condition: service_healthy
      healthcheck:
        test: [CMD-SHELL, "bash -c ':> /dev/tcp/127.0.0.1/80' || exit 1"]
        interval: 5s
        timeout: 20s
        retries: 3
      ports:
        - ${PORT:-8080}:80
    freshrss-db:
      image: mysql:8
      restart: unless-stopped
      volumes:
        - mysql-data:/var/lib/mysql
      environment:
        - MYSQL_ROOT_PASSWORD=$ROOT_PASSWORD
        - MYSQL_DATABASE=${MYSQL_DATABASE:-freshrss}
        - MYSQL_USER=$MYSQL_USER
        - MYSQL_PASSWORD=$MYSQL_PASSWORD
      healthcheck:
        test: [CMD, mysqladmin, ping, -h, 127.0.0.1]
        interval: 5s
        timeout: 20s
        retries: 10
  volumes:
    freshrss-data:
    freshrss-extensions:
    mysql-data:
