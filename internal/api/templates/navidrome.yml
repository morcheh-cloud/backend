# Converted from Coolify's service templates (Apache-2.0).
name: Navidrome
category: Media
description: Standalone server, that allows you to browse and listen to your music collection using a web browser or any Subsonic-compatible client.
website: https://www.navidrome.org/docs/
tags:
  - media
  - server
  - music
  - subsonic
logo: templates/navidrome.svg
env: |-
  PORT=4533
  NAVIDROME_URL=http://{{host}}:${PORT}

  # Optional settings
  ND_SCANSCHEDULE=1h
  ND_LOGLEVEL=info
  ND_SESSIONTIMEOUT=24h
  ND_ENABLEINSIGHTSCOLLECTOR=false
compose: |
  services:
    navidrome:
      image: deluan/navidrome:latest
      restart: unless-stopped
      environment:
        - ND_BASEURL=${NAVIDROME_URL}
        - ND_SCANSCHEDULE=${ND_SCANSCHEDULE:-1h}
        - ND_LOGLEVEL=${ND_LOGLEVEL:-info}
        - ND_SESSIONTIMEOUT=${ND_SESSIONTIMEOUT:-24h}
        - ND_ENABLEINSIGHTSCOLLECTOR=${ND_ENABLEINSIGHTSCOLLECTOR:-false}
      volumes:
        - ./data:/data
        - ./music:/music:ro
      healthcheck:
        test: [CMD, wget, --spider, --quiet, http://127.0.0.1:4533/ping]
        interval: 10s
        timeout: 5s
        retries: 5
      ports:
        - ${PORT:-4533}:4533
