# Converted from Coolify's service templates (Apache-2.0).
name: ElectricSQL
category: Backend
description: Sync shape-based subsets of your Postgres data over HTTP.
website: https://electric-sql.com/docs/guides/deployment
tags:
  - electric
  - electricsql
  - realtime
  - sync
  - postgresql
logo: templates/electricsql.svg
env: |-
  PORT=3000
  ELECTRIC_PASSWORD={{secret:64}}

  # Fill these in before starting
  DATABASE_URL=

  # Optional settings
  ELECTRIC_USAGE_REPORTING=false
compose: |
  services:
    electric:
      image: electricsql/electric:1.4.2
      restart: unless-stopped
      environment:
        - DATABASE_URL=${DATABASE_URL:?}
        - ELECTRIC_SECRET=${ELECTRIC_PASSWORD}
        - ELECTRIC_STORAGE_DIR=/app/persistent
        - ELECTRIC_USAGE_REPORTING=${ELECTRIC_USAGE_REPORTING:-false}
      volumes:
        - electric_data:/app/persistent
      healthcheck:
        test: [CMD, curl, -f, http://127.0.0.1:3000/v1/health]
        interval: 10s
        timeout: 5s
        retries: 5
      ports:
        - ${PORT:-3000}:3000
  volumes:
    electric_data:
