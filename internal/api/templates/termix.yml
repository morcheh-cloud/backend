# Converted from Coolify's service templates (Apache-2.0).
name: Termix
category: Development
description: All-in-One SSH & Remote Desktop management app.
website: https://docs.termix.site/install/server/docker
tags:
  - ssh
  - terminal
  - remote-desktop
  - rdp
  - vnc
  - server-management
  - remote-access
env: |-
  PORT=8080

  # Optional settings
  LOG_LEVEL=info
compose: |
  services:
    termix:
      image: ghcr.io/lukegus/termix:2.6.1
      restart: unless-stopped
      environment:
        - PORT=8080
        - LOG_LEVEL=${LOG_LEVEL:-info}
        - GUACD_HOST=guacd
        - GUACD_RECORDING_PATH=/termix-data/session_recordings/guacamole
      depends_on:
        - guacd
      volumes:
        - termix-data:/app/data
      ports:
        - ${PORT:-8080}:8080
    guacd:
      image: guacamole/guacd:1.6.0
      restart: unless-stopped
  volumes:
    termix-data:
