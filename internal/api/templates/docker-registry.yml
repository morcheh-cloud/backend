# Converted from Coolify's service templates (Apache-2.0).
name: Docker Registry
category: Development
description: The Docker Registry lets you distribute Docker images.
website: https://distribution.github.io/distribution/
tags:
  - registry
  - images
  - docker
logo: templates/docker-registry.webp
featured: true
env: |-
  PORT=5000
  REGISTRY_USER={{user}}
  REGISTRY_PASSWORD={{secret}}

  # Optional settings
  USERNAME=
  PASSWORD=
  REGISTRY_AUTH_HTPASSWD_PATH=
compose: |
  services:
    registry:
      image: registry:3
      restart: unless-stopped
      environment:
        - USERNAME=${REGISTRY_USER}
        - PASSWORD=${REGISTRY_PASSWORD}
        - REGISTRY_AUTH=htpasswd
        - REGISTRY_AUTH_HTPASSWD_REALM=Registry Realm
        - REGISTRY_AUTH_HTPASSWD_PATH=/auth/registry.password
      command: [/entrypoint.sh]
      volumes:
        - registry-data:/var/lib/registry
      healthcheck:
        test: [CMD, wget, -q, --spider, http://localhost:5000/]
        interval: 5s
        timeout: 20s
        retries: 10
      ports:
        - ${PORT:-5000}:5000
      configs:
        - source: registry-entrypoint.sh
          target: /entrypoint.sh
        - source: registry-config.yml
          target: /etc/docker/registry/config.yml
  volumes:
    registry-data:
  configs:
    registry-entrypoint.sh:
      content: |
        #!/usr/bin/env sh
        set -e 

        if [ -z "$USERNAME" ] || [ -z "$PASSWORD" ]; then
            echo "Error: USERNAME and PASSWORD environment variables must be set"
            exit 1
        fi

        apk add --no-cache apache2-utils
        mkdir -p "$(dirname "$REGISTRY_AUTH_HTPASSWD_PATH")"
        chmod 755 "$(dirname "$REGISTRY_AUTH_HTPASSWD_PATH")"
        htpasswd -Bbc "$REGISTRY_AUTH_HTPASSWD_PATH" "$USERNAME" "$PASSWORD"
        registry serve /etc/docker/registry/config.yml
    registry-config.yml:
      content: |-
        version: 0.1
        log:
          fields:
            service: registry
        storage:
          cache:
            blobdescriptor: inmemory
          filesystem:
            rootdirectory: /var/lib/registry
        http:
          addr: :5000
          headers:
            X-Content-Type-Options: [nosniff]
        health:
          storagedriver:
            enabled: true
            interval: 10s
            threshold: 3
