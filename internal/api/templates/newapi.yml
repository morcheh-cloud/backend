# Converted from Coolify's service templates (Apache-2.0).
name: New API
category: Development
description: The next-generation LLM gateway and AI asset management system supports multiple languages.
website: https://docs.newapi.pro/en/getting-started/
tags:
  - api
  - openai
  - llm
  - api-gateway
  - api-management
logo: templates/newapi.webp
env: |-
  PORT=3000
  POSTGRES_USER={{user}}
  POSTGRES_PASSWORD={{secret}}
  SESSION_SECRET_SECRET={{secret:64}}

  # Optional settings
  POSTGRES_DATABASE=newapi
  TZ=Asia/Shanghai
  ERROR_LOG_ENABLED=true
compose: |
  services:
    new-api:
      image: calciumion/new-api:v0.9.2.0
      restart: unless-stopped
      depends_on:
        postgresql:
          condition: service_healthy
        redis:
          condition: service_healthy
      environment:
        - SQL_DSN=postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@postgresql:5432/${POSTGRES_DATABASE:-newapi}?sslmode=disable&TimeZone=${TZ:-Asia/Shanghai}
        - REDIS_CONN_STRING=redis://redis:6379
        - TZ=${TZ:-Asia/Shanghai}
        - SESSION_SECRET=$SESSION_SECRET_SECRET
        - ERROR_LOG_ENABLED=${ERROR_LOG_ENABLED:-true}
      healthcheck:
        test: [CMD-SHELL, "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' | awk -F: '{print $2}'"]
        interval: 30s
        timeout: 10s
        retries: 3
      ports:
        - ${PORT:-3000}:3000
    postgresql:
      image: postgres:16-alpine
      restart: unless-stopped
      environment:
        - POSTGRES_USER=$POSTGRES_USER
        - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
        - POSTGRES_DB=${POSTGRES_DATABASE:-newapi}
      volumes:
        - postgresql-data:/var/lib/postgresql/data
      healthcheck:
        test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB:-newapi}"]
        interval: 5s
        timeout: 10s
        retries: 20
    redis:
      image: redis:7-alpine
      restart: unless-stopped
      volumes:
        - redis-data:/data
      healthcheck:
        test: [CMD, redis-cli, PING]
        interval: 5s
        timeout: 10s
        retries: 20
  volumes:
    postgresql-data:
    redis-data:
