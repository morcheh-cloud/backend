# Converted from Coolify's service templates (Apache-2.0).
name: Onetime Secret
category: Security
description: Share sensitive information securely with self-destructing links that are only viewable once.
website: https://docs.onetimesecret.com
tags:
  - auth
  - password
  - secret
  - secure
logo: templates/onetimesecret.svg
env: |-
  PORT=3000
  REDIS_PASSWORD={{secret}}
  ONETIMESECRET_PASSWORD={{secret}}

  # Optional settings
  AUTH_AUTOVERIFY=true
  AUTH_SIGNUP=true
  COLONEL=admin@example.com
  HOST=localhost
  SSL=false
compose: |
  services:
    onetimesecret:
      image: onetimesecret/onetimesecret:latest
      restart: unless-stopped
      environment:
        - AUTH_AUTOVERIFY=${AUTH_AUTOVERIFY:-true}
        - AUTH_SIGNUP=${AUTH_SIGNUP:-true}
        - COLONEL=${COLONEL:-admin@example.com}
        - HOST=${HOST:-localhost}
        - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
        - SECRET=${ONETIMESECRET_PASSWORD}
        - SSL=${SSL:-false}
        - RACK_ENV=production
      depends_on:
        redis:
          condition: service_healthy
      healthcheck:
        test: [CMD, ruby, -rnet/http, -e, "exit(Net::HTTP.get_response(URI('http://localhost:3000')).is_a?(Net::HTTPSuccess) ? 0 : 1)"]
        interval: 30s
        timeout: 10s
        retries: 3
      ports:
        - ${PORT:-3000}:3000
    redis:
      image: redis:8-alpine
      restart: unless-stopped
      command: redis-server --requirepass ${REDIS_PASSWORD}
      healthcheck:
        test: [CMD, redis-cli, ping]
        interval: 30s
        timeout: 10s
        retries: 3
