# Converted from Coolify's service templates (Apache-2.0).
name: GitHub Actions Runner
category: Development
description: A GitHub Actions runner for Docker
website: https://github.com/myoung34/docker-github-actions-runner/wiki/Usage
tags:
  - github
  - actions
  - runner
  - docker
logo: templates/github-runner.webp
env: |-
  # Optional settings
  REPO_URL=
  RUNNER_NAME_PREFIX=coolify-runner
  RUNNER_NAME_SUFFIX=false
  ACCESS_TOKEN=
  RUNNER_SCOPE=repo
  LABELS=default
  ORG_NAME=
compose: |
  services:
    runner:
      image: myoung34/github-runner:latest
      restart: unless-stopped
      environment:
        - REPO_URL=${REPO_URL}
        - RUNNER_NAME_PREFIX=${RUNNER_NAME_PREFIX:-coolify-runner}
        - RUNNER_NAME_SUFFIX=${RUNNER_NAME_SUFFIX:-false}
        - ACCESS_TOKEN=${ACCESS_TOKEN}
        - RUNNER_WORKDIR=/runner/work
        - RUNNER_SCOPE=${RUNNER_SCOPE:-repo}
        - LABELS=${LABELS:-default}
        - ORG_NAME=${ORG_NAME}
      security_opt:
        - label:disable
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - runner-data:/runner
      healthcheck:
        test: [CMD-SHELL, "ps aux | grep '[R]unner' > /dev/null || exit 1"]
        interval: 5s
        timeout: 10s
        retries: 15
  volumes:
    runner-data:
