# Converted from Coolify's service templates (Apache-2.0).
name: n8n with PostgreSQL
category: Automation
description: n8n is an extendable workflow automation tool.
website: https://n8n.io
tags:
  - n8n
  - workflow
  - automation
  - open
  - source
  - low
  - code
logo: templates/n8n.webp
featured: true
env: |-
  PORT=5678
  N8N_URL=http://{{host}}:${PORT}
  POSTGRES_USER={{user}}
  POSTGRES_PASSWORD={{secret}}
  N8N_PASSWORD={{secret}}

  # Optional settings
  N8N_PROTOCOL=https
  GENERIC_TIMEZONE=UTC
  TZ=UTC
  POSTGRES_DB=n8n
  N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
  N8N_RUNNERS_BROKER_PORT=5679
  N8N_NATIVE_PYTHON_RUNNER=true
  N8N_RUNNERS_MAX_CONCURRENCY=5
  N8N_BLOCK_ENV_ACCESS_IN_NODE=true
  N8N_GIT_NODE_DISABLE_BARE_REPOS=true
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
  N8N_PROXY_HOPS=1
  N8N_SKIP_AUTH_ON_OAUTH_CALLBACK=false
  N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
  N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT=15
compose: |
  services:
    n8n:
      image: n8nio/n8n:2.10.2
      restart: unless-stopped
      environment:
        - N8N_EDITOR_BASE_URL=${N8N_URL}
        - WEBHOOK_URL=${N8N_URL}
        - N8N_HOST=${N8N_URL}
        - N8N_PROTOCOL=${N8N_PROTOCOL:-https}
        - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-UTC}
        - TZ=${TZ:-UTC}
        - DB_TYPE=postgresdb
        - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
        - DB_POSTGRESDB_HOST=postgresql
        - DB_POSTGRESDB_PORT=5432
        - DB_POSTGRESDB_USER=$POSTGRES_USER
        - DB_POSTGRESDB_SCHEMA=public
        - DB_POSTGRESDB_PASSWORD=$POSTGRES_PASSWORD
        - N8N_RUNNERS_ENABLED=true
        - N8N_RUNNERS_MODE=external
        - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=${N8N_RUNNERS_BROKER_LISTEN_ADDRESS:-0.0.0.0}
        - N8N_RUNNERS_BROKER_PORT=${N8N_RUNNERS_BROKER_PORT:-5679}
        - N8N_RUNNERS_AUTH_TOKEN=$N8N_PASSWORD
        - N8N_NATIVE_PYTHON_RUNNER=${N8N_NATIVE_PYTHON_RUNNER:-true}
        - N8N_RUNNERS_MAX_CONCURRENCY=${N8N_RUNNERS_MAX_CONCURRENCY:-5}
        - N8N_BLOCK_ENV_ACCESS_IN_NODE=${N8N_BLOCK_ENV_ACCESS_IN_NODE:-true}
        - N8N_GIT_NODE_DISABLE_BARE_REPOS=${N8N_GIT_NODE_DISABLE_BARE_REPOS:-true}
        - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS:-true}
        - N8N_PROXY_HOPS=${N8N_PROXY_HOPS:-1}
        - N8N_SKIP_AUTH_ON_OAUTH_CALLBACK=${N8N_SKIP_AUTH_ON_OAUTH_CALLBACK:-false}
      volumes:
        - n8n-data:/home/node/.n8n
      depends_on:
        postgresql:
          condition: service_healthy
      healthcheck:
        test: [CMD-SHELL, wget -qO- http://127.0.0.1:5678/healthz]
        interval: 5s
        timeout: 20s
        retries: 10
      ports:
        - ${PORT:-5678}:5678
    task-runners:
      image: n8nio/runners:2.10.2
      restart: unless-stopped
      environment:
        - N8N_RUNNERS_TASK_BROKER_URI=${N8N_RUNNERS_TASK_BROKER_URI:-http://n8n:5679}
        - N8N_RUNNERS_AUTH_TOKEN=$N8N_PASSWORD
        - N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT=${N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT:-15}
        - N8N_RUNNERS_MAX_CONCURRENCY=${N8N_RUNNERS_MAX_CONCURRENCY:-5}
      depends_on:
        - n8n
      healthcheck:
        test: [CMD-SHELL, wget -qO- http://127.0.0.1:5680/healthz]
        interval: 5s
        timeout: 20s
        retries: 10
    postgresql:
      image: postgres:16-alpine
      restart: unless-stopped
      volumes:
        - postgresql-data:/var/lib/postgresql/data
      environment:
        - POSTGRES_USER=$POSTGRES_USER
        - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
        - POSTGRES_DB=${POSTGRES_DB:-n8n}
      healthcheck:
        test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 20s
        retries: 10
  volumes:
    n8n-data:
    postgresql-data:
