# Converted from Coolify's service templates (Apache-2.0).
name: Elasticsearch with Kibana
category: Monitoring
description: Elastic + Kibana is a Free and Open Source Search, Monitoring, and Visualization Stack
website: https://www.elastic.co/docs/deploy-manage/deploy/self-managed/install-kibana-with-docker
tags:
  - elastic
  - kibana
  - elasticsearch
  - search
  - visualization
  - logging
  - monitoring
  - observability
  - analytics
  - stack
  - devops
logo: templates/elasticsearch.svg
env: |-
  PORT=5601
  ELASTICSEARCH_PASSWORD={{secret}}
  KIBANA_PASSWORD={{secret}}
  KIBANA_HOST={{host}}:${PORT}
  KIBANA_URL=http://{{host}}:${PORT}
  XPACKSECURITY_PASSWORD={{secret}}
  XPACKREPORTING_PASSWORD={{secret}}
  XPACKENCRYPTEDSAVEDOBJECTS_PASSWORD={{secret}}

  # Optional settings
  ELASTICSEARCH_SERVICEACCOUNTTOKEN=
  TELEMETRY_OPTIN=false
compose: |
  services:
    elasticsearch:
      image: elastic/elasticsearch:9.1.2
      restart: unless-stopped
      environment:
        - ELASTIC_USER=elastic
        - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD}
        - ES_JAVA_OPTS=-Xms512m -Xmx512m
        - discovery.type=single-node
        - bootstrap.memory_lock=true
        - xpack.security.http.ssl.enabled=false
      volumes:
        - /etc/localtime:/etc/localtime:ro
        - elasticsearch-data:/usr/share/elasticsearch/data
      healthcheck:
        test: [CMD-SHELL, "curl --user elastic:${ELASTICSEARCH_PASSWORD} --silent --fail http://localhost:9200/_cluster/health"]
        interval: 10s
        timeout: 10s
        retries: 24
    kibana:
      image: kibana:9.1.2
      restart: unless-stopped
      environment:
        - KIBANA_PASSWORD=${KIBANA_PASSWORD}
        - ELASTICSEARCH_SERVICEACCOUNTTOKEN=${ELASTICSEARCH_SERVICEACCOUNTTOKEN}
        - SERVER_NAME=${KIBANA_HOST}
        - SERVER_PUBLICBASEURL=${KIBANA_URL}
        - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
        - XPACK.SECURITY.ENABLED=true
        - XPACK_SECURITY_ENCRYPTIONKEY=${XPACKSECURITY_PASSWORD}
        - XPACK_REPORTING_ENCRYPTIONKEY=${XPACKREPORTING_PASSWORD}
        - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${XPACKENCRYPTEDSAVEDOBJECTS_PASSWORD}
        - TELEMETRY_OPTIN=${TELEMETRY_OPTIN:-false}
      volumes:
        - /etc/localtime:/etc/localtime:ro
        - kibana-data:/usr/share/kibana/data
      depends_on:
        elasticsearch:
          condition: service_healthy
      healthcheck:
        test: [CMD-SHELL, "curl -s -I http://localhost:5601 | grep -q 'HTTP/1.1 302 Found'"]
        interval: 10s
        timeout: 10s
        retries: 120
      ports:
        - ${PORT:-5601}:5601
    kibana-token-generator:
      image: alpine:latest
      depends_on:
        elasticsearch:
          condition: service_healthy
      environment:
        - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD}
      entrypoint:
        [
          sh,
          -c,
          "apk add --no-cache curl jq >/dev/null 2>&1

            echo \"Generating Kibana service token...\"

            RESPONSE=$(curl -s -w \"\\n%{http_code}\" -u elastic:\"$${ELASTIC_PASSWORD}\" -X POST \"http://elasticsearch:9200/_security/service/elastic/kibana/credential/token/kibana-service-token\")

            HTTP_CODE=$$(echo \"$${RESPONSE}\" | tail -n1)

            BODY=$$(echo \"$${RESPONSE}\" | head -n -1)

            if [ \"$${HTTP_CODE}\" = \"200\" ]; then

            \  CREATED=$$(echo \"$${BODY}\" | jq -r '.created')

            \  if [ \"$${CREATED}\" = \"true\" ]; then

            \    TOKEN_VALUE=$$(echo \"$${BODY}\" | jq -r '.token.value')

            \    echo \"Token created successfully:\"

            \    echo \"$${TOKEN_VALUE}\"

            \  else

            \    echo \"Unexpected response, token not created:\"

            \    echo \"$${BODY}\"

            \  fi

            elif [ \"$${HTTP_CODE}\" = \"409\" ]; then

            \  echo \"Token already exists. Skipping token creation.\"

            else

            \  echo \"Failed to create token. HTTP code: $${HTTP_CODE}\"

            \  echo \"$${BODY}\"

            \  exit 1

            fi\n"
        ]
      restart: no
  volumes:
    elasticsearch-data:
    kibana-data:
