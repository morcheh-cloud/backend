# Converted from Coolify's service templates (Apache-2.0).
name: Joomla with MariaDB
category: Websites
description: Joomla! is the mobile-ready and user-friendly way to build your website. Choose from thousands of features and designs. Joomla! is free and open source.
website: https://joomla.org
tags:
  - cms
  - blog
  - content
  - management
  - mariadb
logo: templates/joomla.svg
env: |-
  PORT=8080
  JOOMLA_USER={{user}}
  JOOMLA_PASSWORD={{secret}}
  ROOT_PASSWORD={{secret}}

  # Optional settings
  MYSQL_DATABASE=joomla-db
compose: |
  services:
    joomla:
      image: joomla:latest
      restart: unless-stopped
      volumes:
        - joomla_data:/var/www/html
      environment:
        - JOOMLA_DB_HOST=mariadb
        - JOOMLA_DB_USER=${JOOMLA_USER}
        - JOOMLA_DB_PASSWORD=${JOOMLA_PASSWORD}
        - JOOMLA_DB_NAME=${MYSQL_DATABASE:-joomla-db}
      depends_on:
        mariadb:
          condition: service_healthy
      healthcheck:
        test: [CMD, curl, -f, http://127.0.0.1]
        interval: 2s
        timeout: 10s
        retries: 10
      ports:
        - ${PORT:-8080}:80
    mariadb:
      image: mariadb:11
      restart: unless-stopped
      volumes:
        - joomla_mariadb_data:/var/lib/mysql
      environment:
        - MYSQL_ROOT_PASSWORD=${ROOT_PASSWORD}
        - MYSQL_DATABASE=${MYSQL_DATABASE:-joomla-db}
        - MYSQL_USER=${JOOMLA_USER}
        - MYSQL_PASSWORD=${JOOMLA_PASSWORD}
      healthcheck:
        test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
        interval: 5s
        timeout: 20s
        retries: 10
  volumes:
    joomla_data:
    joomla_mariadb_data:
