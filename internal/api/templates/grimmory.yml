# Converted from Coolify's service templates (Apache-2.0).
name: Grimmory
category: Tools
description: Grimmory is a self-hosted application for managing your entire book collection in one place. Organize, read, annotate, sync across devices, and share without relying on third-party services.
website: https://github.com/grimmory-tools/grimmory
tags:
  - books
  - ebooks
  - library
  - reader
logo: templates/grimmory.svg
env: |-
  PORT=8080
  MARIADB_USER={{user}}
  MARIADB_PASSWORD={{secret}}
  MARIADBROOT_PASSWORD={{secret}}

  # Optional settings
  GRIMMORY_USER_ID=0
  GRIMMORY_GROUP_ID=0
  TZ=UTC
  MARIADB_DATABASE=grimmory-db
compose: |
  services:
    grimmory:
      image: grimmory/grimmory:nightly-20260403-3a371f7
      restart: unless-stopped
      environment:
        - USER_ID=${GRIMMORY_USER_ID:-0}
        - GROUP_ID=${GRIMMORY_GROUP_ID:-0}
        - TZ=${TZ:-UTC}
        - DATABASE_URL=jdbc:mariadb://mariadb:3306/${MARIADB_DATABASE:-grimmory-db}
        - DATABASE_USERNAME=${MARIADB_USER}
        - DATABASE_PASSWORD=${MARIADB_PASSWORD}
        - BOOKLORE_PORT=80
      volumes:
        - grimmory-data:/app/data
        - grimmory-books:/books
        - grimmory-bookdrop:/bookdrop
      healthcheck:
        test: wget --no-verbose --tries=1 --spider http://127.0.0.1/health || exit 1
        interval: 10s
        timeout: 5s
        retries: 10
      depends_on:
        mariadb:
          condition: service_healthy
      ports:
        - ${PORT:-8080}:80
    mariadb:
      image: mariadb:12
      restart: unless-stopped
      environment:
        - MARIADB_USER=${MARIADB_USER}
        - MARIADB_PASSWORD=${MARIADB_PASSWORD}
        - MARIADB_ROOT_PASSWORD=${MARIADBROOT_PASSWORD}
        - MARIADB_DATABASE=${MARIADB_DATABASE:-grimmory-db}
      volumes:
        - mariadb-data:/var/lib/mysql
      healthcheck:
        test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
        interval: 10s
        timeout: 5s
        retries: 10
  volumes:
    grimmory-data:
    grimmory-books:
    grimmory-bookdrop:
    mariadb-data:
