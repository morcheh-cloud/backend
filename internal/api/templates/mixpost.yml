# Converted from Coolify's service templates (Apache-2.0).
name: Mixpost
category: Analytics
description: Mixpost is a robust and versatile social media management software, designed to streamline social media operations and enhance content marketing strategies.
website: https://docs.mixpost.app/lite
tags:
  - social media
  - marketing
  - content
  - management
  - automation
  - self-hosted
logo: templates/mixpost.svg
env: |-
  PORT=8080
  MIXPOST_SECRET={{secret}}
  MIXPOST_URL=http://{{host}}:${PORT}
  MYSQL_USER={{user}}
  MYSQL_PASSWORD={{secret}}
  ADMIN_PASSWORD={{secret}}
  MYSQLROOT_PASSWORD={{secret}}

  # Optional settings
  MYSQL_DATABASE=mixpost_db
  SSL_EMAIL=user@example.com
  u=
compose: |
  services:
    mixpost:
      image: inovector/mixpost:latest
      restart: unless-stopped
      environment:
        - APP_NAME=Mixpost
        - APP_KEY=${MIXPOST_SECRET}
        - APP_DEBUG=false
        - APP_DOMAIN=${MIXPOST_URL}
        - APP_URL=${MIXPOST_URL}
        - DB_DATABASE=${MYSQL_DATABASE:-mixpost_db}
        - DB_USERNAME=${MYSQL_USER}
        - DB_PASSWORD=${MYSQL_PASSWORD}
        - SSL_EMAIL=${SSL_EMAIL:-user@example.com}
        - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      volumes:
        - mixpost-storage:/var/www/html/storage/app
        - mixpost-logs:/var/www/html/storage/logs
      entrypoint: [/usr/local/bin/coolify-start.sh]
      healthcheck:
        test: [CMD-SHELL, "curl -fsS -o /dev/null http://127.0.0.1/mixpost/login || exit 1"]
        start_period: 60s
        interval: 10s
        timeout: 10s
        retries: 10
      depends_on:
        - mysql
        - redis
      ports:
        - ${PORT:-8080}:80
      configs:
        - source: mixpost-coolify-start.sh
          target: /usr/local/bin/coolify-start.sh
    mysql:
      image: mysql/mysql-server:8.0
      restart: unless-stopped
      environment:
        - MYSQL_DATABASE=${MYSQL_DATABASE:-mixpost_db}
        - MYSQL_USER=${MYSQL_USER}
        - MYSQL_PASSWORD=${MYSQL_PASSWORD}
        - MYSQL_ROOT_PASSWORD=${MYSQLROOT_PASSWORD}
      volumes:
        - mixpost-mysql:/var/lib/mysql
      healthcheck:
        test: [CMD, mysqladmin, ping, -h, 127.0.0.1, -uroot, "-p${MYSQLROOT_PASSWORD}"]
        interval: 5s
        timeout: 20s
        retries: 10
    redis:
      image: redis:alpine
      restart: unless-stopped
      healthcheck:
        test: [CMD, redis-cli, --raw, incr, ping]
  volumes:
    mixpost-storage:
    mixpost-logs:
    mixpost-mysql:
  configs:
    mixpost-coolify-start.sh:
      content: |
        #!/bin/sh
        # start.sh always creates admin@example.com with the password "changeme".
        # Replace that password with ADMIN_PASSWORD once, while it is still the default.
        (
          for i in $(seq 1 60); do
            sleep 5
            result=$(php /var/www/html/artisan tinker --no-ansi --execute='$u = Inovector\MixpostAuth\MixpostAuth::getUserClass()::where("email", "admin@example.com")->first(); if (! $u) { echo "wait"; } elseif (Illuminate\Support\Facades\Hash::check("changeme", $u->password)) { $u->password = bcrypt(getenv("ADMIN_PASSWORD")); $u->save(); echo "done"; } else { echo "done"; }' 2>/dev/null)
            [ "$result" = "done" ] && break
          done
        ) &
        exec /usr/local/bin/start.sh
