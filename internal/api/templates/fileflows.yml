# Converted from Coolify's service templates (Apache-2.0).
name: FileFlows
category: Media
description: FileFlows can drastically reduce your files, up to 90%, saving you space and money. No need to buy more hard drives, just shrink your files and start saving.
website: https://fileflows.com/docs/
tags:
  - media
  - transcode
  - convert
  - h265
logo: templates/fileflows.svg
env: |-
  FILEFLOWS_PORT=5000
  FILE_FLOWS_PORT=8080
  FILE_FLOWS_URL=http://{{host}}:${FILE_FLOWS_PORT}

  # Optional settings
  TZ=America/Toronto
compose: |
  services:
    fileflows:
      image: revenz/fileflows
      restart: unless-stopped
      environment:
        - _APP_URL=$FILE_FLOWS_URL
        - PUID=1000
        - PGID=1000
        - TZ=${TZ:-America/Toronto}
      volumes:
        - fileflows_temp:/temp
        - fileflows_configs:/app/Data
        - fileflows_logs:/app/Logs
        - fileflows_common:/app/common
      healthcheck:
        test: [CMD, curl, -f, http://localhost:5000/api/system/version]
        interval: 2s
        timeout: 10s
        retries: 15
      ports:
        - ${FILEFLOWS_PORT:-5000}:5000
        - ${FILE_FLOWS_PORT:-8080}:80
  volumes:
    fileflows_temp:
    fileflows_configs:
    fileflows_logs:
    fileflows_common:
