# Converted from Coolify's service templates (Apache-2.0).
name: Neon WebSocket Proxy
category: Networking
description: The database you love, on a serverless platform designed to help you build reliable and scalable applications faster.
website: https://neon.tech
tags:
  - proxy
  - neon
  - postgresql
logo: templates/neon.svg
env: |-
  NEONPROXY_PORT=8080
  NEONPROMETHEUS_PORT=2112
  POSTGRESQL_USER={{user}}
  POSTGRESQL_PASSWORD={{secret}}

  # Optional settings
  POSTGRESQL_DATABASE=postgres
compose: |
  services:
    neon-proxy:
      image: ghcr.io/neondatabase/wsproxy:latest
      environment:
        - APPEND_PORT=postgres:5432
        - ALLOW_ADDR_REGEX=.*
        - LOG_TRAFFIC=false
        - LOG_CONN_INFO=true
      restart: unless-stopped
      depends_on:
        - postgres
      healthcheck:
        test: [CMD-SHELL, nc -z 127.0.0.1 80]
        interval: 5s
        timeout: 2s
        retries: 20
      ports:
        - ${NEONPROXY_PORT:-8080}:80
        - ${NEONPROMETHEUS_PORT:-2112}:2112
    postgres:
      image: postgres:17-alpine
      restart: unless-stopped
      volumes:
        - postgresql-data:/var/lib/postgresql/data
      environment:
        - POSTGRES_USER=${POSTGRESQL_USER}
        - POSTGRES_PASSWORD=${POSTGRESQL_PASSWORD}
        - POSTGRES_DB=${POSTGRESQL_DATABASE:-postgres}
        - POSTGRES_HOST_AUTH_METHOD=password
      healthcheck:
        test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 20s
        retries: 10
  volumes:
    postgresql-data:
