# Converted from Coolify's service templates (Apache-2.0).
name: Vikunja
category: Productivity
description: The open-source, self-hostable to-do app. Organize everything, on all platforms.
website: https://vikunja.io
tags:
  - productivity
  - todo
logo: templates/vikunja.svg
featured: true
env: |-
  PORT=3456
  VIKUNJA_URL=http://{{host}}:${PORT}
  JWTSECRET_PASSWORD={{secret}}
compose: |
  services:
    vikunja:
      image: vikunja/vikunja
      restart: unless-stopped
      environment:
        - VIKUNJA_SERVICE_PUBLICURL=$VIKUNJA_URL
        - VIKUNJA_SERVICE_SECRET=$JWTSECRET_PASSWORD
        - VIKUNJA_SERVICE_ENABLEREGISTRATION=true
        - VIKUNJA_DATABASE_PATH=/db/vikunja.db
        - VIKUNJA_DATABASE_TYPE=sqlite
      volumes:
        - vikunja-data:/app/vikunja/
        - vikunja-sqlite-data:/db
      depends_on:
        - init
      healthcheck:
        test: [CMD, /app/vikunja/vikunja, healthcheck]
        interval: 30s
        timeout: 5s
        retries: 3
        start_period: 15s
      ports:
        - ${PORT:-3456}:3456
    init:
      image: busybox
      restart: no
      volumes:
        - vikunja-data:/app/vikunja
        - vikunja-sqlite-data:/db
      command: [sh, -c, "touch /db/vikunja.db && chown -R 1000 /db && chown -R 1000 /app/vikunja"]
  volumes:
    vikunja-data:
    vikunja-sqlite-data:
