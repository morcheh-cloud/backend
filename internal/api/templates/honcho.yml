# Converted from Coolify's service templates (Apache-2.0).
name: Honcho
category: AI
description: Honcho is a developer tool to build personalized AI agents with production-ready memory, dialectic reasoning, and stateful dialogue.
website: https://honcho.dev/docs/v3/contributing/self-hosting
tags:
  - ai
  - memory
  - llm
  - agents
  - rag
  - postgres
  - pgvector
  - redis
logo: templates/honcho.svg
env: |-
  PORT=8000
  POSTGRES_USER={{user}}
  POSTGRES_PASSWORD={{secret}}

  # Optional settings
  LOG_LEVEL=INFO
  LLM_OPENAI_API_KEY=
compose: |
  services:
    api:
      image: ghcr.io/plastic-labs/honcho:v3.0.12
      restart: unless-stopped
      entrypoint: [sh, docker/entrypoint.sh]
      environment:
        - DB_CONNECTION_URI=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/postgres
        - CACHE_URL=redis://redis:6379/0?suppress=true
        - CACHE_ENABLED=true
        - LOG_LEVEL=${LOG_LEVEL:-INFO}
        - AUTH_USE_AUTH=false
        - LLM_OPENAI_API_KEY=${LLM_OPENAI_API_KEY}
        - VECTOR_STORE_TYPE=pgvector
      healthcheck:
        test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 30s
      depends_on:
        database:
          condition: service_healthy
        redis:
          condition: service_healthy
      ports:
        - ${PORT:-8000}:8000
    deriver:
      image: ghcr.io/plastic-labs/honcho:v3.0.12
      restart: unless-stopped
      entrypoint: [/app/.venv/bin/python, -m, src.deriver]
      environment:
        - DB_CONNECTION_URI=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/postgres
        - CACHE_URL=redis://redis:6379/0?suppress=true
        - CACHE_ENABLED=true
        - LOG_LEVEL=${LOG_LEVEL:-INFO}
        - AUTH_USE_AUTH=false
        - LLM_OPENAI_API_KEY=${LLM_OPENAI_API_KEY}
        - VECTOR_STORE_TYPE=pgvector
      depends_on:
        api:
          condition: service_healthy
        database:
          condition: service_healthy
        redis:
          condition: service_healthy
    database:
      image: pgvector/pgvector:pg15
      restart: unless-stopped
      environment:
        - POSTGRES_DB=postgres
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      volumes:
        - honcho_pgdata:/var/lib/postgresql/data/
      healthcheck:
        test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 5s
        retries: 5
    redis:
      image: redis:8.2
      restart: unless-stopped
      volumes:
        - honcho_redis_data:/data
      healthcheck:
        test: [CMD-SHELL, redis-cli ping]
        interval: 5s
        timeout: 5s
        retries: 5
  volumes:
    honcho_pgdata:
    honcho_redis_data:
