# Converted from Coolify's service templates (Apache-2.0).
name: Web Check
category: Monitoring
description: All-in-one OSINT tool for analysing any website
website: https://github.com/lissy93/web-check
tags:
  - osint
  - website
  - analysis
logo: templates/web-check.webp
env: PORT=3000
compose: |
  services:
    web-check:
      image: lissy93/web-check
      restart: unless-stopped
      healthcheck:
        test: [CMD-SHELL, wget -qO- http://127.0.0.1:3000/]
        interval: 5s
        timeout: 20s
        retries: 10
      ports:
        - ${PORT:-3000}:3000
