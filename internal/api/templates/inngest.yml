# Converted from Coolify's service templates (Apache-2.0).
name: Inngest
category: Automation
description: Durable workflow engine for background jobs, queues and scheduled tasks.
website: https://www.inngest.com/docs/self-hosting
tags:
  - queue
  - workflow
  - jobs
  - events
  - background
  - automation
logo: templates/inngest.webp
env: |-
  PORT=8288
  EVENTKEY_HEX={{hex:32}}
  SIGNINGKEY_HEX={{hex:32}}
  POSTGRES_PASSWORD={{secret}}
compose: |
  services:
    inngest:
      image: inngest/inngest:v1.27.0
      command: inngest start --host 0.0.0.0
      environment:
        - INNGEST_EVENT_KEY=${EVENTKEY_HEX}
        - INNGEST_SIGNING_KEY=${SIGNINGKEY_HEX}
        - INNGEST_POSTGRES_URI=postgres://inngest:${POSTGRES_PASSWORD}@postgres:5432/inngest
        - INNGEST_REDIS_URI=redis://redis:6379
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
      healthcheck:
        test: [CMD, inngest, alpha, doctor, healthcheck]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 40s
      restart: unless-stopped
      ports:
        - ${PORT:-8288}:8288
    postgres:
      image: postgres:17
      environment:
        - POSTGRES_DB=inngest
        - POSTGRES_USER=inngest
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      volumes:
        - postgres-data:/var/lib/postgresql/data
      healthcheck:
        test: [CMD-SHELL, pg_isready -U inngest -d inngest]
        interval: 5s
        timeout: 5s
        retries: 5
      restart: unless-stopped
    redis:
      image: redis:7-alpine
      command: redis-server --appendonly yes
      volumes:
        - redis-data:/data
      healthcheck:
        test: [CMD, redis-cli, ping]
        interval: 5s
        timeout: 3s
        retries: 5
      restart: unless-stopped
  volumes:
    postgres-data:
    redis-data:
