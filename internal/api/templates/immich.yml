# Converted from Coolify's service templates (Apache-2.0).
name: Immich
category: Media
description: Self-hosted photo and video management solution.
website: https://immich.app/docs/overview/introduction
tags:
  - photo
  - video
  - management
  - server
  - cloud
  - storage
  - sharing
  - metadata
  - face
  - recognition
logo: templates/immich.svg
featured: true
env: |-
  PORT=2283
  POSTGRES_PASSWORD={{secret}}
  POSTGRES_USER={{user}}

  # Optional settings
  IMMICH_VERSION=release
  DB_DATABASE_NAME=immich
  TZ=Etc/UTC
  DB_STORAGE_TYPE=SSD
compose: |
  services:
    immich:
      image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
      restart: unless-stopped
      volumes:
        - immich-uploads:/usr/src/app/upload
        - /etc/localtime:/etc/localtime:ro
      environment:
        - UPLOAD_LOCATION=./library
        - DB_DATA_LOCATION=./postgres
        - DB_PASSWORD=$POSTGRES_PASSWORD
        - DB_USERNAME=$POSTGRES_USER
        - DB_DATABASE_NAME=${DB_DATABASE_NAME:-immich}
        - TZ=${TZ:-Etc/UTC}
      depends_on:
        redis:
          condition: service_healthy
        database:
          condition: service_healthy
      healthcheck:
        disable: false
      ports:
        - ${PORT:-2283}:2283
    immich-machine-learning:
      image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
      restart: unless-stopped
      volumes:
        - immich-model-cache:/cache
      environment:
        - UPLOAD_LOCATION=./library
        - DB_DATA_LOCATION=./postgres
        - DB_PASSWORD=$POSTGRES_PASSWORD
        - DB_USERNAME=$POSTGRES_USER
        - DB_DATABASE_NAME=${DB_DATABASE_NAME:-immich}
        - TZ=${TZ:-Etc/UTC}
      healthcheck:
        disable: false
    redis:
      image: redis:7.4-alpine
      restart: unless-stopped
      healthcheck:
        test: [CMD, redis-cli, PING]
        interval: 5s
        timeout: 10s
        retries: 20
    database:
      image: ghcr.io/immich-app/postgres:14-vectorchord0.3.0-pgvectors0.2.0
      restart: unless-stopped
      environment:
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
        POSTGRES_INITDB_ARGS: --data-checksums
        DB_STORAGE_TYPE: ${DB_STORAGE_TYPE:-SSD}
      volumes:
        - immich-postgres-data:/var/lib/postgresql/data
      healthcheck:
        test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 20s
        retries: 10
  volumes:
    immich-uploads:
    immich-model-cache:
    immich-postgres-data:
