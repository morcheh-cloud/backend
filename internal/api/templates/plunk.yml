# Converted from Coolify's service templates (Apache-2.0).
name: Plunk
category: Email
description: Plunk, The Open-Source Email Platform for AWS
website: https://docs.useplunk.com/getting-started/introduction
tags:
  - plunk
  - email
  - automation
  - aws
logo: templates/plunk.svg
env: |-
  PORT=3000
  POSTGRES_USER={{user}}
  POSTGRES_PASSWORD={{secret}}
  JWTSECRET_PASSWORD={{secret}}
  PLUNK_URL=http://{{host}}:${PORT}

  # Fill these in before starting
  AWS_REGION=
  AWS_ACCESS_KEY_ID=
  AWS_SECRET_ACCESS_KEY=
  AWS_SES_CONFIGURATION_SET=

  # Optional settings
  DISABLE_SIGNUPS=False
  POSTGRES_DB=plunk-db
compose: |
  services:
    plunk:
      image: driaug/plunk:latest
      restart: unless-stopped
      depends_on:
        postgresql:
          condition: service_healthy
        redis:
          condition: service_started
      environment:
        - REDIS_URL=redis://redis:6379
        - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresql/plunk-db?schema=public
        - JWT_SECRET=${JWTSECRET_PASSWORD}
        - AWS_REGION=${AWS_REGION:?}
        - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:?}
        - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:?}
        - AWS_SES_CONFIGURATION_SET=${AWS_SES_CONFIGURATION_SET:?}
        - NEXT_PUBLIC_API_URI=${PLUNK_URL}/api
        - APP_URI=${PLUNK_URL}
        - API_URI=${PLUNK_URL}/api
        - DISABLE_SIGNUPS=${DISABLE_SIGNUPS:-False}
        - NODE_OPTIONS=--no-network-family-autoselection
      entrypoint: [/app/entry.sh]
      healthcheck:
        test: [CMD-SHELL, "(wget -S --spider http://127.0.0.1:3000/api/health 2>&1 | grep -q \"HTTP/1.1 [1-3]\")"]
        interval: 2s
        timeout: 10s
        retries: 15
      ports:
        - ${PORT:-3000}:3000
    postgresql:
      image: postgres:16-alpine
      restart: unless-stopped
      environment:
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DB:-plunk-db}
      volumes:
        - plunk-postgresql-data:/var/lib/postgresql/data
      healthcheck:
        test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 20s
        retries: 10
    redis:
      image: redis:7.4-alpine
      restart: unless-stopped
      volumes:
        - plunk-redis-data:/data
      healthcheck:
        test: [CMD, redis-cli, PING]
        interval: 5s
        timeout: 10s
        retries: 20
  volumes:
    plunk-postgresql-data:
    plunk-redis-data:
