# Converted from Coolify's service templates (Apache-2.0).
name: Nextcloud with PostgreSQL
category: Storage
description: NextCloud is a self-hosted, open-source platform that provides file storage, collaboration, and communication tools for seamless data management.
website: https://docs.nextcloud.com
tags:
  - cloud
  - collaboration
  - communication
  - filestorage
  - data
logo: templates/nextcloud.svg
env: |-
  PORT=8080
  POSTGRES_USER={{user}}
  POSTGRES_PASSWORD={{secret}}

  # Optional settings
  TZ=Europe/Paris
  POSTGRES_DB=nextcloud
compose: |
  services:
    nextcloud:
      image: lscr.io/linuxserver/nextcloud:latest
      restart: unless-stopped
      environment:
        - PUID=1000
        - PGID=1000
        - TZ=${TZ:-Europe/Paris}
        - POSTGRES_DB=${POSTGRES_DB:-nextcloud}
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_HOST=nextcloud-db
        - REDIS_HOST=redis
        - REDIS_PORT=6379
      volumes:
        - nextcloud-config:/config
        - nextcloud-data:/data
      depends_on:
        nextcloud-db:
          condition: service_healthy
        redis:
          condition: service_healthy
      healthcheck:
        test: [CMD, curl, -f, http://127.0.0.1:80/status.php]
        interval: 30s
        timeout: 10s
        retries: 15
      ports:
        - ${PORT:-8080}:80
    nextcloud-db:
      image: postgres:16-alpine
      restart: unless-stopped
      volumes:
        - nextcloud-postgresql-data:/var/lib/postgresql/data
      environment:
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DB:-nextcloud}
      healthcheck:
        test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 20s
        retries: 10
    redis:
      image: redis:7.4-alpine
      restart: unless-stopped
      volumes:
        - nextcloud-redis-data:/data
      healthcheck:
        test: [CMD, redis-cli, PING]
        interval: 5s
        timeout: 10s
        retries: 20
  volumes:
    nextcloud-config:
    nextcloud-data:
    nextcloud-postgresql-data:
    nextcloud-redis-data:
