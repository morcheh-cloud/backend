# Converted from Coolify's service templates (Apache-2.0).
name: DocuSeal with PostgreSQL
category: Productivity
description: Document Signing for Everyone free forever for individuals, extensible for businesses and developers. Open Source Alternative to DocuSign, PandaDoc and more.
website: https://www.docuseal.co/
tags:
  - documentation
logo: templates/docuseal.webp
env: |-
  PORT=3000
  DOCUSEAL_URL=http://{{host}}:${PORT}
  POSTGRES_USER={{user}}
  POSTGRES_PASSWORD={{secret}}

  # Optional settings
  POSTGRES_DB=
compose: |
  services:
    docuseal:
      image: docuseal/docuseal:latest
      restart: unless-stopped
      environment:
        - HOST=${DOCUSEAL_URL}
        - DATABASE_URL=postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@postgresql:5432/${POSTGRES_DB}
      volumes:
        - docuseal-data:/data
      depends_on:
        postgresql:
          condition: service_healthy
      healthcheck:
        test: [CMD, wget, -q, --spider, http://127.0.0.1:3000]
        interval: 5s
        timeout: 20s
        retries: 10
      ports:
        - ${PORT:-3000}:3000
    postgresql:
      image: postgres:16-alpine
      restart: unless-stopped
      volumes:
        - postgresql-data:/var/lib/postgresql/data
      environment:
        - POSTGRES_USER=$POSTGRES_USER
        - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
        - POSTGRES_DB=${POSTGRES_DB:-docuseal}
      healthcheck:
        test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 20s
        retries: 10
  volumes:
    docuseal-data:
    postgresql-data:
