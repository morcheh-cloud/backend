# Converted from Coolify's service templates (Apache-2.0).
name: Budibase
category: Automation
description: Low code platform for building business apps and workflows in minutes. Supports PostgreSQL, MySQL, MSSQL, MongoDB, Rest API, Docker, K8s, and more.
website: https://docs.budibase.com/docs/docker-compose
tags:
  - budibase
  - low-code
  - business-apps
  - workflow
  - automation
  - postgresql
  - mysql
  - mssql
  - mongodb
  - docker
  - kubernetes
logo: templates/budibase.svg
env: |-
  PORT=10000
  COUCHDB_USER={{user}}
  COUCHDB_PASSWORD={{secret}}
  MINIO_USER={{user}}
  MINIO_PASSWORD={{secret}}
  BUDIBASE_SECRET={{secret:128}}
  BUDIBASEAPI_SECRET={{secret:64}}
  BUDIBASE_SECRET_2={{secret:64}}
  BUDIBASEJWT_SECRET={{secret:64}}
  REDIS_PASSWORD={{secret}}

  # Optional settings
  BUDIBASE_ENVIRONMENT=PRODUCTION
  ENABLE_ANALYTICS=true
compose: |
  services:
    app-service:
      image: budibase.docker.scarf.sh/budibase/apps
      restart: unless-stopped
      environment:
        - SELF_HOSTED=1
        - COUCH_DB_URL=http://$COUCHDB_USER:$COUCHDB_PASSWORD@couchdb-service:5984
        - WORKER_URL=http://worker-service:4003
        - MINIO_URL=http://minio-service:9000
        - MINIO_ACCESS_KEY=$MINIO_USER
        - MINIO_SECRET_KEY=$MINIO_PASSWORD
        - INTERNAL_API_KEY=$BUDIBASE_SECRET
        - BUDIBASE_ENVIRONMENT=${BUDIBASE_ENVIRONMENT:-PRODUCTION}
        - PORT=4002
        - API_ENCRYPTION_KEY=$BUDIBASEAPI_SECRET
        - ENCRYPTION_KEY=$BUDIBASE_SECRET_2
        - JWT_SECRET=$BUDIBASEJWT_SECRET
        - LOG_LEVEL=info
        - ENABLE_ANALYTICS=${ENABLE_ANALYTICS:-true}
        - REDIS_URL=redis-service:6379
        - REDIS_PASSWORD=$REDIS_PASSWORD
        - BB_ADMIN_USER_EMAIL=
        - BB_ADMIN_USER_PASSWORD=
      depends_on:
        - worker-service
        - redis-service
      healthcheck:
        test: [CMD, wget, --spider, -qO-, http://localhost:4002/health]
        interval: 15s
        timeout: 15s
        retries: 5
        start_period: 10s
    worker-service:
      image: budibase.docker.scarf.sh/budibase/worker
      restart: unless-stopped
      environment:
        - SELF_HOSTED=1
        - PORT=4003
        - CLUSTER_PORT=10000
        - API_ENCRYPTION_KEY=$BUDIBASEAPI_SECRET
        - JWT_SECRET=$BUDIBASEJWT_SECRET
        - MINIO_ACCESS_KEY=$MINIO_USER
        - MINIO_SECRET_KEY=$MINIO_PASSWORD
        - MINIO_URL=http://minio-service:9000
        - APPS_URL=http://app-service:4002
        - COUCH_DB_USERNAME=$COUCHDB_USER
        - COUCH_DB_PASSWORD=$COUCHDB_PASSWORD
        - COUCH_DB_URL=http://$COUCHDB_USER:$COUCHDB_PASSWORD@couchdb-service:5984
        - INTERNAL_API_KEY=$BUDIBASE_SECRET
        - REDIS_URL=redis-service:6379
        - REDIS_PASSWORD=$REDIS_PASSWORD
      depends_on:
        - redis-service
        - minio-service
      healthcheck:
        test: [CMD, wget, --spider, -qO-, http://localhost:4003/health]
        interval: 15s
        timeout: 15s
        retries: 5
        start_period: 10s
    minio-service:
      image: pgsty/silo:RELEASE.2026-10-15T00-00-00Z
      restart: unless-stopped
      volumes:
        - minio_data:/data
      environment:
        - MINIO_ROOT_USER=$MINIO_USER
        - MINIO_ROOT_PASSWORD=$MINIO_PASSWORD
        - MINIO_BROWSER=off
      command: server /data --console-address ":9001"
      healthcheck:
        test: [CMD, mc, ready, local]
        interval: 5s
        timeout: 20s
        retries: 10
    proxy-service:
      image: budibase/proxy
      restart: unless-stopped
      environment:
        - PROXY_RATE_LIMIT_WEBHOOKS_PER_SECOND=10
        - PROXY_RATE_LIMIT_API_PER_SECOND=20
        - APPS_UPSTREAM_URL=http://app-service:4002
        - WORKER_UPSTREAM_URL=http://worker-service:4003
        - MINIO_UPSTREAM_URL=http://minio-service:9000
        - COUCHDB_UPSTREAM_URL=http://couchdb-service:5984
        - RESOLVER=127.0.0.11
      depends_on:
        - minio-service
        - worker-service
        - app-service
        - couchdb-service
      healthcheck:
        test: [CMD, curl, -f, http://localhost:10000/]
        interval: 15s
        timeout: 15s
        retries: 5
        start_period: 10s
      ports:
        - ${PORT:-10000}:10000
    couchdb-service:
      image: budibase/database
      restart: unless-stopped
      environment:
        - COUCHDB_PASSWORD=$COUCHDB_PASSWORD
        - COUCHDB_USER=$COUCHDB_USER
        - TARGETBUILD=docker-compose
      healthcheck:
        test: [CMD, curl, -f, http://localhost:5984/]
        interval: 15s
        timeout: 15s
        retries: 5
        start_period: 10s
      volumes:
        - couchdb3_data:/data
    redis-service:
      image: redis
      restart: unless-stopped
      command: redis-server --requirepass "$REDIS_PASSWORD"
      volumes:
        - redis_data:/data
      healthcheck:
        test: [CMD, redis-cli, -a, $REDIS_PASSWORD, ping]
        interval: 15s
        timeout: 15s
        retries: 5
        start_period: 10s
  volumes:
    minio_data:
    couchdb3_data:
    redis_data:
