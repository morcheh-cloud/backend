# Converted from Coolify's service templates (Apache-2.0).
name: Databasus
category: Development
description: Databasus is a free, open source and self-hosted tool to backup PostgreSQL, MySQL, and MongoDB.
website: https://databasus.com/installation
tags:
  - postgres
  - mysql
  - mongo
  - backup
logo: templates/databasus.svg
env: PORT=4005
compose: |
  services:
    databasus:
      image: databasus/databasus:v3.16.2
      restart: unless-stopped
      volumes:
        - databasus-data:/databasus-data
      healthcheck:
        test: [CMD, wget, -qO-, http://localhost:4005/api/v1/system/health]
        interval: 5s
        timeout: 10s
        retries: 5
      ports:
        - ${PORT:-4005}:4005
  volumes:
    databasus-data:
