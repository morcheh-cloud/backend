# Converted from Coolify's service templates (Apache-2.0).
name: Forgejo
category: Git & CI
description: Forgejo is a self-hosted lightweight software forge. Easy to install and low maintenance, it just does the job.
website: https://forgejo.org/docs
tags:
  - version control
  - collaboration
  - code
  - hosting
  - lightweight
logo: templates/forgejo.svg
env: |-
  PORT=3000
  FORGEJO_URL=http://{{host}}:${PORT}
  FORGEJO_HOST={{host}}:${PORT}

  # Optional settings
  FORGEJO__migrations__ALLOWED_DOMAINS=
  FORGEJO__migrations__ALLOW_LOCALNETWORKS=false
  FORGEJO_SSH_PORT=22222
compose: |
  services:
    forgejo:
      image: codeberg.org/forgejo/forgejo:15
      restart: unless-stopped
      environment:
        - FORGEJO__server__ROOT_URL=${FORGEJO_URL}
        - FORGEJO__migrations__ALLOWED_DOMAINS=${FORGEJO__migrations__ALLOWED_DOMAINS}
        - FORGEJO__migrations__ALLOW_LOCALNETWORKS=${FORGEJO__migrations__ALLOW_LOCALNETWORKS-false}
        - FORGEJO__server__DOMAIN=${FORGEJO_HOST}
        - FORGEJO__server__SSH_DOMAIN=${FORGEJO_HOST}
        - FORGEJO__server__SSH_PORT=${FORGEJO_SSH_PORT:-22222}
        - USER_UID=1000
        - USER_GID=1000
      ports:
        - ${FORGEJO_SSH_PORT:-22222}:22
        - ${PORT:-3000}:3000
      volumes:
        - forgejo-data:/data
        - forgejo-timezone:/etc/timezone:ro
        - forgejo-localtime:/etc/localtime:ro
      healthcheck:
        test: [CMD, curl, -f, http://127.0.0.1:3000]
        interval: 2s
        timeout: 10s
        retries: 15
  volumes:
    forgejo-data:
    forgejo-timezone:
    forgejo-localtime:
