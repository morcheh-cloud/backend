# Converted from Coolify's service templates (Apache-2.0).
name: Directus with PostgreSQL
category: Websites
description: Directus wraps databases with a dynamic API, and provides an intuitive app for managing its content.
website: https://directus.io
tags:
  - directus
  - cms
  - database
  - sql
logo: templates/directus.svg
env: |-
  PORT=8055
  KEY_SECRET={{secret:64}}
  SECRET_SECRET={{secret:64}}
  ADMIN_PASSWORD={{secret}}
  POSTGRESQL_USER={{user}}
  POSTGRESQL_PASSWORD={{secret}}

  # Optional settings
  ADMIN_EMAIL=admin@example.com
  POSTGRESQL_DATABASE=directus
  CORS_ENABLED=true
  CORS_ORIGIN=
  CORS_METHODS=GET,POST,PATCH,DELETE,OPTIONS
  CORS_ALLOWED_HEADERS=Content-Type,Authorization
  CORS_CREDENTIALS=true
compose: |
  services:
    directus:
      image: directus/directus:11
      restart: unless-stopped
      volumes:
        - directus-uploads:/directus/uploads
        - directus-extensions:/directus/extensions
        - directus-templates:/directus/templates
      environment:
        - KEY=$KEY_SECRET
        - SECRET=$SECRET_SECRET
        - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
        - ADMIN_PASSWORD=$ADMIN_PASSWORD
        - DB_CLIENT=postgres
        - DB_HOST=postgresql
        - DB_PORT=5432
        - DB_DATABASE=${POSTGRESQL_DATABASE:-directus}
        - DB_USER=$POSTGRESQL_USER
        - DB_PASSWORD=$POSTGRESQL_PASSWORD
        - REDIS_HOST=redis
        - REDIS_PORT=6379
        - WEBSOCKETS_ENABLED=true
        - CORS_ENABLED=${CORS_ENABLED:-true}
        - CORS_ORIGIN=${CORS_ORIGIN}
        - CORS_METHODS=${CORS_METHODS:-GET,POST,PATCH,DELETE,OPTIONS}
        - CORS_ALLOWED_HEADERS=${CORS_ALLOWED_HEADERS:-Content-Type,Authorization}
        - CORS_CREDENTIALS=${CORS_CREDENTIALS:-true}
      healthcheck:
        test: [CMD, wget, -q, --spider, http://127.0.0.1:8055/admin/login]
        interval: 5s
        timeout: 20s
        retries: 10
      depends_on:
        postgresql:
          condition: service_healthy
        redis:
          condition: service_healthy
      ports:
        - ${PORT:-8055}:8055
    postgresql:
      image: postgis/postgis:16-3.4-alpine
      restart: unless-stopped
      platform: linux/amd64
      volumes:
        - directus-postgresql-data:/var/lib/postgresql/data
      environment:
        - POSTGRES_USER=${POSTGRESQL_USER}
        - POSTGRES_PASSWORD=${POSTGRESQL_PASSWORD}
        - POSTGRES_DB=${POSTGRESQL_DATABASE:-directus}
      healthcheck:
        test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 20s
        retries: 10
    redis:
      image: redis:7-alpine
      restart: unless-stopped
      command: redis-server --appendonly yes
      volumes:
        - directus-redis-data:/data
      healthcheck:
        test: [CMD, redis-cli, ping]
        interval: 5s
        timeout: 20s
        retries: 10
  volumes:
    directus-uploads:
    directus-extensions:
    directus-templates:
    directus-postgresql-data:
    directus-redis-data:
