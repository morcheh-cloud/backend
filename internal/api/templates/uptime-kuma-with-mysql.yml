# Converted from Coolify's service templates (Apache-2.0).
name: Uptime Kuma with MySQL
category: Monitoring
description: Uptime Kuma is a monitoring tool for tracking the status and performance of your applications in real-time.
website: https://github.com/louislam/uptime-kuma?tab=readme-ov-file
tags:
  - monitoring
  - status
  - performance
  - web
  - services
  - applications
  - real-time
logo: templates/uptime-kuma.svg
env: |-
  PORT=3001
  MYSQL_USER={{user}}
  MYSQL_PASSWORD={{secret}}
  ROOT_PASSWORD={{secret}}

  # Optional settings
  TZ=Etc/UTC
  MYSQL_DATABASE=uptime-kuma-db
compose: |
  services:
    uptime-kuma:
      image: louislam/uptime-kuma:2
      restart: unless-stopped
      environment:
        - TZ=${TZ:-Etc/UTC}
      volumes:
        - uptime-kuma-data:/app/data
      healthcheck:
        test: [CMD-SHELL, extra/healthcheck]
        interval: 5s
        timeout: 5s
        retries: 10
      depends_on:
        mysql:
          condition: service_healthy
      ports:
        - ${PORT:-3001}:3001
    mysql:
      image: mysql:8
      restart: unless-stopped
      environment:
        - MYSQL_USER=${MYSQL_USER}
        - MYSQL_PASSWORD=${MYSQL_PASSWORD}
        - MYSQL_ROOT_PASSWORD=${ROOT_PASSWORD}
        - MYSQL_DATABASE=${MYSQL_DATABASE:-uptime-kuma-db}
      healthcheck:
        test: [CMD, mysqladmin, ping, -h, 127.0.0.1]
        interval: 5s
        timeout: 20s
        retries: 10
      volumes:
        - mysql-data:/var/lib/mysql
  volumes:
    uptime-kuma-data:
    mysql-data:
