# Converted from Coolify's service templates (Apache-2.0).
name: Apprise API
category: Automation
description: Push Notifications API
website: https://docs.linuxserver.io/images/docker-apprise-api/
tags:
  - api
  - apprise
logo: templates/apprise.webp
env: PORT=8000
compose: |
  services:
    apprise-api:
      image: linuxserver/apprise-api:latest
      restart: unless-stopped
      environment:
        - PUID=1000
        - PGID=1000
        - TZ=UTC
      volumes:
        - /apprise-api/config:/config
      healthcheck:
        test: [CMD-SHELL, wget -qO- http://127.0.0.1:8000/]
        interval: 5s
        timeout: 20s
        retries: 10
      ports:
        - ${PORT:-8000}:8000
