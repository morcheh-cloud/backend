# Converted from Coolify's service templates (Apache-2.0).
name: AFFiNE
category: Productivity
description: Affine is an open-source, all-in-one workspace and OS for knowledge management, a Notion/Miro alternative.
website: https://docs.affine.pro/docs/self-host-affine
tags:
  - knowledge-management
  - notion
  - miro
  - workspace
logo: templates/affine.svg
env: |-
  PORT=3010
  POSTGRES_USER={{user}}
  POSTGRES_PASSWORD={{secret}}
  AFFINE_URL=http://{{host}}:${PORT}

  # Optional settings
  POSTGRES_DB=affine
  MAILER_HOST=
  MAILER_PORT=
  MAILER_USER=
  MAILER_PASSWORD=
  MAILER_SENDER=
  COPILOT_FAL_API_KEY=
  COPILOT_PERPLEXITY_API_KEY=
  COPILOT_OPENAI_API_KEY=
  AFFINE_REVISION=stable
compose: |
  services:
    affine:
      image: ghcr.io/toeverything/affine:stable
      restart: unless-stopped
      depends_on:
        redis:
          condition: service_healthy
        postgres:
          condition: service_healthy
      volumes:
        - affine-config:/root/.affine/config
        - affine-storage:/root/.affine/storage
      logging:
        driver: json-file
        options:
          max-size: 1000m
      environment:
        - AFFINE_CONFIG_PATH=/root/.affine/config
        - REDIS_SERVER_HOST=redis
        - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-affine}
        - NODE_ENV=production
        - AFFINE_SERVER_HOST=$AFFINE_URL
        - AFFINE_SERVER_EXTERNAL_URL=$AFFINE_URL
        - MAILER_HOST=${MAILER_HOST}
        - MAILER_PORT=${MAILER_PORT}
        - MAILER_USER=${MAILER_USER}
        - MAILER_PASSWORD=${MAILER_PASSWORD}
        - MAILER_SENDER=${MAILER_SENDER}
        - COPILOT_FAL_API_KEY=${COPILOT_FAL_API_KEY}
        - COPILOT_PERPLEXITY_API_KEY=${COPILOT_PERPLEXITY_API_KEY}
        - COPILOT_OPENAI_API_KEY=${COPILOT_OPENAI_API_KEY}
      healthcheck:
        test: [CMD-SHELL, "bash -c ':> /dev/tcp/127.0.0.1/3010' || exit 1"]
        interval: 5s
        timeout: 20s
        retries: 3
      ports:
        - ${PORT:-3010}:3010
    affine_migration:
      image: ghcr.io/toeverything/affine:${AFFINE_REVISION:-stable}
      restart: on-failure
      volumes:
        - affine-storage:/root/.affine/storage
        - affine-config:/root/.affine/config
      command: [sh, -c, node ./scripts/self-host-predeploy.js]
      environment:
        - REDIS_SERVER_HOST=redis
        - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-affine}
        - AFFINE_INDEXER_ENABLED=false
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
    redis:
      image: redis
      restart: unless-stopped
      volumes:
        - affine-redis-data:/data
      healthcheck:
        test: [CMD, redis-cli, --raw, incr, ping]
        interval: 10s
        timeout: 5s
        retries: 5
    postgres:
      image: pgvector/pgvector:pg16
      restart: unless-stopped
      volumes:
        - affine-postgres-data:/var/lib/postgresql/data
      environment:
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DB:-affine}
        - PGDATA=/var/lib/postgresql/data/pgdata
      healthcheck:
        test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 20s
        retries: 10
  volumes:
    affine-config:
    affine-storage:
    affine-redis-data:
    affine-postgres-data:
