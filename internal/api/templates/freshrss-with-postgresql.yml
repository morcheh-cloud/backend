# Converted from Coolify's service templates (Apache-2.0).
name: FreshRSS with PostgreSQL
category: News & RSS
description: A free, self-hostable feed aggregator.
website: https://freshrss.org/index.html
tags:
  - rss
  - feed
logo: templates/freshrss.webp
env: |-
  PORT=8080
  POSTGRESQL_USER={{user}}
  POSTGRESQL_PASSWORD={{secret}}

  # Optional settings
  CRON_MIN=1,31
  POSTGRESQL_DATABASE=freshrss
compose: |
  services:
    freshrss:
      image: freshrss/freshrss:latest
      restart: unless-stopped
      environment:
        - CRON_MIN=${CRON_MIN:-1,31}
        - POSTGRES_DB=${POSTGRESQL_DATABASE:-freshrss}
        - POSTGRES_USER=${POSTGRESQL_USER}
        - POSTGRES_PASSWORD=${POSTGRESQL_PASSWORD}
        - POSTGRES_HOST=freshrss-db
      volumes:
        - freshrss-data:/var/www/FreshRSS/data
        - freshrss-extensions:/var/www/FreshRSS/extensions
      depends_on:
        freshrss-db:
          condition: service_healthy
      healthcheck:
        test: [CMD-SHELL, "bash -c ':> /dev/tcp/127.0.0.1/80' || exit 1"]
        interval: 5s
        timeout: 20s
        retries: 3
      ports:
        - ${PORT:-8080}:80
    freshrss-db:
      image: postgres:16
      restart: unless-stopped
      volumes:
        - freshrss-postgresql-data:/var/lib/postgresql/data
      environment:
        - POSTGRES_USER=${POSTGRESQL_USER}
        - POSTGRES_PASSWORD=${POSTGRESQL_PASSWORD}
        - POSTGRES_DB=${POSTGRESQL_DATABASE:-freshrss}
      healthcheck:
        test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 20s
        retries: 10
  volumes:
    freshrss-data:
    freshrss-extensions:
    freshrss-postgresql-data:
