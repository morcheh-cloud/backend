# Converted from Coolify's service templates (Apache-2.0).
name: Qdrant
category: Databases
description: Qdrant is a vector similarity search engine that provides a production-ready service with a convenient API to store, search, and manage points (i.e. vectors) with an additional payload.
website: https://qdrant.tech/documentation/
tags:
  - ai
  - vector-database
  - semantic-search
  - machine-learning
  - bm25
  - embeddings
  - llm
logo: templates/qdrant.webp
env: |-
  PORT=6333
  QDRANTAPIKEY_PASSWORD={{secret}}
compose: |
  services:
    qdrant:
      image: qdrant/qdrant:latest
      restart: unless-stopped
      environment:
        - QDRANT__SERVICE__API_KEY=${QDRANTAPIKEY_PASSWORD}
      volumes:
        - qdrant-storage:/qdrant/storage
      healthcheck:
        test: [CMD-SHELL, "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
        interval: 5s
        timeout: 5s
        retries: 3
      ports:
        - ${PORT:-6333}:6333
  volumes:
    qdrant-storage:
