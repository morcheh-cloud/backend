# Converted from Coolify's service templates (Apache-2.0).
name: Newt (Pangolin)
category: Networking
description: Pangolin tunnels your services to the internet so you can access anything from anywhere.
website: https://docs.digpangolin.com/manage/sites/install-site
tags:
  - wireguard
  - reverse-proxy
  - zero-trust-network-access
  - open source
logo: templates/pangolin-logo.webp
env: |-
  # Fill these in before starting
  NEWT_ID=
  NEWT_SECRET=

  # Optional settings
  PANGOLIN_ENDPOINT=https://pangolin.domain.tld
compose: |
  services:
    newt:
      image: fosrl/newt:latest
      restart: unless-stopped
      environment:
        - PANGOLIN_ENDPOINT=${PANGOLIN_ENDPOINT:-https://pangolin.domain.tld}
        - NEWT_ID=${NEWT_ID:?}
        - NEWT_SECRET=${NEWT_SECRET:?}
      healthcheck:
        test: [CMD, newt, --version]
        interval: 5s
        timeout: 20s
        retries: 10
