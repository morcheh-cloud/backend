# Converted from Coolify's service templates (Apache-2.0).
name: OpenWA with PostgreSQL and Redis
category: Communication
description: Production OpenWA with PostgreSQL, Redis, and bundled dashboard.
website: https://github.com/rmyndharis/OpenWA
tags:
  - whatsapp
  - api
  - gateway
  - messaging
  - automation
  - webhooks
  - postgresql
  - redis
logo: templates/openwa.webp
env: |-
  PORT=2785
  OPENWA_URL=http://{{host}}:${PORT}
  OPENWA_PASSWORD={{secret}}
  POSTGRES_USER={{user}}
  POSTGRES_PASSWORD={{secret}}

  # Optional settings
  OPENWA_PIDS_LIMIT=2048
  OPENWA_MEM_LIMIT=2g
  LOG_LEVEL=info
  POSTGRES_DB=openwa
  ENGINE_TYPE=whatsapp-web.js
  AUTO_START_SESSIONS=false
compose: |
  services:
    openwa:
      image: ghcr.io/rmyndharis/openwa:0.23.1
      restart: unless-stopped
      stop_grace_period: 45s
      security_opt:
        - no-new-privileges:true
      cap_drop:
        - ALL
      cap_add:
        - CHOWN
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
      read_only: true
      tmpfs:
        - /tmp
      pids_limit: ${OPENWA_PIDS_LIMIT:-2048}
      mem_limit: ${OPENWA_MEM_LIMIT:-2g}
      environment:
        - NODE_ENV=production
        - HOME=/tmp
        - XDG_CONFIG_HOME=/tmp/.config
        - XDG_CACHE_HOME=/tmp/.cache
        - PORT=2785
        - LOG_LEVEL=${LOG_LEVEL:-info}
        - BASE_URL=${OPENWA_URL}
        - DASHBOARD_URL=${OPENWA_URL}
        - API_MASTER_KEY=${OPENWA_PASSWORD}
        - DATABASE_TYPE=postgres
        - DATABASE_HOST=postgresql
        - DATABASE_PORT=5432
        - DATABASE_USERNAME=$POSTGRES_USER
        - DATABASE_PASSWORD=$POSTGRES_PASSWORD
        - DATABASE_NAME=${POSTGRES_DB:-openwa}
        - DATABASE_SYNCHRONIZE=false
        - POSTGRES_SCHEMA=public
        - ENGINE_TYPE=${ENGINE_TYPE:-whatsapp-web.js}
        - SESSION_DATA_PATH=./data/sessions
        - PUPPETEER_HEADLESS=true
        - PUPPETEER_ARGS=--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage
        - PUPPETEER_EXECUTABLE_PATH=/usr/local/bin/puppeteer-chrome
        - STORAGE_TYPE=local
        - STORAGE_LOCAL_PATH=./data/media
        - REDIS_ENABLED=true
        - REDIS_HOST=openwa-redis
        - REDIS_PORT=6379
        - QUEUE_ENABLED=true
        - CACHE_ENABLED=true
        - AUTO_START_SESSIONS=${AUTO_START_SESSIONS:-false}
      volumes:
        - openwa-data:/app/data
      depends_on:
        postgresql:
          condition: service_healthy
        openwa-redis:
          condition: service_healthy
      healthcheck:
        test: [CMD, node, -e, "require('http').get('http://localhost:2785/api/health/ready', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 45s
      ports:
        - ${PORT:-2785}:2785
    postgresql:
      image: postgres:16-alpine
      restart: unless-stopped
      security_opt:
        - no-new-privileges:true
      environment:
        - POSTGRES_USER=$POSTGRES_USER
        - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
        - POSTGRES_DB=${POSTGRES_DB:-openwa}
      volumes:
        - postgresql-data:/var/lib/postgresql/data
      healthcheck:
        test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 3s
        retries: 5
    openwa-redis:
      image: redis:7-alpine
      restart: unless-stopped
      security_opt:
        - no-new-privileges:true
      command: redis-server --appendonly yes --maxmemory-policy noeviction
      volumes:
        - redis-data:/data
      healthcheck:
        test: [CMD, redis-cli, ping]
        interval: 5s
        timeout: 3s
        retries: 5
  volumes:
    openwa-data:
    postgresql-data:
    redis-data:
