# Converted from Coolify's service templates (Apache-2.0).
name: InfluxDB
category: Databases
description: Open source time series database for metrics, events, and analytics.
website: https://docs.influxdata.com/influxdb/
tags:
  - influxdb
  - time series
  - metrics
  - iot
  - monitoring
  - telegraf
env: |-
  PORT=8086
  INFLUXDB_USER={{user}}
  INFLUXDB_PASSWORD={{secret}}
  INFLUXDB_TOKEN_PASSWORD={{secret}}

  # Optional settings
  SERVICE_ORG_INFLUXDB=
  SERVICE_BUCKET_INFLUXDB=
compose: |
  services:
    influxdb:
      image: influxdb:2.7-alpine
      restart: unless-stopped
      environment:
        - INFLUXDB_HTTP_BIND_ADDRESS=:8086
        - INFLUXDB_INIT_MODE=setup
        - INFLUXDB_INIT_USERNAME=$INFLUXDB_USER
        - INFLUXDB_INIT_PASSWORD=$INFLUXDB_PASSWORD
        - INFLUXDB_INIT_ORG=$SERVICE_ORG_INFLUXDB
        - INFLUXDB_INIT_BUCKET=$SERVICE_BUCKET_INFLUXDB
        - INFLUXDB_INIT_RETENTION=0
        - INFLUXDB_INIT_ADMIN_TOKEN=$INFLUXDB_TOKEN_PASSWORD
      volumes:
        - influxdb-data:/var/lib/influxdb2
        - influxdb-config:/etc/influxdb2
      healthcheck:
        test: [CMD, influx, ping, --host, http://127.0.0.1:8086]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 20s
      ports:
        - ${PORT:-8086}:8086
  volumes:
    influxdb-data:
    influxdb-config:
