# Converted from Coolify's service templates (Apache-2.0).
name: Redmine
category: Productivity
description: Redmine is a flexible project management web application.
website: https://www.redmine.org/
tags:
  - redmine
  - project management
logo: templates/redmine.svg
env: |-
  PORT=3000
  REDMINE_PASSWORD={{secret:64}}
  POSTGRES_USER={{user}}
  POSTGRES_PASSWORD={{secret:64}}

  # Optional settings
  POSTGRES_DATABASE=redmine-db
compose: |
  services:
    redmine:
      image: redmine:6-alpine
      restart: unless-stopped
      environment:
        - SECRET_KEY_BASE=${REDMINE_PASSWORD}
        - REDMINE_DB_POSTGRES=postgresql
        - REDMINE_DB_PORT=5432
        - REDMINE_DB_USERNAME=${POSTGRES_USER}
        - REDMINE_DB_PASSWORD=${POSTGRES_PASSWORD}
        - REDMINE_DB_DATABASE=${POSTGRES_DATABASE:-redmine-db}
      healthcheck:
        test: [CMD-SHELL, wget -qO- http://127.0.0.1:3000/]
        interval: 5s
        timeout: 5s
        retries: 5
      volumes:
        - redmine-config:/usr/src/redmine/config
        - redmine-files:/usr/src/redmine/files
        - redmine-themes:/usr/src/redmine/themes
        - redmine-plugins:/usr/src/redmine/plugins
      depends_on:
        postgresql:
          condition: service_healthy
      ports:
        - ${PORT:-3000}:3000
    postgresql:
      image: postgres:17-alpine
      restart: unless-stopped
      environment:
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DATABASE:-redmine-db}
      volumes:
        - postgresql-data:/var/lib/postgresql/data
      healthcheck:
        test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 5s
        retries: 5
  volumes:
    redmine-config:
    redmine-files:
    redmine-themes:
    redmine-plugins:
    postgresql-data:
