# Converted from Coolify's service templates (Apache-2.0).
name: FreeScout
category: Support
description: FreeScout is the super lightweight and powerful free open source help desk and shared inbox written in PHP (Laravel framework).
website: https://github.com/freescout-help-desk/freescout/wiki/
tags:
  - helpdesk
  - support
  - ticketing
  - customer-support
logo: templates/freescout.webp
env: |-
  PORT=8080
  MARIADB_USER={{user}}
  MARIADB_PASSWORD={{secret}}
  FREESCOUT_URL=http://{{host}}:${PORT}
  ADMIN_PASSWORD={{secret}}
  ROOT_PASSWORD={{secret}}

  # Optional settings
  MARIADB_DATABASE=freescout
  ADMIN_EMAIL=admin@example.com
  FREESCOUT_APP_DEBUG=false
  TIMEZONE=UTC
compose: |
  services:
    freescout:
      image: nfrastack/freescout:2.2.21
      restart: unless-stopped
      volumes:
        - freescout-data:/data
        - freescout-logs:/logs
      depends_on:
        mariadb:
          condition: service_healthy
      environment:
        - DB_TYPE=mariadb
        - DB_HOST=mariadb
        - DB_PORT=3306
        - DB_NAME=${MARIADB_DATABASE:-freescout}
        - DB_USER=${MARIADB_USER:-freescout}
        - DB_PASS=${MARIADB_PASSWORD}
        - APP_URL=${FREESCOUT_URL}
        - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
        - ADMIN_PASS=${ADMIN_PASSWORD}
        - FREESCOUT_APP_DEBUG=${FREESCOUT_APP_DEBUG:-false}
        - TIMEZONE=${TIMEZONE:-UTC}
      healthcheck:
        test: [CMD-SHELL, "busybox wget -qO /dev/null --header 'X-Forwarded-Proto: https' http://127.0.0.1/login || exit 1"]
        start_period: 60s
        interval: 5s
        timeout: 10s
        retries: 15
      ports:
        - ${PORT:-8080}:80
    mariadb:
      image: mariadb
      restart: unless-stopped
      volumes:
        - mariadb-data:/var/lib/mysql
      environment:
        - MARIADB_ROOT_PASSWORD=${ROOT_PASSWORD}
        - MARIADB_DATABASE=${MARIADB_DATABASE:-freescout}
        - MARIADB_USER=${MARIADB_USER}
        - MARIADB_PASSWORD=${MARIADB_PASSWORD}
      healthcheck:
        test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
        start_period: 10s
        interval: 5s
        timeout: 10s
        retries: 15
  volumes:
    freescout-data:
    freescout-logs:
    mariadb-data:
