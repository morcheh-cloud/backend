# Converted from Coolify's service templates (Apache-2.0).
name: Rallly
category: Productivity
description: Rallly is an open-source scheduling and collaboration tool designed to make organizing events and meetings easier.
website: https://support.rallly.co/self-hosting/introduction
tags:
  - scheduling
  - rallly
  - events
  - meeting
  - doodle
logo: templates/rallly.svg
env: |-
  PORT=3000
  POSTGRES_PASSWORD={{secret}}
  POSTGRES_USER={{user}}
  RALLLY_PASSWORD={{secret:64}}
  RALLLY_URL=http://{{host}}:${PORT}

  # Fill these in before starting
  INITIAL_ADMIN_EMAIL=
  SUPPORT_EMAIL=

  # Optional settings
  POSTGRES_DB=rallly
  REGISTRATION_ENABLED=true
  ALLOWED_EMAILS=
  SMTP_HOST=
  SMTP_PORT=
  SMTP_SECURE=false
  SMTP_USER=
  SMTP_PWD=
  SMTP_TLS_ENABLED=false
compose: |
  services:
    rallly_db:
      image: postgres:18
      restart: unless-stopped
      volumes:
        - postgres-data:/var/lib/postgresql
      environment:
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_DB=${POSTGRES_DB:-rallly}
      healthcheck:
        test: [CMD-SHELL, "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
        interval: 2s
        timeout: 10s
        retries: 15
    rallly:
      image: lukevella/rallly:latest
      restart: unless-stopped
      platform: linux/amd64
      environment:
        - PROXY_MODE=external
        - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@rallly_db:5432/${POSTGRES_DB:-rallly}
        - SECRET_PASSWORD=${RALLLY_PASSWORD}
        - NEXT_PUBLIC_BASE_URL=${RALLLY_URL}
        - REGISTRATION_ENABLED=${REGISTRATION_ENABLED:-true}
        - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:?}
        - ALLOWED_EMAILS=${ALLOWED_EMAILS}
        - SUPPORT_EMAIL=${SUPPORT_EMAIL:?}
        - SMTP_HOST=${SMTP_HOST}
        - SMTP_PORT=${SMTP_PORT}
        - SMTP_SECURE=${SMTP_SECURE:-false}
        - SMTP_USER=${SMTP_USER}
        - SMTP_PWD=${SMTP_PWD}
        - SMTP_TLS_ENABLED=${SMTP_TLS_ENABLED:-false}
        - BETTER_AUTH_TRUSTED_ORIGINS=${RALLLY_URL}
      healthcheck:
        test: [CMD-SHELL, "bash -c ':> /dev/tcp/127.0.0.1/3000' || exit 1"]
        interval: 5s
        timeout: 20s
        retries: 10
      depends_on:
        rallly_db:
          condition: service_healthy
      ports:
        - ${PORT:-3000}:3000
  volumes:
    postgres-data:
