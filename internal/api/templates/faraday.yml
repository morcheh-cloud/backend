# Converted from Coolify's service templates (Apache-2.0).
name: Faraday
category: Security
description: Faraday is a powerful, open-source, web-based vulnerability management tool.
website: https://faradaysec.com/
tags:
  - vulnerability
  - management
  - tool
logo: templates/faraday.webp
env: |-
  PORT=5985
  POSTGRESQL_PASSWORD={{secret}}
  POSTGRESQL_USER={{user}}

  # Optional settings
  POSTGRES_DB=faraday
compose: |
  services:
    postgresql:
      image: postgres:latest
      restart: unless-stopped
      volumes:
        - faraday-db:/var/lib/postgresql/data
      environment:
        - POSTGRES_PASSWORD=${POSTGRESQL_PASSWORD}
        - POSTGRES_USER=${POSTGRESQL_USER}
        - POSTGRES_DB=${POSTGRES_DB:-faraday}
      healthcheck:
        test: [CMD-SHELL, "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
        interval: 15s
        timeout: 10s
        retries: 15
    redis:
      image: redis:alpine
      restart: unless-stopped
      command: --save 60 1 --loglevel warning
      volumes:
        - redis:/data
      healthcheck:
        test: [CMD-SHELL, "redis-cli ping | grep PONG"]
        interval: 15s
        timeout: 10s
        retries: 15
    faraday:
      image: faradaysec/faraday:latest
      restart: unless-stopped
      entrypoint: /entrypoint.sh
      environment:
        - AUTHENTIK_POSTGRESQL__PASSWORD=${POSTGRESQL_PASSWORD}
        - PGSQL_USER=${POSTGRESQL_USER}
        - PGSQL_PASSWD=${POSTGRESQL_PASSWORD}
        - PGSQL_DBNAME=${POSTGRES_DB}
        - PGSQL_HOST=postgresql
        - REDIS_SERVER=redis
      volumes:
        - faraday:/home/faraday/.faraday:rw
      depends_on:
        postgresql:
          condition: service_healthy
        redis:
          condition: service_healthy
      healthcheck:
        test: [CMD, nc, -z, localhost, "5985"]
        interval: 30s
        timeout: 10s
        retries: 3
      ports:
        - ${PORT:-5985}:5985
  volumes:
    faraday-db:
    redis:
    faraday:
