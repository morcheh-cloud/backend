# Converted from Coolify's service templates (Apache-2.0).
name: Hi.Events
category: Productivity
description: Open-source event management and ticketing platform.
website: https://hi.events/docs
tags:
  - events
  - ticketing
  - tickets
  - booking
  - conferences
  - concerts
  - event-management
  - eventbrite
logo: templates/hi-events.svg
env: |-
  PORT=8080
  HIEVENTS_URL=http://{{host}}:${PORT}
  APPKEY_KEY={{base64:32}}
  JWTSECRET_KEY={{base64:32}}
  POSTGRES_USER={{user}}
  POSTGRES_PASSWORD={{secret}}
  REDIS_PASSWORD={{secret}}

  # Optional settings
  VITE_APP_NAME=Hi.Events
  STRIPE_PUBLIC_KEY=
  APP_DISABLE_REGISTRATION=false
  APP_SAAS_MODE_ENABLED=false
  APP_SAAS_STRIPE_APPLICATION_FEE_PERCENT=0
  APP_SAAS_STRIPE_APPLICATION_FEE_FIXED=0
  APP_EMAIL_LOGO_URL=
  APP_EMAIL_LOGO_LINK_URL=
  POSTGRES_DB=hi-events
  MAIL_MAILER=log
  MAIL_HOST=
  MAIL_PORT=587
  MAIL_USERNAME=
  MAIL_PASSWORD=
  MAIL_ENCRYPTION=tls
  MAIL_FROM_ADDRESS=noreply@example.com
  MAIL_FROM_NAME=Hi.Events
  STRIPE_SECRET_KEY=
  STRIPE_WEBHOOK_SECRET=
compose: |
  services:
    hi-events:
      image: daveearley/hi.events-all-in-one:v2.0.0
      restart: unless-stopped
      environment:
        - VITE_APP_NAME=${VITE_APP_NAME:-Hi.Events}
        - VITE_FRONTEND_URL=${HIEVENTS_URL}
        - VITE_API_URL_CLIENT=${HIEVENTS_URL}/api
        - VITE_API_URL_SERVER=http://localhost:80/api
        - VITE_STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLIC_KEY}
        - APP_KEY=base64:${APPKEY_KEY}
        - JWT_SECRET=${JWTSECRET_KEY}
        - APP_FRONTEND_URL=${HIEVENTS_URL}
        - APP_CDN_URL=${HIEVENTS_URL}/storage
        - APP_DISABLE_REGISTRATION=${APP_DISABLE_REGISTRATION:-false}
        - APP_SAAS_MODE_ENABLED=${APP_SAAS_MODE_ENABLED:-false}
        - APP_SAAS_STRIPE_APPLICATION_FEE_PERCENT=${APP_SAAS_STRIPE_APPLICATION_FEE_PERCENT:-0}
        - APP_SAAS_STRIPE_APPLICATION_FEE_FIXED=${APP_SAAS_STRIPE_APPLICATION_FEE_FIXED:-0}
        - APP_EMAIL_LOGO_URL=${APP_EMAIL_LOGO_URL}
        - APP_EMAIL_LOGO_LINK_URL=${APP_EMAIL_LOGO_LINK_URL}
        - LOG_CHANNEL=stderr
        - QUEUE_CONNECTION=redis
        - DB_CONNECTION=pgsql
        - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hi-events}
        - REDIS_HOST=redis
        - REDIS_PASSWORD=${REDIS_PASSWORD}
        - REDIS_PORT=6379
        - MAIL_MAILER=${MAIL_MAILER:-log}
        - MAIL_HOST=${MAIL_HOST}
        - MAIL_PORT=${MAIL_PORT:-587}
        - MAIL_USERNAME=${MAIL_USERNAME}
        - MAIL_PASSWORD=${MAIL_PASSWORD}
        - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
        - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-noreply@example.com}
        - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Hi.Events}
        - FILESYSTEM_PUBLIC_DISK=public
        - FILESYSTEM_PRIVATE_DISK=local
        - STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY}
        - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
        - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
        - WEBHOOK_QUEUE_NAME=webhook-queue
      volumes:
        - hi-events-storage:/app/backend/storage/app
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
      healthcheck:
        test: [CMD, curl, -fsS, -o, /dev/null, http://127.0.0.1:80/]
        interval: 10s
        timeout: 10s
        retries: 10
        start_period: 30s
      ports:
        - ${PORT:-8080}:80
    postgres:
      image: postgres:17-alpine
      restart: unless-stopped
      environment:
        - POSTGRES_DB=${POSTGRES_DB:-hi-events}
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      volumes:
        - hi-events-postgres-data:/var/lib/postgresql/data
      healthcheck:
        test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 20s
        retries: 10
    redis:
      image: redis:7-alpine
      restart: unless-stopped
      command: redis-server --requirepass ${REDIS_PASSWORD}
      environment:
        - REDIS_PASSWORD=${REDIS_PASSWORD}
      volumes:
        - hi-events-redis-data:/data
      healthcheck:
        test: [CMD-SHELL, "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
        interval: 5s
        timeout: 10s
        retries: 10
  volumes:
    hi-events-storage:
    hi-events-postgres-data:
    hi-events-redis-data:
