# Converted from Coolify's service templates (Apache-2.0).
name: Swetrix
category: Analytics
description: Privacy-friendly and cookieless European web analytics alternative to Google Analytics.
website: https://docs.swetrix.com/selfhosting/how-to
tags:
  - analytics
  - privacy
  - monitoring
  - open-source
  - clickhouse
  - redis
logo: templates/swetrix.webp
env: |-
  SWETRIX_PORT=3000
  SWETRIXAPI_PORT=8080
  SWETRIXAPI_URL=http://{{host}}:${SWETRIXAPI_PORT}
  SECRETKEYBASE_SECRET={{secret:64}}
  CLICKHOUSE_PASSWORD={{secret}}
  REDIS_PASSWORD={{secret}}

  # Optional settings
  DISABLE_REGISTRATION=false
  IP_GEOLOCATION_DB_PATH=
  DEBUG_MODE=false
  CLOUDFLARE_PROXY_ENABLED=false
  SMTP_HOST=
  SMTP_PORT=
  SMTP_USER=
  SMTP_PASSWORD=
  FROM_EMAIL=
  SMTP_MOCK=false
  OIDC_ENABLED=false
  OIDC_ONLY_AUTH=false
  OIDC_DISCOVERY_URL=
  OIDC_CLIENT_ID=
  OIDC_CLIENT_SECRET=
  REDIS_PORT=6379
  REDIS_USER=default
  CLICKHOUSE_DATABASE=analytics
  CLICKHOUSE_USER=default
  CLICKHOUSE_PORT=8123
compose: |
  services:
    swetrix:
      image: swetrix/swetrix-fe:v4.0.5
      restart: unless-stopped
      depends_on:
        - swetrix-api
      environment:
        - API_URL=$SWETRIXAPI_URL
      healthcheck:
        test: [CMD-SHELL, "wget --no-verbose --tries=1 --spider http://localhost:3000/ping || exit 1"]
        timeout: 5s
        retries: 10
        interval: 30s
        start_period: 15s
      ports:
        - ${SWETRIX_PORT:-3000}:3000
    swetrix-api:
      image: swetrix/swetrix-api:v4.0.5
      restart: unless-stopped
      environment:
        - SECRET_KEY_BASE=$SECRETKEYBASE_SECRET
        - DISABLE_REGISTRATION=${DISABLE_REGISTRATION:-false}
        - IP_GEOLOCATION_DB_PATH=${IP_GEOLOCATION_DB_PATH:-}
        - DEBUG_MODE=${DEBUG_MODE:-false}
        - CLOUDFLARE_PROXY_ENABLED=${CLOUDFLARE_PROXY_ENABLED:-false}
        - SMTP_HOST=${SMTP_HOST:-}
        - SMTP_PORT=${SMTP_PORT:-}
        - SMTP_USER=${SMTP_USER:-}
        - SMTP_PASSWORD=${SMTP_PASSWORD:-}
        - FROM_EMAIL=${FROM_EMAIL:-}
        - SMTP_MOCK=${SMTP_MOCK:-false}
        - OIDC_ENABLED=${OIDC_ENABLED:-false}
        - OIDC_ONLY_AUTH=${OIDC_ONLY_AUTH:-false}
        - OIDC_DISCOVERY_URL=${OIDC_DISCOVERY_URL:-}
        - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
        - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
        - REDIS_HOST=redis
        - CLICKHOUSE_HOST=http://clickhouse
        - CLICKHOUSE_PASSWORD=$CLICKHOUSE_PASSWORD
        - REDIS_PASSWORD=$REDIS_PASSWORD
      depends_on:
        redis:
          condition: service_healthy
        clickhouse:
          condition: service_healthy
      healthcheck:
        test: [CMD-SHELL, "wget --no-verbose --tries=1 --spider http://localhost:5005/ping || exit 1"]
        timeout: 5s
        retries: 10
        interval: 30s
        start_period: 15s
      ports:
        - ${SWETRIXAPI_PORT:-8080}:80
    redis:
      image: redis:8.2-alpine
      restart: unless-stopped
      environment:
        - REDIS_PORT=${REDIS_PORT:-6379}
        - REDIS_USER=${REDIS_USER:-default}
        - REDIS_PASSWORD=$REDIS_PASSWORD
      healthcheck:
        test: [CMD-SHELL, "redis-cli ping | grep PONG"]
        timeout: 5s
        retries: 10
        interval: 30s
        start_period: 1m
    clickhouse:
      image: clickhouse/clickhouse-server:24.10-alpine
      restart: unless-stopped
      environment:
        - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-analytics}
        - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
        - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-8123}
        - CLICKHOUSE_PASSWORD=$CLICKHOUSE_PASSWORD
      healthcheck:
        test: [CMD-SHELL, "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1"]
        timeout: 5s
        retries: 10
        interval: 30s
        start_period: 1m
      cap_add:
        - SYS_NICE
      volumes:
        - swetrix-events-data:/var/lib/clickhouse
      ulimits:
        nofile:
          soft: 262144
          hard: 262144
      configs:
        - source: clickhouse-disable-user-logging.xml
          target: /etc/clickhouse-server/users.d/disable-user-logging.xml
        - source: clickhouse-reduce-logs.xml
          target: /etc/clickhouse-server/config.d/reduce-logs.xml
        - source: clickhouse-preserve-ram-config.xml
          target: /etc/clickhouse-server/config.d/preserve-ram-config.xml
        - source: clickhouse-preserve-ram-user.xml
          target: /etc/clickhouse-server/users.d/preserve-ram-user.xml
  volumes:
    swetrix-events-data:
  configs:
    clickhouse-disable-user-logging.xml:
      content: |
        <clickhouse>
          <profiles>
            <default>
              <log_queries>0</log_queries>
              <log_query_threads>0</log_query_threads>
            </default>
          </profiles>
        </clickhouse>
    clickhouse-reduce-logs.xml:
      content: |
        <clickhouse>
          <logger>
            <level>warning</level>
            <console>true</console>
          </logger>
          <query_thread_log remove="remove"/>
          <query_log remove="remove"/>
          <text_log remove="remove"/>
          <trace_log remove="remove"/>
          <metric_log remove="remove"/>
          <asynchronous_metric_log remove="remove"/>
          <session_log remove="remove"/>
          <part_log remove="remove"/>
        </clickhouse>
    clickhouse-preserve-ram-config.xml:
      content: |
        <clickhouse>
          <mark_cache_size>536870912</mark_cache_size>
          <concurrent_threads_soft_limit_num>1</concurrent_threads_soft_limit_num>
        </clickhouse>
    clickhouse-preserve-ram-user.xml:
      content: |
        <clickhouse>
          <profiles>
            <default>
              <max_block_size>2048</max_block_size>
              <max_download_threads>1</max_download_threads>
              <input_format_parallel_parsing>0</input_format_parallel_parsing>
              <output_format_parallel_formatting>0</output_format_parallel_formatting>
            </default>
          </profiles>
        </clickhouse>
