# Converted from Coolify's service templates (Apache-2.0).
name: GoWA (WhatsApp API)
category: Communication
description: Golang WhatsApp - Built with Go for efficient memory use
website: https://github.com/aldinokemal/go-whatsapp-web-multidevice
tags:
  - whatsapp
  - golang
  - multidevice
  - api
  - go-whatsapp
logo: templates/gowa.webp
env: |-
  PORT=3000
  GOWA_USER={{user}}
  GOWA_PASSWORD={{secret}}

  # Optional settings
  APP_DEBUG=false
  APP_ACCOUNT_VALIDATION=false
  WHATSAPP_WEBHOOK=
  WHATSAPP_WEBHOOK_SECRET=
compose: |
  services:
    gowa:
      image: aldinokemal2104/go-whatsapp-web-multidevice:latest
      restart: unless-stopped
      environment:
        - SERVICE_USER_GOWA
        - SERVICE_PASSWORD_GOWA
        - APP_BASIC_AUTH=${GOWA_USER}:${GOWA_PASSWORD}
        - APP_PORT=3000
        - APP_DEBUG=${APP_DEBUG:-false}
        - APP_ACCOUNT_VALIDATION=${APP_ACCOUNT_VALIDATION:-false}
        - WHATSAPP_WEBHOOK=${WHATSAPP_WEBHOOK}
        - WHATSAPP_WEBHOOK_SECRET=${WHATSAPP_WEBHOOK_SECRET}
      volumes:
        - gowa_data:/app/storages
      ports:
        - ${PORT:-3000}:3000
  volumes:
    gowa_data:
