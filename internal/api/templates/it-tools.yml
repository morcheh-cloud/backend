# Converted from Coolify's service templates (Apache-2.0).
name: IT Tools
category: Development
description: IT Tools is a self-hosted solution for managing various IT tasks.
website: https://github.com/corentinth/it-tools
tags:
  - it-tools
  - management
  - self-hosted
logo: templates/it-tools.svg
featured: true
env: PORT=8080
compose: |
  services:
    it-tools:
      image: corentinth/it-tools:latest
      restart: unless-stopped
      volumes:
        - it-tools-data:/app/data
      healthcheck:
        test: [CMD, curl, -f, http://127.0.0.1:80]
        interval: 30s
        timeout: 10s
        retries: 3
      ports:
        - ${PORT:-8080}:80
  volumes:
    it-tools-data:
