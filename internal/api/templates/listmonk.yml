# Converted from Coolify's service templates (Apache-2.0).
name: Listmonk
category: Email
description: Self-hosted newsletter and mailing list manager
website: https://listmonk.app/
tags:
  - newsletter
  - mailing list
  - self-hosted
  - open source
logo: templates/listmonk.svg
featured: true
env: |-
  PORT=9000
  POSTGRES_USER={{user}}
  POSTGRES_PASSWORD={{secret}}
compose: |
  services:
    listmonk:
      image: listmonk/listmonk:v6.0.0
      restart: unless-stopped
      environment:
        - LISTMONK_app__address=0.0.0.0:9000
        - LISTMONK_db__host=postgres
        - LISTMONK_db__database=listmonk
        - LISTMONK_db__user=$POSTGRES_USER
        - LISTMONK_db__password=$POSTGRES_PASSWORD
        - LISTMONK_db__port=5432
        - TZ=Etc/UTC
      volumes:
        - listmonk-data:/listmonk/uploads
      healthcheck:
        test: [CMD, wget, -q, --spider, http://127.0.0.1:9000]
        interval: 5s
        timeout: 20s
        retries: 10
      depends_on:
        postgres:
          condition: service_healthy
      ports:
        - ${PORT:-9000}:9000
    listmonk-initial-database-setup:
      image: listmonk/listmonk:v6.0.0
      command: ./listmonk --install --yes --idempotent
      restart: no
      depends_on:
        postgres:
          condition: service_healthy
      environment:
        - LISTMONK_db__host=postgres
        - LISTMONK_db__database=listmonk
        - LISTMONK_db__user=$POSTGRES_USER
        - LISTMONK_db__password=$POSTGRES_PASSWORD
        - LISTMONK_db__port=5432
    postgres:
      image: postgres:18-alpine
      restart: unless-stopped
      environment:
        - POSTGRES_DB=listmonk
        - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
        - POSTGRES_USER=$POSTGRES_USER
      volumes:
        - postgres-data:/var/lib/postgresql
      healthcheck:
        test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 20s
        retries: 10
  volumes:
    listmonk-data:
    postgres-data:
