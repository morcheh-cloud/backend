# Converted from Coolify's service templates (Apache-2.0).
name: ClassicPress with MariaDB
category: Websites
description: A lightweight, stable, instantly familiar free open-source content management system, based on WordPress without the block editor (Gutenberg).
website: https://www.classicpress.net/
tags:
  - cms
  - blog
  - content
  - management
logo: templates/classicpress.svg
env: |-
  PORT=8080
  CLASSICPRESS_USER={{user}}
  CLASSICPRESS_PASSWORD={{secret}}
  ROOT_PASSWORD={{secret}}
compose: |
  services:
    classicpress:
      image: classicpress/classicpress:latest
      restart: unless-stopped
      volumes:
        - classicpress-files:/var/www/html
      environment:
        - CLASSICPRESS_DB_HOST=mariadb
        - CLASSICPRESS_DB_USER=$CLASSICPRESS_USER
        - CLASSICPRESS_DB_PASSWORD=$CLASSICPRESS_PASSWORD
        - CLASSICPRESS_DB_NAME=classicpress
      depends_on:
        - mariadb
      healthcheck:
        test: [CMD, curl, -f, http://127.0.0.1]
        interval: 2s
        timeout: 10s
        retries: 10
      ports:
        - ${PORT:-8080}:80
    mariadb:
      image: mariadb:11
      restart: unless-stopped
      volumes:
        - mariadb-data:/var/lib/mysql
      environment:
        - MYSQL_ROOT_PASSWORD=$ROOT_PASSWORD
        - MYSQL_DATABASE=classicpress
        - MYSQL_USER=$CLASSICPRESS_USER
        - MYSQL_PASSWORD=$CLASSICPRESS_PASSWORD
      healthcheck:
        test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
        interval: 5s
        timeout: 20s
        retries: 10
  volumes:
    classicpress-files:
    mariadb-data:
