# Converted from Coolify's service templates (Apache-2.0).
name: Gitea with PostgreSQL
category: Git & CI
description: Gitea is a self-hosted, lightweight Git service, offering version control, collaboration, and code hosting.
website: https://docs.gitea.com
tags:
  - version control
  - collaboration
  - code
  - hosting
  - lightweight
  - postgresql
logo: templates/gitea.svg
env: |-
  PORT=3000
  POSTGRESQL_USER={{user}}
  POSTGRESQL_PASSWORD={{secret}}

  # Optional settings
  POSTGRESQL_DATABASE=gitea
compose: |
  services:
    gitea:
      image: gitea/gitea:latest
      restart: unless-stopped
      environment:
        - USER_UID=1000
        - USER_GID=1000
        - GITEA__database__DB_TYPE=postgres
        - GITEA__database__HOST=postgresql
        - GITEA__database__NAME=${POSTGRESQL_DATABASE-gitea}
        - GITEA__database__USER=$POSTGRESQL_USER
        - GITEA__database__PASSWD=$POSTGRESQL_PASSWORD
      volumes:
        - gitea-data:/data
        - gitea-timezone:/etc/timezone:ro
        - gitea-localtime:/etc/localtime:ro
      ports:
        - 22222:22
        - ${PORT:-3000}:3000
      depends_on:
        postgresql:
          condition: service_healthy
      healthcheck:
        test: [CMD, curl, -f, http://127.0.0.1:3000]
        interval: 2s
        timeout: 10s
        retries: 15
    postgresql:
      image: postgres:16-alpine
      restart: unless-stopped
      volumes:
        - gitea-postgresql-data:/var/lib/postgresql/data
      environment:
        - POSTGRES_USER=${POSTGRESQL_USER}
        - POSTGRES_PASSWORD=${POSTGRESQL_PASSWORD}
        - POSTGRES_DB=${POSTGRESQL_DATABASE}
      healthcheck:
        test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 20s
        retries: 10
  volumes:
    gitea-data:
    gitea-timezone:
    gitea-localtime:
    gitea-postgresql-data:
