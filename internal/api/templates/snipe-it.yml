# Converted from Coolify's service templates (Apache-2.0).
name: Snipe-IT
category: Productivity
description: Snipe-IT is an open-source asset management platform built for IT departments.
website: https://snipe-it.readme.io/docs/introduction
tags:
  - inventory
  - open-source
logo: templates/snipe-it.webp
env: |-
  PORT=8080
  APPKEY_KEY={{base64:32}}
  SNIPEIT_URL=http://{{host}}:${PORT}
  MARIADB_USER={{user}}
  MARIADB_PASSWORD={{secret}}
  ROOT_PASSWORD={{secret}}

  # Optional settings
  APP_TIMEZONE=UTC
  APP_LOCALE=en-US
  MYSQL_DATABASE=snipeit
  MAIL_MAILER=smtp
  MAIL_HOST=null
  MAIL_PORT=1025
  MAIL_USERNAME=null
  MAIL_PASSWORD=null
  MAIL_FROM_ADDR=you@example.com
  MAIL_FROM_NAME=Snipe-IT
compose: |
  services:
    app:
      image: snipe/snipe-it:v8.8.3
      restart: unless-stopped
      environment:
        - APP_ENV=production
        - APP_DEBUG=false
        - APP_KEY=base64:${APPKEY_KEY}
        - APP_URL=${SNIPEIT_URL}
        - APP_TIMEZONE=${APP_TIMEZONE:-UTC}
        - APP_LOCALE=${APP_LOCALE:-en-US}
        - DB_CONNECTION=mysql
        - DB_HOST=mariadb
        - DB_PORT=3306
        - DB_DATABASE=${MYSQL_DATABASE:-snipeit}
        - DB_USERNAME=${MARIADB_USER}
        - DB_PASSWORD=${MARIADB_PASSWORD}
        - MAIL_MAILER=${MAIL_MAILER:-smtp}
        - MAIL_HOST=${MAIL_HOST:-null}
        - MAIL_PORT=${MAIL_PORT:-1025}
        - MAIL_USERNAME=${MAIL_USERNAME:-null}
        - MAIL_PASSWORD=${MAIL_PASSWORD:-null}
        - MAIL_FROM_ADDR=${MAIL_FROM_ADDR:-you@example.com}
        - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Snipe-IT}
      volumes:
        - storage:/var/lib/snipeit
      healthcheck:
        test: [CMD, curl, -f, http://localhost/health]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 30s
      depends_on:
        mariadb:
          condition: service_healthy
      ports:
        - ${PORT:-8080}:80
    mariadb:
      image: mariadb:11.8
      restart: unless-stopped
      environment:
        - MYSQL_DATABASE=${MYSQL_DATABASE:-snipeit}
        - MYSQL_USER=${MARIADB_USER}
        - MYSQL_PASSWORD=${MARIADB_PASSWORD}
        - MYSQL_ROOT_PASSWORD=${ROOT_PASSWORD}
      volumes:
        - db_data:/var/lib/mysql
      healthcheck:
        test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
        interval: 5s
        timeout: 1s
        retries: 5
  volumes:
    storage:
    db_data:
