# Converted from Coolify's service templates (Apache-2.0).
name: Calibre-Web Book Downloader
category: Media
description: An intuitive web interface for searching and requesting book downloads, designed to work seamlessly with Calibre-Web-Automated.
website: https://github.com/calibrain/calibre-web-automated-book-downloader
tags:
  - calibre
  - calibre-web
  - ebook
  - library
  - epub
  - ereader
  - kindle
  - book
  - reader
  - download
  - downloader
logo: templates/calibre-web-automated-with-downloader.webp
env: |-
  CWA_PORT=8083
  DOWNLOADER_PORT=8084

  # Optional settings
  PUID=1000
  PGID=1000
  TZ=UTC
  NETWORK_SHARE_MODE=false
  FLASK_PORT=8084
  LOG_LEVEL=info
  BOOK_LANGUAGE=en
  USE_BOOK_TITLE=true
  APP_ENV=prod
  UID=1000
  GID=100
  CWA_DB_PATH=/cwa-config/app.db
compose: |
  services:
    calibre-web-automated:
      image: crocodilestick/calibre-web-automated:latest
      restart: unless-stopped
      environment:
        - PUID=${PUID:-1000}
        - PGID=${PGID:-1000}
        - TZ=${TZ:-UTC}
        - NETWORK_SHARE_MODE=${NETWORK_SHARE_MODE:-false}
      volumes:
        - cwa-config:/config
        - cwa-book-ingest:/cwa-book-ingest
        - calibre-library:/calibre-library
        - calibre-plugins:/config/.config/calibre/plugins
      healthcheck:
        test: [CMD-SHELL, "curl -fs http://localhost:8083 || exit 1"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 30s
      ports:
        - ${CWA_PORT:-8083}:8083
    calibre-web-downloader:
      image: ghcr.io/calibrain/calibre-web-automated-book-downloader:latest
      restart: unless-stopped
      environment:
        - FLASK_PORT=${FLASK_PORT:-8084}
        - LOG_LEVEL=${LOG_LEVEL:-info}
        - BOOK_LANGUAGE=${BOOK_LANGUAGE:-en}
        - USE_BOOK_TITLE=${USE_BOOK_TITLE:-true}
        - TZ=${TZ:-America/New_York}
        - APP_ENV=${APP_ENV:-prod}
        - UID=${UID:-1000}
        - GID=${GID:-100}
        - CWA_DB_PATH=${CWA_DB_PATH:-/cwa-config/app.db}
      volumes:
        - cwa-book-ingest:/cwa-book-ingest
        - cwa-config:/cwa-config
      ports:
        - ${DOWNLOADER_PORT:-8084}:8084
  volumes:
    cwa-config:
    cwa-book-ingest:
    calibre-library:
    calibre-plugins:
