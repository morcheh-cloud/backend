# Converted from Coolify's service templates (Apache-2.0).
name: Penpot with S3
category: Productivity
description: Penpot is the first Open Source design and prototyping platform for product teams.
website: https://help.penpot.app/technical-guide/getting-started/#install-with-docker
tags:
  - penpot
  - design
  - prototyping
  - figma
  - open
  - source
logo: templates/penpot.svg
env: |-
  FRONTEND_PORT=8080
  MAILPIT_PORT=8025
  PENPOT_KEY={{base64:64}}
  FRONTEND_URL=http://{{host}}:${FRONTEND_PORT}
  POSTGRES_USER={{user}}
  POSTGRES_PASSWORD={{secret}}
  MINIO_USER={{user}}
  MINIO_PASSWORD={{secret}}

  # Optional settings
  PENPOT_BACKEND_FLAGS=enable-login-with-password
  POSTGRES_DB=penpot
  PENPOT_TELEMETRY_ENABLED=false
  PENPOT_SMTP_DEFAULT_FROM=no-reply@example.com
  PENPOT_SMTP_DEFAULT_REPLY_TO=no-reply@example.com
  PENPOT_SMTP_HOST=mailpit
  PENPOT_SMTP_PORT=1025
  PENPOT_SMTP_USERNAME=penpot
  PENPOT_SMTP_PASSWORD=penpot
  PENPOT_SMTP_TLS=false
  PENPOT_SMTP_SSL=false
compose: |
  services:
    frontend:
      image: penpotapp/frontend:2.11.1
      restart: unless-stopped
      depends_on:
        penpot-backend:
          condition: service_healthy
        penpot-exporter:
          condition: service_healthy
      environment:
        - PENPOT_FLAGS=${PENPOT_BACKEND_FLAGS:-enable-login-with-password}
      healthcheck:
        test: [CMD, curl, -f, http://127.0.0.1:8080]
        interval: 2s
        timeout: 10s
        retries: 15
      ports:
        - ${FRONTEND_PORT:-8080}:8080
    penpot-backend:
      image: penpotapp/backend:2.11.1
      restart: unless-stopped
      depends_on:
        postgres:
          condition: service_healthy
        penpot-valkey:
          condition: service_healthy
        minio-init:
          condition: service_completed_successfully
      environment:
        - PENPOT_FLAGS=${PENPOT_BACKEND_FLAGS:-enable-login-with-password}
        - PENPOT_HTTP_SERVER_PORT=6060
        - PENPOT_SECRET_KEY=${PENPOT_KEY}
        - PENPOT_PUBLIC_URI=${FRONTEND_URL}
        - PENPOT_BACKEND_URI=http://penpot-backend
        - PENPOT_EXPORTER_URI=http://penpot-exporter
        - PENPOT_DATABASE_URI=postgresql://postgres/${POSTGRES_DB:-penpot}
        - PENPOT_DATABASE_USERNAME=${POSTGRES_USER}
        - PENPOT_DATABASE_PASSWORD=${POSTGRES_PASSWORD}
        - PENPOT_REDIS_URI=redis://penpot-valkey/0
        - PENPOT_TELEMETRY_ENABLED=${PENPOT_TELEMETRY_ENABLED:-false}
        - PENPOT_OBJECTS_STORAGE_BACKEND=s3
        - PENPOT_OBJECTS_STORAGE_S3_REGION=us-east-1
        - PENPOT_OBJECTS_STORAGE_S3_BUCKET=penpot
        - PENPOT_OBJECTS_STORAGE_S3_ENDPOINT=http://minio:9000
        - AWS_ACCESS_KEY_ID=${MINIO_USER}
        - AWS_SECRET_ACCESS_KEY=${MINIO_PASSWORD}
        - PENPOT_SMTP_DEFAULT_FROM=${PENPOT_SMTP_DEFAULT_FROM:-no-reply@example.com}
        - PENPOT_SMTP_DEFAULT_REPLY_TO=${PENPOT_SMTP_DEFAULT_REPLY_TO:-no-reply@example.com}
        - PENPOT_SMTP_HOST=${PENPOT_SMTP_HOST:-mailpit}
        - PENPOT_SMTP_PORT=${PENPOT_SMTP_PORT:-1025}
        - PENPOT_SMTP_USERNAME=${PENPOT_SMTP_USERNAME:-penpot}
        - PENPOT_SMTP_PASSWORD=${PENPOT_SMTP_PASSWORD:-penpot}
        - PENPOT_SMTP_TLS=${PENPOT_SMTP_TLS:-false}
        - PENPOT_SMTP_SSL=${PENPOT_SMTP_SSL:-false}
      healthcheck:
        test: [CMD, node, -e, "require('http').get({host:'127.0.0.1', port:6060, path:'/readyz'}, res => process.exit(res.statusCode===200 ? 0 : 1)).on('error', () => process.exit(1));"]
        interval: 10s
        timeout: 30s
        retries: 15
    penpot-exporter:
      image: penpotapp/exporter:2.11.1
      restart: unless-stopped
      environment:
        - PENPOT_PUBLIC_URI=${FRONTEND_URL}
        - PENPOT_REDIS_URI=redis://penpot-valkey/0
      healthcheck:
        test: [CMD, curl, -f, http://127.0.0.1:6061/readyz]
        interval: 2s
        timeout: 10s
        retries: 15
    minio:
      image: pgsty/silo:RELEASE.2026-10-15T00-00-00Z
      restart: unless-stopped
      command: server /data
      environment:
        - MINIO_ROOT_USER=${MINIO_USER}
        - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD}
      volumes:
        - minio-data:/data
      healthcheck:
        test: [CMD, mc, ready, local]
        interval: 5s
        timeout: 20s
        retries: 10
    minio-init:
      image: pgsty/silo:RELEASE.2026-10-15T00-00-00Z
      depends_on:
        minio:
          condition: service_healthy
      entrypoint: |
        sh -c "
          mc alias set local http://minio:9000 ${MINIO_USER} ${MINIO_PASSWORD} &&
          mc mb -p local/penpot || true &&
          mc anonymous set private local/penpot
        "
      restart: no
    postgres:
      image: postgres:15
      restart: unless-stopped
      volumes:
        - penpot-postgresql-data:/var/lib/postgresql/data
      environment:
        - POSTGRES_INITDB_ARGS=--data-checksums
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DB:-penpot}
      healthcheck:
        test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 20s
        retries: 10
    penpot-valkey:
      image: valkey/valkey:8.1
      restart: unless-stopped
      volumes:
        - penpot-valkey-data:/data
      environment:
        - VALKEY_EXTRA_FLAGS=--maxmemory 128mb --maxmemory-policy volatile-lfu
      healthcheck:
        test: [CMD-SHELL, "valkey-cli ping | grep PONG"]
        interval: 1s
        timeout: 3s
        retries: 5
        start_period: 3s
    mailpit:
      image: axllent/mailpit:v1.28
      restart: unless-stopped
      healthcheck:
        test: [CMD, /mailpit, readyz]
        interval: 5s
        timeout: 20s
        retries: 10
      ports:
        - ${MAILPIT_PORT:-8025}:8025
  volumes:
    minio-data:
    penpot-postgresql-data:
    penpot-valkey-data:
