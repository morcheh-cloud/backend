# Converted from Coolify's service templates (Apache-2.0).
name: Yamtrack
category: Productivity
description: Yamtrack is a self hosted media tracker for movies, tv shows, anime, manga, video games and books.
website: https://github.com/FuzzyGrim/Yamtrack/wiki
tags:
  - self-hosted
  - automation
  - tracker
  - media
  - movies
  - shows
  - anime
  - manga
  - games
  - books
  - comics
logo: templates/yamtrack.svg
env: |-
  PORT=8000
  YAMTRACK_URL=http://{{host}}:${PORT}
  SECRET_PASSWORD={{secret}}

  # Optional settings
  TZ=Europe/Berlin
  REGISTRATION_ENABLED=true
compose: |
  services:
    yamtrack:
      image: ghcr.io/fuzzygrim/yamtrack
      restart: unless-stopped
      environment:
        - URLS=${YAMTRACK_URL}
        - TZ=${TZ:-Europe/Berlin}
        - SECRET=${SECRET_PASSWORD}
        - REGISTRATION=${REGISTRATION_ENABLED:-true}
        - REDIS_URL=redis://redis:6379
      volumes:
        - yamtrack_data:/yamtrack/db
      depends_on:
        redis:
          condition: service_healthy
      healthcheck:
        test: [CMD-SHELL, "wget --quiet --tries=1 --spider http://127.0.0.1:8000/health/ || exit 1"]
        interval: 5s
        timeout: 20s
        retries: 10
      ports:
        - ${PORT:-8000}:8000
    redis:
      image: redis:7-alpine
      restart: unless-stopped
      volumes:
        - yamtrack_redis_data:/data
      healthcheck:
        test: [CMD, redis-cli, ping]
        interval: 5s
        timeout: 20s
        retries: 10
  volumes:
    yamtrack_data:
    yamtrack_redis_data:
