# Converted from Coolify's service templates (Apache-2.0).
name: SiYuan
category: Productivity
description: A privacy-first, self-hosted, fully open source personal knowledge management software, written in typescript and golang.
website: https://github.com/siyuan-note/siyuan
tags:
  - note-taking
  - markdown
  - pkm
logo: templates/siyuan.svg
env: |-
  PORT=6806
  SIYUAN_PASSWORD={{secret}}

  # Optional settings
  TZ=UTC
compose: |
  services:
    siyuan:
      image: b3log/siyuan:v3.3.5
      restart: unless-stopped
      volumes:
        - siyuan_workspace:/siyuan/workspace
      environment:
        - TZ=${TZ:-UTC}
        - PUID=1000
        - PGID=1000
        - SIYUAN_ACCESS_AUTH_CODE=${SIYUAN_PASSWORD}
      healthcheck:
        test: [CMD, wget, --spider, --quiet, http://127.0.0.1:6806/api/system/version]
        interval: 15s
        timeout: 10s
        retries: 5
        start_period: 20s
      ports:
        - ${PORT:-6806}:6806
  volumes:
    siyuan_workspace:
