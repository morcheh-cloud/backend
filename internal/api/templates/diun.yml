# Converted from Coolify's service templates (Apache-2.0).
name: Diun
category: Automation
description: Docker Image Update Notifier is a CLI application to receive notifications when a Docker image is updated on a Docker registry.
website: https://crazymax.dev/diun/
tags:
  - docker
  - notifier
  - slack
logo: templates/diun.svg
env: |-
  # Optional settings
  TIME_ZONE=Europe/Vienna
  LOG_LEVEL=info
  LOG_JSON=false
  DIUN_WATCH_WORKERS=20
  DIUN_WATCH_SCHEDULE=" * */6 * * *"
  DIUN_WATCH_JITTER=30s
  DIUN_PROVIDERS_DOCKER=true
  DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true
  SERVICE_WEBHOOK_URL_SLACK=
compose: |
  services:
    diun:
      image: crazymax/diun:latest
      restart: unless-stopped
      command: serve
      volumes:
        - diun_data:/data
        - /var/run/docker.sock:/var/run/docker.sock
      environment:
        - TZ=${TIME_ZONE:-Europe/Vienna}
        - LOG_LEVEL=${LOG_LEVEL:-info}
        - LOG_JSON=${LOG_JSON:-false}
        - DIUN_WATCH_WORKERS=${DIUN_WATCH_WORKERS:-20}
        - DIUN_WATCH_SCHEDULE=${DIUN_WATCH_SCHEDULE:- * */6 * * *}
        - DIUN_WATCH_JITTER=${DIUN_WATCH_JITTER:-30s}
        - DIUN_PROVIDERS_DOCKER=${DIUN_PROVIDERS_DOCKER:-true}
        - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=${DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT:-true}
        - DIUN_NOTIF_SLACK_WEBHOOKURL=${SERVICE_WEBHOOK_URL_SLACK}
      healthcheck:
        test: [CMD, diun, --version]
        interval: 5s
        timeout: 20s
        retries: 3
  volumes:
    diun_data:
