# Converted from Coolify's service templates (Apache-2.0).
name: Firefly III
category: Finance
description: A personal finances manager that can help you save money.
website: https://firefly-iii.org
tags:
  - finance
  - money
  - personal
  - manager
logo: templates/firefly.svg
env: |-
  PORT=8080
  APPKEY_SECRET={{secret}}
  MYSQL_USER={{user}}
  MYSQL_PASSWORD={{secret}}
  CRONTOKEN_SECRET={{secret}}
  MYSQLROOT_PASSWORD={{secret}}

  # Optional settings
  MYSQL_DATABASE=firefly
  STATIC_CRON_TOKEN=
  CRON_COMMAND=
compose: |
  services:
    firefly:
      image: fireflyiii/core:latest
      restart: unless-stopped
      environment:
        - APP_KEY=$APPKEY_SECRET
        - DB_HOST=mysql
        - DB_PORT=3306
        - DB_CONNECTION=mysql
        - DB_DATABASE=${MYSQL_DATABASE:-firefly}
        - DB_USERNAME=$MYSQL_USER
        - DB_PASSWORD=$MYSQL_PASSWORD
        - STATIC_CRON_TOKEN=$CRONTOKEN_SECRET
        - TRUSTED_PROXIES=*
      volumes:
        - firefly-upload:/var/www/html/storage/upload
      healthcheck:
        test: [CMD, curl, -f, http://127.0.0.1:8080/health]
        interval: 5s
        timeout: 20s
        retries: 10
      depends_on:
        mysql:
          condition: service_healthy
      ports:
        - ${PORT:-8080}:8080
    mysql:
      image: mariadb:11
      restart: unless-stopped
      environment:
        - MYSQL_USER=${MYSQL_USER}
        - MYSQL_PASSWORD=${MYSQL_PASSWORD}
        - MYSQL_DATABASE=${MYSQL_DATABASE:-firefly}
        - MYSQL_ROOT_PASSWORD=${MYSQLROOT_PASSWORD}
      healthcheck:
        test: [CMD, mariadb-admin, ping, -h, 127.0.0.1, -uroot, "-p${MYSQLROOT_PASSWORD}"]
        interval: 5s
        timeout: 20s
        retries: 10
      volumes:
        - firefly-mysql-data:/var/lib/mysql
    cron:
      image: alpine
      restart: unless-stopped
      entrypoint: [/entrypoint.sh]
      environment:
        - STATIC_CRON_TOKEN=$CRONTOKEN_SECRET
      healthcheck:
        test: [CMD-SHELL, "ls /entrypoint.sh || exit 1"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 40s
      configs:
        - source: cron-entrypoint.sh
          target: /entrypoint.sh
  volumes:
    firefly-upload:
    firefly-mysql-data:
  configs:
    cron-entrypoint.sh:
      content: |
        #!/bin/sh
        # Substitute the environment variable into the cron command
        CRON_COMMAND="0 3 * * * wget -qO- http://firefly:8080/api/v1/cron/${STATIC_CRON_TOKEN}"
        # Add the cron command to the crontab
        echo "$CRON_COMMAND" | crontab -
        # Start the cron daemon in the foreground with logging to stdout
        crond -f -L /dev/stdout
