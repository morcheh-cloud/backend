# Converted from Coolify's service templates (Apache-2.0).
name: MindsDB
category: AI
description: MindsDB is the platform for building AI from enterprise data, enabling smarter organizations.
website: https://docs.mindsdb.com/what-is-mindsdb
tags:
  - mysql
  - postgresdb
  - machine-learning
  - ai
logo: templates/mindsdb.svg
env: |-
  PORT=47334
  POSTGRES_USER={{user}}
  POSTGRES_PASSWORD={{secret}}

  # Optional settings
  FLASK_DEBUG=1
  OPENAI_API_KEY=
  LANGFUSE_HOST=
  LANGFUSE_PUBLIC_KEY=
  LANGFUSE_SECRET_KEY=
  LANGFUSE_RELEASE=local
  LANGFUSE_DEBUG=False
  LANGFUSE_TIMEOUT=10
  LANGFUSE_SAMPLE_RATE=1.0
  POSTGRES_DB=mindsdb-db
compose: |
  services:
    mindsdb:
      image: mindsdb/mindsdb:latest
      restart: unless-stopped
      environment:
        - MINDSDB_DOCKER_ENV=true
        - MINDSDB_STORAGE_DIR=/mindsdb/var
        - FLASK_DEBUG=${FLASK_DEBUG:-1}
        - OPENAI_API_KEY=${OPENAI_API_KEY}
        - LANGFUSE_HOST=${LANGFUSE_HOST}
        - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
        - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
        - LANGFUSE_RELEASE=${LANGFUSE_RELEASE:-local}
        - LANGFUSE_DEBUG=${LANGFUSE_DEBUG:-False}
        - LANGFUSE_TIMEOUT=${LANGFUSE_TIMEOUT:-10}
        - LANGFUSE_SAMPLE_RATE=${LANGFUSE_SAMPLE_RATE:-1.0}
        - MINDSDB_DB_CON=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresql/${POSTGRES_DB:-mindsdb-db}
      volumes:
        - mindsdb-data:/mindsdb/var
      depends_on:
        postgresql:
          condition: service_healthy
      healthcheck:
        test: [CMD, curl, -f, http://localhost:47334/api/util/ping]
        interval: 30s
        timeout: 5s
        retries: 15
      ports:
        - ${PORT:-47334}:47334
    postgresql:
      image: postgres:16-alpine
      restart: unless-stopped
      volumes:
        - mindsdb-postgresql-data:/var/lib/postgresql/data
      environment:
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DB:-mindsdb-db}
      healthcheck:
        test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 10s
        timeout: 5s
        retries: 15
  volumes:
    mindsdb-data:
    mindsdb-postgresql-data:
