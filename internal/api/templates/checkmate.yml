# Converted from Coolify's service templates (Apache-2.0).
name: Checkmate
category: Monitoring
description: An open source server and websites monitoring application
website: https://docs.checkmate.so/
tags:
  - monitoring
  - server
  - uptime
  - healthcheck
logo: templates/checkmate.webp
env: |-
  PORT=52345
  CHECKMATE_URL=http://{{host}}:${PORT}
  JWT_PASSWORD={{secret:64}}
compose: |
  services:
    checkmate:
      image: ghcr.io/bluewave-labs/checkmate-backend-mono-multiarch:v3.2.0
      restart: unless-stopped
      environment:
        - UPTIME_APP_API_BASE_URL=${CHECKMATE_URL}/api/v1
        - UPTIME_APP_CLIENT_HOST=${CHECKMATE_URL}
        - DB_CONNECTION_STRING=mongodb://mongodb:27017/uptime_db
        - CLIENT_HOST=${CHECKMATE_URL}
        - JWT_SECRET=${JWT_PASSWORD}
      depends_on:
        - mongodb
      healthcheck:
        test: [CMD, node, -e, "require('http').get('http://127.0.0.1:52345/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
        interval: 30s
        timeout: 5s
        retries: 3
      ports:
        - ${PORT:-52345}:52345
    mongodb:
      image: ghcr.io/bluewave-labs/checkmate-mongo:v3.2.0
      restart: unless-stopped
      command: [mongod, --quiet, --bind_ip_all]
      volumes:
        - checkmate-mongo:/data/db
      healthcheck:
        test: [CMD, mongosh, --eval, "db.adminCommand('ping')", --quiet]
        interval: 5s
        timeout: 30s
        start_period: 10s
  volumes:
    checkmate-mongo:
