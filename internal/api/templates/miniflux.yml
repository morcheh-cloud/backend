# Converted from Coolify's service templates (Apache-2.0).
name: Miniflux
category: News & RSS
description: Miniflux is a minimalist and opinionated feed reader.
website: https://miniflux.app/docs/index.html
tags:
  - miniflux
  - rss
  - feed
  - self
  - hosted
logo: templates/miniflux.svg
env: |-
  PORT=8080
  MINIFLUX_URL=http://{{host}}:${PORT}
  ADMIN_USER={{user}}
  ADMIN_PASSWORD={{secret:64}}
  POSTGRES_USER={{user}}
  POSTGRES_PASSWORD={{secret}}

  # Optional settings
  RUN_MIGRATIONS=1
  CREATE_ADMIN=1
  POSTGRES_DB=miniflux-db
compose: |
  services:
    miniflux:
      image: ghcr.io/miniflux/miniflux:latest
      restart: unless-stopped
      environment:
        - BASE_URL=${MINIFLUX_URL}
        - PORT=${PORT:-8080}
        - RUN_MIGRATIONS=${RUN_MIGRATIONS:-1}
        - CREATE_ADMIN=${CREATE_ADMIN:-1}
        - ADMIN_USERNAME=${ADMIN_USER}
        - ADMIN_PASSWORD=${ADMIN_PASSWORD}
        - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-miniflux-db}?sslmode=disable
      healthcheck:
        test: [CMD-SHELL, wget -qO- http://127.0.0.1:8080/]
        interval: 5s
        timeout: 20s
        retries: 10
      depends_on:
        postgres:
          condition: service_healthy
      ports:
        - ${PORT:-8080}:8080
    postgres:
      image: postgres:16-alpine
      restart: unless-stopped
      volumes:
        - miniflux-postgres-data:/var/lib/postgresql/data
      environment:
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DB:-miniflux-db}
      healthcheck:
        test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 20s
        retries: 10
  volumes:
    miniflux-postgres-data:
