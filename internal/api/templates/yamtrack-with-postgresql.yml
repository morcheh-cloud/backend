# Converted from Coolify's service templates (Apache-2.0).
name: Yamtrack with PostgreSQL
category: Productivity
description: Yamtrack is a self hosted media tracker for movies, tv shows, anime, manga, video games and books.
website: https://github.com/FuzzyGrim/Yamtrack/wiki
tags:
  - self-hosted
  - automation
  - tracker
  - media
  - movies
  - shows
  - anime
  - manga
  - games
  - books
  - comics
logo: templates/yamtrack.svg
env: |-
  PORT=8000
  YAMTRACK_URL=http://{{host}}:${PORT}
  SECRET_PASSWORD={{secret}}
  POSTGRESQL_USER={{user}}
  POSTGRESQL_PASSWORD={{secret}}

  # Optional settings
  TZ=Europe/Berlin
  REGISTRATION_ENABLED=true
  POSTGRESQL_DATABASE=yamtrack-db
compose: |
  services:
    yamtrack:
      image: ghcr.io/fuzzygrim/yamtrack
      restart: unless-stopped
      environment:
        - URLS=${YAMTRACK_URL}
        - TZ=${TZ:-Europe/Berlin}
        - SECRET=${SECRET_PASSWORD}
        - REGISTRATION=${REGISTRATION_ENABLED:-true}
        - REDIS_URL=redis://redis:6379
        - DB_HOST=postgres
        - DB_NAME=${POSTGRESQL_DATABASE:-yamtrack-db}
        - DB_USER=${POSTGRESQL_USER}
        - DB_PASSWORD=${POSTGRESQL_PASSWORD}
        - DB_PORT=5432
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
      healthcheck:
        test: [CMD, wget, --no-verbose, --tries=1, --spider, http://127.0.0.1:8000/health/]
        interval: 5s
        timeout: 20s
        retries: 10
      ports:
        - ${PORT:-8000}:8000
    postgres:
      image: postgres:16-alpine
      restart: unless-stopped
      environment:
        - POSTGRES_USER=${POSTGRESQL_USER}
        - POSTGRES_PASSWORD=${POSTGRESQL_PASSWORD}
        - POSTGRES_DB=${POSTGRESQL_DATABASE:-yamtrack-db}
      volumes:
        - yamtrack_postgres_data:/var/lib/postgresql/data
      healthcheck:
        test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 20s
        retries: 10
    redis:
      image: redis:7-alpine
      restart: unless-stopped
      volumes:
        - yamtrack_redis_data:/data
      healthcheck:
        test: [CMD, redis-cli, ping]
        interval: 5s
        timeout: 20s
        retries: 10
  volumes:
    yamtrack_postgres_data:
    yamtrack_redis_data:
