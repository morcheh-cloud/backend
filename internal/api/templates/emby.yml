# Converted from Coolify's service templates (Apache-2.0).
name: Emby
category: Media
description: A media server software that allows you to organize, stream, and access your multimedia content effortlessly.
website: https://emby.media/support/articles/Home.html
tags:
  - media
  - server
  - movies
  - tv
  - music
logo: templates/emby.webp
env: PORT=8096
compose: |
  services:
    emby:
      image: lscr.io/linuxserver/emby:latest
      restart: unless-stopped
      environment:
        - PUID=1000
        - PGID=1000
        - TZ=Europe/Madrid
      volumes:
        - emby-config:/config
        - emby-tvshows:/tvshows
        - emby-movies:/movies
      healthcheck:
        test: [CMD, curl, -f, http://127.0.0.1:8096]
        interval: 2s
        timeout: 10s
        retries: 15
      ports:
        - ${PORT:-8096}:8096
  volumes:
    emby-config:
    emby-tvshows:
    emby-movies:
