# Converted from Coolify's service templates (Apache-2.0).
name: LibreChat
category: AI
description: Self-hosted, powerful, and privacy-focused chat UI for multiple AI models
website: https://docs.librechat.ai/install/configuration/dotenv.html
tags:
  - ai
  - chat
  - gpt
  - claude
  - palm
  - openai
  - azure
  - huggingface
  - anthropic
  - ollama
  - llm
logo: templates/librechat.svg
env: |-
  PORT=3080
  LIBRECHAT_URL=http://{{host}}:${PORT}
  MONGO_USER={{user}}
  MONGO_PASSWORD={{secret}}
  MEILI_PASSWORD={{secret}}
  JWT_PASSWORD={{secret}}
  JWT_PASSWORD_2={{secret:64}}
  CREDS_PASSWORD={{secret:64}}
  CREDS_PASSWORD_2={{secret}}
  POSTGRES_USER={{user}}
  POSTGRES_PASSWORD={{secret}}

  # Optional settings
  APP_TITLE=LibreChat
  ALLOW_EMAIL_LOGIN=true
  ALLOW_REGISTRATION=true
  ALLOW_SOCIAL_LOGIN=false
  ALLOW_SOCIAL_REGISTRATION=false
  ALLOW_PASSWORD_RESET=false
  ALLOW_UNVERIFIED_EMAIL_LOGIN=true
  SERVICE_ANTHROPIC_API_KEY=user_provided
  SERVICE_GOOGLE_API_KEY=user_provided
  SERVICE_OPENAI_API_KEY=user_provided
  SERVICE_ASSISTANTS_API_KEY=user_provided
  DEBUG_LOGGING=false
  DEBUG_OPENAI=false
  NO_INDEX=true
  MEILI_NO_ANALYTICS=false
compose: |
  services:
    librechat:
      image: ghcr.io/danny-avila/librechat-dev-api:6ecd1b510faaa593ad954fb6276c18e5f12a8e53
      restart: unless-stopped
      environment:
        - DOMAIN_CLIENT=${LIBRECHAT_URL}
        - DOMAIN_SERVER=${LIBRECHAT_URL}
        - HOST=0.0.0.0
        - PORT=3080
        - MONGO_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/librechat?authSource=admin
        - MEILI_HOST=http://meilisearch:7700
        - MEILI_MASTER_KEY=${MEILI_PASSWORD}
        - RAG_PORT=8000
        - RAG_API_URL=http://rag-api:8000
        - JWT_SECRET=${JWT_PASSWORD}
        - JWT_REFRESH_SECRET=${JWT_PASSWORD_2}
        - APP_TITLE=${APP_TITLE:-LibreChat}
        - ALLOW_EMAIL_LOGIN=${ALLOW_EMAIL_LOGIN:-true}
        - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
        - ALLOW_SOCIAL_LOGIN=${ALLOW_SOCIAL_LOGIN:-false}
        - ALLOW_SOCIAL_REGISTRATION=${ALLOW_SOCIAL_REGISTRATION:-false}
        - ALLOW_PASSWORD_RESET=${ALLOW_PASSWORD_RESET:-false}
        - ALLOW_UNVERIFIED_EMAIL_LOGIN=${ALLOW_UNVERIFIED_EMAIL_LOGIN:-true}
        - CREDS_KEY=${CREDS_PASSWORD}
        - CREDS_IV=${CREDS_PASSWORD_2}
        - ANTHROPIC_API_KEY=${SERVICE_ANTHROPIC_API_KEY:-user_provided}
        - GOOGLE_KEY=${SERVICE_GOOGLE_API_KEY:-user_provided}
        - OPENAI_API_KEY=${SERVICE_OPENAI_API_KEY:-user_provided}
        - ASSISTANTS_API_KEY=${SERVICE_ASSISTANTS_API_KEY:-user_provided}
        - DEBUG_LOGGING=${DEBUG_LOGGING:-false}
        - DEBUG_OPENAI=${DEBUG_OPENAI:-false}
        - DEBUG_PLUGINS=${DEBUG_OPENAI:-false}
        - NO_INDEX=${NO_INDEX:-true}
      volumes:
        - librechat-images:/app/client/public/images
        - librechat-logs:/app/api/logs
        - librechat-uploads:/app/uploads
      depends_on:
        mongodb:
          condition: service_healthy
        meilisearch:
          condition: service_healthy
        vectordb:
          condition: service_healthy
        rag-api:
          condition: service_healthy
      healthcheck:
        test: [CMD, wget, --no-verbose, --tries=1, --spider, http://127.0.0.1:3080/health]
        interval: 5s
        timeout: 10s
        retries: 5
      ports:
        - ${PORT:-3080}:3080
      configs:
        - source: librechat-librechat.yaml
          target: /app/librechat.yaml
    mongodb:
      image: mongo:8
      restart: unless-stopped
      environment:
        - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
        - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      volumes:
        - mongodb-data:/data/db
      healthcheck:
        test: [CMD, mongosh, --eval, "db.runCommand('ping').ok", 127.0.0.1:27017/test, --quiet]
        interval: 5s
        timeout: 10s
        retries: 3
    meilisearch:
      image: getmeili/meilisearch:v1.35.1
      restart: unless-stopped
      environment:
        - MEILI_MASTER_KEY=${MEILI_PASSWORD}
        - MEILI_NO_ANALYTICS=${MEILI_NO_ANALYTICS:-false}
        - MEILI_ENV=production
        - MEILI_HOST=http://meilisearch:7700
      volumes:
        - meilisearch-data:/meili_data
      healthcheck:
        test: [CMD, curl, -f, http://127.0.0.1:7700/health]
        interval: 2s
        timeout: 10s
        retries: 15
    vectordb:
      image: ankane/pgvector:v0.5.1
      restart: unless-stopped
      environment:
        - POSTGRES_DB=rag
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_HOST_AUTH_METHOD=trust
      volumes:
        - vectordb-data:/var/lib/postgresql/data
      healthcheck:
        test: [CMD, pg_isready, --username=$POSTGRES_USER, --host=127.0.0.1, --port=5432, --dbname=rag]
        interval: 2s
        timeout: 1m
        retries: 5
        start_period: 10s
    rag-api:
      image: ghcr.io/danny-avila/librechat-rag-api-dev-lite:v0.7.3
      restart: unless-stopped
      environment:
        - POSTGRES_DB=rag
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - DB_HOST=vectordb
        - DB_USER=${POSTGRES_USER}
        - DB_PASSWORD=${POSTGRES_PASSWORD}
        - DB_NAME=rag
        - RAG_PORT=8000
        - RAG_OPENAI_API_KEY=${SERVICE_OPENAI_API_KEY:-user_provided}
      depends_on:
        vectordb:
          condition: service_healthy
      healthcheck:
        test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
        interval: 5s
        timeout: 10s
        retries: 10
  volumes:
    librechat-images:
    librechat-logs:
    librechat-uploads:
    mongodb-data:
    meilisearch-data:
    vectordb-data:
  configs:
    librechat-librechat.yaml:
      content: |
        version: 1.2.8
