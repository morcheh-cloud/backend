# Converted from Coolify's service templates (Apache-2.0).
name: Ghost
category: Websites
description: Ghost is a content management system (CMS) and blogging platform.
website: https://ghost.org
tags:
  - cms
  - blog
  - content
  - management
  - system
logo: templates/ghost.svg
featured: true
env: |-
  PORT=2368
  GHOST_URL=http://{{host}}:${PORT}
  MYSQL_USER={{user}}
  MYSQL_PASSWORD={{secret}}
  MYSQLROOT_PASSWORD={{secret}}

  # Optional settings
  MYSQL_DATABASE=ghost
  MAIL_OPTIONS_AUTH_PASS=
  MAIL_OPTIONS_AUTH_USER=
  MAIL_OPTIONS_SECURE=true
  MAIL_OPTIONS_PORT=465
  MAIL_OPTIONS_SERVICE=Mailgun
  MAIL_OPTIONS_HOST=
compose: |
  services:
    ghost:
      image: ghost:5
      restart: unless-stopped
      volumes:
        - ghost-content-data:/var/lib/ghost/content
      environment:
        - url=$GHOST_URL
        - database__client=mysql
        - database__connection__host=mysql
        - database__connection__user=$MYSQL_USER
        - database__connection__password=$MYSQL_PASSWORD
        - database__connection__database=${MYSQL_DATABASE-ghost}
        - mail__transport=SMTP
        - mail__options__auth__pass=${MAIL_OPTIONS_AUTH_PASS}
        - mail__options__auth__user=${MAIL_OPTIONS_AUTH_USER}
        - mail__options__secure=${MAIL_OPTIONS_SECURE:-true}
        - mail__options__port=${MAIL_OPTIONS_PORT:-465}
        - mail__options__service=${MAIL_OPTIONS_SERVICE:-Mailgun}
        - mail__options__host=${MAIL_OPTIONS_HOST}
      depends_on:
        mysql:
          condition: service_healthy
      healthcheck:
        test: [CMD, echo, ok]
        interval: 5s
        timeout: 20s
        retries: 10
      ports:
        - ${PORT:-2368}:2368
    mysql:
      image: mysql:8.0
      restart: unless-stopped
      volumes:
        - ghost-mysql-data:/var/lib/mysql
      environment:
        - MYSQL_USER=${MYSQL_USER}
        - MYSQL_PASSWORD=${MYSQL_PASSWORD}
        - MYSQL_DATABASE=${MYSQL_DATABASE}
        - MYSQL_ROOT_PASSWORD=${MYSQLROOT_PASSWORD}
      healthcheck:
        test: [CMD, mysqladmin, ping, -h, 127.0.0.1]
        interval: 5s
        timeout: 20s
        retries: 10
  volumes:
    ghost-content-data:
    ghost-mysql-data:
