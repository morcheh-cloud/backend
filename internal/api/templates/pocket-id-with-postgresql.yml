# Converted from Coolify's service templates (Apache-2.0).
name: Pocket ID with PostgreSQL
category: Security
description: A simple and secure OIDC provider with passkey authentication
website: https://pocket-id.org/docs/setup/installation
tags:
  - identity
  - oidc
  - oauth
  - passkey
  - webauthn
  - authentication
  - sso
  - openid
  - postgresql
logo: templates/pocketid-logo.webp
env: |-
  PORT=1411
  POCKETID_URL=http://{{host}}:${PORT}
  POSTGRESQL_USER={{user}}
  POSTGRESQL_PASSWORD={{secret}}
  POCKETID_PASSWORD={{secret:64}}

  # Optional settings
  TRUST_PROXY=true
  POSTGRES_DB=pocketid
  KEYS_STORAGE=database
  MAXMIND_LICENSE_KEY=
  SMTP_HOST=
  SMTP_PORT=587
  SMTP_FROM=
  SMTP_USER=
  SMTP_PASSWORD=
  SMTP_TLS=starttls
  SMTP_SKIP_CERT_VERIFY=false
  EMAIL_LOGIN_NOTIFICATION_ENABLED=false
  EMAIL_ONE_TIME_ACCESS_AS_ADMIN_ENABLED=false
  EMAIL_API_KEY_EXPIRATION_ENABLED=false
  PUID=1000
  PGID=1000
compose: |
  services:
    pocket-id:
      image: ghcr.io/pocket-id/pocket-id:v1.13
      restart: unless-stopped
      environment:
        - APP_URL=${POCKETID_URL}
        - TRUST_PROXY=${TRUST_PROXY:-true}
        - DB_PROVIDER=postgres
        - DB_CONNECTION_STRING=postgresql://${POSTGRESQL_USER}:${POSTGRESQL_PASSWORD}@postgresql:5432/${POSTGRES_DB:-pocketid}
        - ENCRYPTION_KEY=${POCKETID_PASSWORD}
        - KEYS_STORAGE=${KEYS_STORAGE:-database}
        - MAXMIND_LICENSE_KEY=${MAXMIND_LICENSE_KEY}
        - SMTP_HOST=${SMTP_HOST}
        - SMTP_PORT=${SMTP_PORT:-587}
        - SMTP_FROM=${SMTP_FROM}
        - SMTP_USER=${SMTP_USER}
        - SMTP_PASSWORD=${SMTP_PASSWORD}
        - SMTP_TLS=${SMTP_TLS:-starttls}
        - SMTP_SKIP_CERT_VERIFY=${SMTP_SKIP_CERT_VERIFY:-false}
        - EMAIL_LOGIN_NOTIFICATION_ENABLED=${EMAIL_LOGIN_NOTIFICATION_ENABLED:-false}
        - EMAIL_ONE_TIME_ACCESS_AS_ADMIN_ENABLED=${EMAIL_ONE_TIME_ACCESS_AS_ADMIN_ENABLED:-false}
        - EMAIL_API_KEY_EXPIRATION_ENABLED=${EMAIL_API_KEY_EXPIRATION_ENABLED:-false}
        - PUID=${PUID:-1000}
        - PGID=${PGID:-1000}
      volumes:
        - pocket-id-data:/app/data
      healthcheck:
        test: [CMD, /app/pocket-id, healthcheck]
        interval: 30s
        timeout: 5s
        retries: 3
        start_period: 10s
      depends_on:
        postgresql:
          condition: service_healthy
      ports:
        - ${PORT:-1411}:1411
    postgresql:
      image: postgres:16-alpine
      restart: unless-stopped
      volumes:
        - pocket-id-postgresql-data:/var/lib/postgresql/data
      environment:
        - POSTGRES_USER=${POSTGRESQL_USER}
        - POSTGRES_PASSWORD=${POSTGRESQL_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DB:-pocketid}
      healthcheck:
        test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 20s
        retries: 10
  volumes:
    pocket-id-data:
    pocket-id-postgresql-data:
