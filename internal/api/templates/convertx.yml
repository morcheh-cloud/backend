# Converted from Coolify's service templates (Apache-2.0).
name: ConvertX
category: Backend
description: A self-hosted online file converter. Supports over a thousand different formats.
website: https://github.com/C4illin/ConvertX
tags:
  - converter
  - file
  - documents
  - files
  - directories
logo: templates/convertx.webp
env: |-
  PORT=3000
  CONVERTXJWTSECRET_PASSWORD={{secret}}

  # Optional settings
  ACCOUNT_REGISTRATION=false
  HTTP_ALLOWED=true
  ALLOW_UNAUTHENTICATED=false
  AUTO_DELETE_EVERY_N_HOURS=24
compose: |
  services:
    convertx:
      image: ghcr.io/c4illin/convertx:latest
      restart: unless-stopped
      environment:
        - ACCOUNT_REGISTRATION=${ACCOUNT_REGISTRATION:-false}
        - HTTP_ALLOWED=${HTTP_ALLOWED:-true}
        - ALLOW_UNAUTHENTICATED=${ALLOW_UNAUTHENTICATED:-false}
        - AUTO_DELETE_EVERY_N_HOURS=${AUTO_DELETE_EVERY_N_HOURS:-24}
        - JWT_SECRET=${CONVERTXJWTSECRET_PASSWORD}
      volumes:
        - convertx_data:/app/data
      ports:
        - ${PORT:-3000}:3000
  volumes:
    convertx_data:
