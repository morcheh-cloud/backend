# Converted from Coolify's service templates (Apache-2.0).
name: Plane
category: Productivity
description: The open source project management tool
website: https://docs.plane.so/self-hosting/methods/docker-compose
tags:
  - plane
  - project-management
  - tool
  - open
  - source
  - api
  - nextjs
  - redis
  - postgresql
  - django
  - pm
logo: templates/plane.svg
featured: true
env: |-
  PORT=8080
  PLANE_URL=http://{{host}}:${PORT}
  LIVESECRET_PASSWORD={{secret:64}}
  POSTGRES_USER={{user}}
  POSTGRES_PASSWORD={{secret}}
  SECRETKEY_PASSWORD={{secret:64}}
  RABBITMQ_USER={{user}}
  RABBITMQ_PASSWORD={{secret}}
  MINIO_USER={{user}}
  MINIO_PASSWORD={{secret}}

  # Optional settings
  APP_RELEASE=v1.3.0
  FILE_SIZE_LIMIT=5242880
  AWS_S3_BUCKET_NAME=uploads
  API_BASE_URL=http://api:8000
  REDIS_HOST=plane-redis
  REDIS_PORT=6379
  REDIS_URL=redis://plane-redis:6379/
  DEBUG=0
  CORS_ALLOWED_ORIGINS=http://localhost
  GUNICORN_WORKERS=1
  USE_MINIO=1
  RABBITMQ_PORT=5672
  API_KEY_RATE_LIMIT=60/minute
  MINIO_ENDPOINT_SSL=0
  AWS_REGION=
  AWS_S3_ENDPOINT_URL=http://plane-minio:9000
  SITE_ADDRESS=:80
  RABBITMQ_VHOST=plane
compose: |
  services:
    proxy:
      image: makeplane/plane-proxy:${APP_RELEASE:-v1.3.0}
      restart: unless-stopped
      environment:
        - APP_DOMAIN=${PLANE_URL}
        - SITE_ADDRESS=:80
        - FILE_SIZE_LIMIT=${FILE_SIZE_LIMIT:-5242880}
        - BUCKET_NAME=${AWS_S3_BUCKET_NAME:-uploads}
      volumes:
        - proxy_config:/config
        - proxy_data:/data
      depends_on:
        - web
        - api
        - space
        - admin
        - live
      healthcheck:
        test: [CMD, curl, -f, http://127.0.0.1:80]
        interval: 2s
        timeout: 10s
        retries: 15
      ports:
        - ${PORT:-8080}:80
    web:
      image: makeplane/plane-frontend:${APP_RELEASE:-v1.3.0}
      restart: unless-stopped
      depends_on:
        - api
        - worker
      healthcheck:
        test: wget -qO- http://`hostname`:3000
        interval: 2s
        timeout: 10s
        retries: 15
    space:
      image: makeplane/plane-space:${APP_RELEASE:-v1.3.0}
      restart: unless-stopped
      depends_on:
        - api
        - worker
        - web
      healthcheck:
        test: [CMD, echo, hey whats up]
        interval: 2s
        timeout: 10s
        retries: 15
    admin:
      image: makeplane/plane-admin:${APP_RELEASE:-v1.3.0}
      restart: unless-stopped
      depends_on:
        - api
        - web
      healthcheck:
        test: [CMD, echo, hey whats up]
        interval: 2s
        timeout: 10s
        retries: 15
    live:
      image: makeplane/plane-live:${APP_RELEASE:-v1.3.0}
      restart: unless-stopped
      environment:
        API_BASE_URL: ${API_BASE_URL:-http://api:8000}
        LIVE_SERVER_SECRET_KEY: $LIVESECRET_PASSWORD
        REDIS_HOST: ${REDIS_HOST:-plane-redis}
        REDIS_PORT: ${REDIS_PORT:-6379}
        REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}
      depends_on:
        - api
        - web
      healthcheck:
        test: [CMD, echo, hey whats up]
        interval: 2s
        timeout: 10s
        retries: 15
    api:
      image: makeplane/plane-backend:${APP_RELEASE:-v1.3.0}
      restart: unless-stopped
      command: ./bin/docker-entrypoint-api.sh
      volumes:
        - logs_api:/code/plane/logs
      environment:
        APP_RELEASE: ${APP_RELEASE:-v1.3.0}
        WEB_URL: ${PLANE_URL}
        DEBUG: ${DEBUG:-0}
        CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
        GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
        USE_MINIO: ${USE_MINIO:-1}
        DATABASE_URL: postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@plane-db/plane
        SECRET_KEY: $SECRETKEY_PASSWORD
        AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@plane-mq:${RABBITMQ_PORT:-5672}/plane
        API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
        MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
        LIVE_SERVER_SECRET_KEY: $LIVESECRET_PASSWORD
        PGHOST: plane-db
        PGDATABASE: plane
        POSTGRES_USER: $POSTGRES_USER
        POSTGRES_PASSWORD: $POSTGRES_PASSWORD
        POSTGRES_DB: plane
        POSTGRES_PORT: 5432
        PGDATA: /var/lib/postgresql/data
        REDIS_HOST: ${REDIS_HOST:-plane-redis}
        REDIS_PORT: ${REDIS_PORT:-6379}
        REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}
        MINIO_ROOT_USER: $MINIO_USER
        MINIO_ROOT_PASSWORD: $MINIO_PASSWORD
        AWS_REGION: ${AWS_REGION:-}
        AWS_ACCESS_KEY_ID: $MINIO_USER
        AWS_SECRET_ACCESS_KEY: $MINIO_PASSWORD
        AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
        AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
        APP_DOMAIN: ${PLANE_URL}
        FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
        BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
        SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      depends_on:
        - plane-db
        - plane-redis
        - plane-mq
      healthcheck:
        test: [CMD, echo, hey whats up]
        interval: 2s
        timeout: 10s
        retries: 15
    worker:
      image: makeplane/plane-backend:${APP_RELEASE:-v1.3.0}
      restart: unless-stopped
      command: ./bin/docker-entrypoint-worker.sh
      volumes:
        - logs_worker:/code/plane/logs
      environment:
        APP_RELEASE: ${APP_RELEASE:-v1.3.0}
        WEB_URL: ${PLANE_URL}
        DEBUG: ${DEBUG:-0}
        CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
        GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
        USE_MINIO: ${USE_MINIO:-1}
        DATABASE_URL: postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@plane-db/plane
        SECRET_KEY: $SECRETKEY_PASSWORD
        AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@plane-mq:${RABBITMQ_PORT:-5672}/plane
        API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
        MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
        LIVE_SERVER_SECRET_KEY: $LIVESECRET_PASSWORD
        PGHOST: plane-db
        PGDATABASE: plane
        POSTGRES_USER: $POSTGRES_USER
        POSTGRES_PASSWORD: $POSTGRES_PASSWORD
        POSTGRES_DB: plane
        POSTGRES_PORT: 5432
        PGDATA: /var/lib/postgresql/data
        REDIS_HOST: ${REDIS_HOST:-plane-redis}
        REDIS_PORT: ${REDIS_PORT:-6379}
        REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}
        MINIO_ROOT_USER: $MINIO_USER
        MINIO_ROOT_PASSWORD: $MINIO_PASSWORD
        AWS_REGION: ${AWS_REGION:-}
        AWS_ACCESS_KEY_ID: $MINIO_USER
        AWS_SECRET_ACCESS_KEY: $MINIO_PASSWORD
        AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
        AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
        APP_DOMAIN: ${PLANE_URL}
        FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
        BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
        SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      depends_on:
        - api
        - plane-db
        - plane-redis
        - plane-mq
      healthcheck:
        test: [CMD, echo, hey whats up]
        interval: 2s
        timeout: 10s
        retries: 15
    beat-worker:
      image: makeplane/plane-backend:${APP_RELEASE:-v1.3.0}
      restart: unless-stopped
      command: ./bin/docker-entrypoint-beat.sh
      volumes:
        - logs_beat-worker:/code/plane/logs
      environment:
        APP_RELEASE: ${APP_RELEASE:-v1.3.0}
        WEB_URL: ${PLANE_URL}
        DEBUG: ${DEBUG:-0}
        CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
        GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
        USE_MINIO: ${USE_MINIO:-1}
        DATABASE_URL: postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@plane-db/plane
        SECRET_KEY: $SECRETKEY_PASSWORD
        AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@plane-mq:${RABBITMQ_PORT:-5672}/plane
        API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
        MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
        LIVE_SERVER_SECRET_KEY: $LIVESECRET_PASSWORD
        PGHOST: plane-db
        PGDATABASE: plane
        POSTGRES_USER: $POSTGRES_USER
        POSTGRES_PASSWORD: $POSTGRES_PASSWORD
        POSTGRES_DB: plane
        POSTGRES_PORT: 5432
        PGDATA: /var/lib/postgresql/data
        REDIS_HOST: ${REDIS_HOST:-plane-redis}
        REDIS_PORT: ${REDIS_PORT:-6379}
        REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}
        MINIO_ROOT_USER: $MINIO_USER
        MINIO_ROOT_PASSWORD: $MINIO_PASSWORD
        AWS_REGION: ${AWS_REGION:-}
        AWS_ACCESS_KEY_ID: $MINIO_USER
        AWS_SECRET_ACCESS_KEY: $MINIO_PASSWORD
        AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
        AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
        APP_DOMAIN: ${PLANE_URL}
        FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
        BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
        SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      depends_on:
        - api
        - plane-db
        - plane-redis
        - plane-mq
      healthcheck:
        test: [CMD, echo, hey whats up]
        interval: 2s
        timeout: 10s
        retries: 15
    migrator:
      image: makeplane/plane-backend:${APP_RELEASE:-v1.3.0}
      restart: no
      command: ./bin/docker-entrypoint-migrator.sh
      volumes:
        - logs_migrator:/code/plane/logs
      environment:
        APP_RELEASE: ${APP_RELEASE:-v1.3.0}
        WEB_URL: ${PLANE_URL}
        DEBUG: ${DEBUG:-0}
        CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
        GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
        USE_MINIO: ${USE_MINIO:-1}
        DATABASE_URL: postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@plane-db/plane
        SECRET_KEY: $SECRETKEY_PASSWORD
        AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@plane-mq:${RABBITMQ_PORT:-5672}/plane
        API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
        MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
        LIVE_SERVER_SECRET_KEY: $LIVESECRET_PASSWORD
        PGHOST: plane-db
        PGDATABASE: plane
        POSTGRES_USER: $POSTGRES_USER
        POSTGRES_PASSWORD: $POSTGRES_PASSWORD
        POSTGRES_DB: plane
        POSTGRES_PORT: 5432
        PGDATA: /var/lib/postgresql/data
        REDIS_HOST: ${REDIS_HOST:-plane-redis}
        REDIS_PORT: ${REDIS_PORT:-6379}
        REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}
        MINIO_ROOT_USER: $MINIO_USER
        MINIO_ROOT_PASSWORD: $MINIO_PASSWORD
        AWS_REGION: ${AWS_REGION:-}
        AWS_ACCESS_KEY_ID: $MINIO_USER
        AWS_SECRET_ACCESS_KEY: $MINIO_PASSWORD
        AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
        AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
        APP_DOMAIN: ${PLANE_URL}
        FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
        BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
        SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      depends_on:
        - plane-db
        - plane-redis
    plane-db:
      image: postgres:15.7-alpine
      restart: unless-stopped
      command: postgres -c 'max_connections=1000'
      environment:
        PGHOST: plane-db
        PGDATABASE: plane
        POSTGRES_USER: $POSTGRES_USER
        POSTGRES_PASSWORD: $POSTGRES_PASSWORD
        POSTGRES_DB: plane
        POSTGRES_PORT: 5432
        PGDATA: /var/lib/postgresql/data
      volumes:
        - pgdata:/var/lib/postgresql/data
      healthcheck:
        test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 20s
        retries: 10
    plane-redis:
      image: valkey/valkey:7.2.11-alpine
      restart: unless-stopped
      volumes:
        - redisdata:/data
      healthcheck:
        test: [CMD, redis-cli, ping]
        interval: 5s
        timeout: 20s
        retries: 10
    plane-mq:
      image: rabbitmq:3.13.6-management-alpine
      restart: unless-stopped
      environment:
        RABBITMQ_HOST: plane-mq
        RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
        RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plane}
        RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-plane}
        RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
        RABBITMQ_VHOST: ${RABBITMQ_VHOST:-plane}
      volumes:
        - rabbitmq_data:/var/lib/rabbitmq
      healthcheck:
        test: rabbitmq-diagnostics -q check_port_connectivity
        interval: 30s
        timeout: 30s
        retries: 3
        start_period: 60s
    plane-minio:
      image: pgsty/silo:RELEASE.2026-10-15T00-00-00Z
      restart: unless-stopped
      command: server /export --console-address ":9090"
      environment:
        MINIO_ROOT_USER: $MINIO_USER
        MINIO_ROOT_PASSWORD: $MINIO_PASSWORD
      volumes:
        - uploads:/export
      healthcheck:
        test: [CMD, mc, ready, local]
        interval: 5s
        timeout: 20s
        retries: 10
  volumes:
    proxy_config:
    proxy_data:
    logs_api:
    logs_worker:
    logs_beat-worker:
    logs_migrator:
    pgdata:
    redisdata:
    rabbitmq_data:
    uploads:
