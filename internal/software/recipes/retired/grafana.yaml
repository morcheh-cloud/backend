id: grafana
name: Grafana
summary: Dashboards and alerts for your metrics and logs.
kind: docker
category: Monitoring
icon: chart-line
logo: grafana
website: https://grafana.com/oss/grafana/
requires: [docker]
params:
  - name: PORT
    label: Port
    type: port
    default: "3000"
  - name: ADMIN_PASSWORD
    label: Admin password
    help: Leave empty to have one made for each server.
    type: password
    generate: password
links:
  - label: Grafana
    port: PORT
notes: Sign in as admin with the admin password (Reveal it from the app's page).
compose: |
  services:
    grafana:
      image: grafana/grafana:latest
      restart: unless-stopped
      ports:
        - "${PORT}:3000"
      environment:
        GF_SECURITY_ADMIN_USER: admin
        GF_SECURITY_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      volumes:
        - data:/var/lib/grafana
  volumes:
    data:
