name: morcheh

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: morcheh
      POSTGRES_PASSWORD: morcheh
      POSTGRES_DB: morcheh
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morcheh -d morcheh"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "morcheh", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "morcheh", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local SSH target for testing (user ant / colony, passwordless sudo).
  # /config keeps the host keys and home across recreates.
  test-ssh:
    build:
      dockerfile_inline: |
        FROM lscr.io/linuxserver/openssh-server
        RUN echo "ant ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/ant \
          && chmod 440 /etc/sudoers.d/ant
    environment:
      USER_NAME: ant
      USER_PASSWORD: colony
      PASSWORD_ACCESS: "true"
    ports:
      - "127.0.0.1:2222:2222"
    volumes:
      - sshconfig:/config

  # Local S3 target for testing (morcheh / morcheh-secret).
  # API on :9100 (what a storage connects to), web console on :9101.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: morcheh
      MINIO_ROOT_PASSWORD: morcheh-secret
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
  sshconfig:
  miniodata:
