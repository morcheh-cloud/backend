name: morche

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: morche
      POSTGRES_PASSWORD: morche
      POSTGRES_DB: morche
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morche -d morche"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "morche", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "morche", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local S3 target for testing (morche / morche-secret).
  # API on :9100 (what a storage connects to), web console on :9101.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: morche
      MINIO_ROOT_PASSWORD: morche-secret
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # A second MinIO, to test MinIO replication between two storages
  # (Storage > Syncs, engine replication). The first MinIO reaches it at
  # http://test-minio-2:9000 (the sync's "MinIO reaches it at" field).
  test-minio-2:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: morche
      MINIO_ROOT_PASSWORD: morche-secret
    ports:
      - "127.0.0.1:9110:9000"
      - "127.0.0.1:9111:9001"
    volumes:
      - minio2data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local FTP target for testing (ant / colony).
  # Passive data ports need the same numbers inside and out.
  test-ftp:
    image: docker.arvancloud.ir/delfer/alpine-ftp-server:latest
    environment:
      ADDRESS: 127.0.0.1
      MIN_PORT: 21000
      MAX_PORT: 21010
      USERS: ant|colony|/ftp/ant
    ports:
      - "127.0.0.1:2121:21"
      - "127.0.0.1:21000-21010:21000-21010"
    volumes:
      - ftpdata:/ftp
    healthcheck:
      test: ["CMD-SHELL", "nc -w 2 127.0.0.1 21 </dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local WebDAV target for testing (ant / colony).
  test-webdav:
    image: docker.arvancloud.ir/bytemark/webdav:latest
    environment:
      AUTH_TYPE: Basic
      USERNAME: ant
      PASSWORD: colony
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - webdavdata:/var/lib/dav
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/80"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local targets for the Database section (monitored databases, not the app's
  # own Postgres and Redis). Reachable directly on localhost.
  test-postgres:
    image: postgres:18-alpine
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_USER: ant
      POSTGRES_PASSWORD: colony
      POSTGRES_DB: shop
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - testpgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ant -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10

  test-mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: colony
      MYSQL_DATABASE: shop
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - testmysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pcolony --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  test-mariadb:
    image: mariadb:11.8
    # Binary log on, so incremental backups can be tried.
    command: ["--log-bin=mysql-bin", "--binlog-format=ROW", "--server-id=1"]
    environment:
      MARIADB_ROOT_PASSWORD: colony
      MARIADB_DATABASE: shop
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - testmariadata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

  # sa / Colony-2026! (SQL Server refuses weak passwords).
  test-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Colony-2026!
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: "1536"
    ports:
      - "127.0.0.1:14330:1433"
    volumes:
      - testmssqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Colony-2026!' -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  test-mongo:
    # 8.0+ refuses to start on Linux 6.19+ kernels (SERVER-121912).
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ant
      MONGO_INITDB_ROOT_PASSWORD: colony
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - testmongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  test-redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "colony"]
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - testredisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "colony", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  test-clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: ant
      CLICKHOUSE_PASSWORD: colony
      CLICKHOUSE_DB: shop
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:8124:8123"
    volumes:
      - testclickhousedata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client -u ant --password colony -q 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Two authoritative DNS servers for the /dns section. Web UI and API on 5381
  # and 5382, DNS on 5354 and 5355 (TCP and UDP). admin / colony.
  test-dns-1:
    image: technitium/dns-server:15.6.2
    environment:
      DNS_SERVER_DOMAIN: ns1.morche.test
      DNS_SERVER_ADMIN_PASSWORD: colony
    ports:
      - "127.0.0.1:5381:5380/tcp"
      - "127.0.0.1:5354:53/tcp"
      - "127.0.0.1:5354:53/udp"
    volumes:
      - testdns1data:/etc/dns

  test-dns-2:
    image: technitium/dns-server:15.6.2
    environment:
      DNS_SERVER_DOMAIN: ns2.morche.test
      DNS_SERVER_ADMIN_PASSWORD: colony
    ports:
      - "127.0.0.1:5382:5380/tcp"
      - "127.0.0.1:5355:53/tcp"
      - "127.0.0.1:5355:53/udp"
    volumes:
      - testdns2data:/etc/dns

  # PostgreSQL continuous backup (PITR) target (dev/test-pitr): Debian's
  # PostgreSQL + sshd. SSH on 2225: ops / colony (passwordless sudo).
  # Its repo is test-minio-tls, at https://127.0.0.1:9120 from here and there.
  test-pitr:
    build: dev/test-pitr
    ports:
      - "127.0.0.1:2225:22"
    volumes:
      - testpitrdata:/var/lib/postgresql
    depends_on:
      - test-minio-tls

  # MinIO over HTTPS (self-signed) for pgBackRest repos: morche / morche-secret.
  test-minio-tls:
    build: dev/test-minio-tls
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: morche
      MINIO_ROOT_PASSWORD: morche-secret
    ports:
      - "127.0.0.1:9120:9000"
      - "127.0.0.1:9121:9001"
    volumes:
      - miniotlsdata:/data

  # Docker in Docker over SSH for the Containers section (dev/test-docker).
  # SSH on 2224: ant / colony (docker group), ops / colony (sudo only).
  test-docker:
    build: dev/test-docker
    privileged: true
    ports:
      - "127.0.0.1:2224:22"
    volumes:
      - testdockerdata:/var/lib/docker

  # Fake ArvanCloud API for the Cloud section (cmd/fakearvan). Backend env:
  # ARVAN_FAKE_URL=http://127.0.0.1:8091/%s/v3; key fake-arvan-0000-4000-8000-000000000000.
  test-arvan:
    build:
      context: .
      dockerfile: dev/fakearvan/Dockerfile
    ports:
      - "127.0.0.1:8091:8091"

volumes:
  pgdata:
  redisdata:
  miniodata:
  minio2data:
  miniotlsdata:
  testpitrdata:
  ftpdata:
  webdavdata:
  testpgdata:
  testmysqldata:
  testmariadata:
  testmssqldata:
  testmongodata:
  testredisdata:
  testclickhousedata:
  testdns1data:
  testdns2data:
  testdockerdata:
